651447", "category": "산업", "published_at": "2026-08-04", "title": "[Monthly] 자동차/2차전지", "author": "이현욱", "source": "IBK투자증권", "company_name": null, "stock_code": null, "industry_name": "자동차/2차전지", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "2026년 6월 기준 글로벌 자동차 및 2차전지 산업은 완만한 성장세를 보이고 있음. 특히 글로벌 전기차 판매가 증가하며 BEV 비중 확대가 뚜렷하고, 배터리 출하량도 크게 늘어 2차전지 산업의 성장 모멘텀을 강화하고 있음. 지역별로는 유럽시장이 두드러진 성장세를 나타내고 있으나 중국과 미국은 전년 대비 판매가 소폭 감소하는 등 지역별 차별화된 시장 상황이 관찰됨. 향후 글로벌 전기차 시장의 성장과 배터리 수요 증가가 지속될 것으로 예상되나, 중국 시장 판매 감소와 일부 지역의 정책·수급 리스크는 주의할 필요가 있음.", "key_points": ["2026년 6월 글로벌 자동차 출하량은 전월 대비 4.7%, 전년 대비 2.7% 증가함.", "글로벌 전기차 판매량은 2026년 6월 기준 211만대(BEV+PHEV)로 월간 12.1%, 연간 10.9% 증가세 유지.", "전기차 유형별 판매 비중은 BEV 48.6%, PHEV 17.7%, HEV 33.7%이며, BEV 비중과 판매량이 꾸준히 상승 중.", "지역별 전기차 판매는 중국 114.5만대(전년 대비 -6.0%), 유럽 53.9만대(전년 대비 +34.5%), 미국 11.9만대(전년 대비 -7.5%)로, 유럽시장이 강한 성장세를 보임.", "배터리 출하량은 전월 대비 15.2%, 전년 대비 30.4% 증가하여 2차전지 시장 성장에 기여 중.", "전기차 판매 시장은 중국, 유럽, 미국 순이며, 중국은 판매대수가 가장 많으나 전년 대비 감소세를 보이고 있음.", "전기차 침투율이 글로벌적으로 상승하며 BEV 중심의 시장 확대가 확인됨."], "risks": ["중국 시장에서의 전기차 판매 감소가 지속될 위험 존재.", "PHEV 판매 감소 및 일부 지역에서의 EV 판매 둔화 가능성.", "글로벌 경기 및 정책 변화에 따른 수급 불안정성과 성장세 둔화 우려."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/651447.pdf", "json_path": "../reports_json/산업/651447.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651447"}, {"report_idx": "651432", "category": "산업", "published_at": "2026-08-04", "title": "안녕하세요 데일리에요", "author": "양승윤", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "로봇 / 기계 / 운송 / 조선 / 방산", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "한국의 로봇, 방산, 조선 산업은 기술개발, 수주 확대, 해외 협력 강화 및 정부 정책 지원 등의 긍정적 요인이 산재함. 특히, AI 소프트웨어 완전 개방과 휴머노이드 R&D 활발, 재활로봇 상용화 진전은 로봇산업의 경쟁력을 높이고 있다. 방산 분야는 글로벌 수주 및 미군과의 협력 사업 확대, 태국 및 칠레 등 해외시장 진출이 긍정적인 수급 및 체인 이슈로 작용하고 있다. 조선업은 대형 LNG 추진설비 및 차세대 함정 수주가 계속되며 수주잔고 증가와 함께 업황 개선 기대를 모은다. 전반적으로 관련 산업들은 기술 혁신과 해외시장 공략을 중심으로 성장 모멘텀을 유지하고 있다.", "key_points": ["국내 로봇업계는 AI 소프트웨어의 완전 개방과 휴머노이드 연구개발 현장 점검 등 기술 개발이 활발하다.", "로보틱스 분야에서는 재활로봇이 소아뇌성마비 건보 적용을 받는 등 상용화 진전이 관찰된다.", "해외 로봇업체는 매출 목표 상향과 일부 기업의 영업이익 변동으로 주가 변동이 있었다.", "방산 분야에서는 한화가 칠레에 다양한 무기체계 제안을 진행 중이며 미군과 협력 사업 확대, 북미 및 일본 기업과의 협력이 이루어지고 있다.", "조선업계는 삼성중공업, 한화오션 등이 대규모 LNG 추진설비 및 함정 수주를 성공하는 등 수주 모멘텀이 지속되고 있다.", "태국 외교부 차관의 방한으로 한화오션이 태국 차세대 호위함 사업 유력 후보로 부상하며 관련 수주 기대가 증가하고 있다.", "미국에서는 노스롭그루먼, L3Harris 등이 고체 로켓 모터 생산 확대 및 생산시설 신설에 나서며 방산 추진체 산업의 생산 CAPA 확장 중이다."], "risks": [], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/651432.pdf", "json_path": "../reports_json/산업/651432.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651432"}, {"report_idx": "651431", "category": "산업", "published_at": "2026-08-04", "title": "opec+ 자발적 감산 종료", "author": "황성현", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "-", "market_topic": "OPEC+ 자발적 감산 종료 및 향후 생산 정책", "investment_opinion": null, "target_price": null, "summary": "OPEC+가 9월부터 18.8만 배럴 규모의 원유 증산을 단행하면서 2023년부터 시행된 자발적 감산을 사실상 종료했다. 주요 산유국들은 6개월째 증산세를 유지하고 있으나, 미국과 이란 간 군사 긴장 및 관련 에너지 인프라 피해로 인해 단기 공급 증가는 불확실한 상황이다. 9월 초 예정된 OPEC+ 회의에서의 4분기 생산 정책과 이란 원유 수출 및 지역 해상로 정상화가 유가 향방에 핵심 변수로 작용할 전망이다. 2022년부터 유지된 총 200만 배럴 감산 정책은 당분간 지속될 예정이며, 생산능력 재평가를 둘러싸고 회원국 간 갈등이 심화될 가능성도 존재한다. 국제유가는 미국·이란 긴장 완화 기대와 증산 결정으로 단기 급락했으나, 에너지 시설 복구 지연 위험으로 높은 변동성이 예상된다. 주요 에너지 및 화학 제품 가격은 대부분 하락세를 보였으며, 태양광 및 관련 원자재 시장도 혼조세를 유지 중이다. 전반적으로 향후 산업 수급과 정책, 지정학 리스크에 대한 면밀한 모니터링이 필수적이다.", "key_points": ["OPEC+는 9월부터 18.8만 배럴/일(b/d) 원유 생산량 증산을 결정하며 2023년부터 시행한 165만 b/d 추가 자발적 감산을 사실상 완전히 종료함.", "7개 주요 산유국(사우디아라비아, 러시아, 이라크, 쿠웨이트, 카자흐스탄, 알제리, 오만)은 6개월 연속 증산 기조를 유지중.", "미국과 이란 간 군사 긴장 및 에너지 시설 피해로 인해 실제 공급 증가가 제한될 수 있으며, OPEC+도 단기 공급 회복에 불확실성이 있다고 평가.", "9월 6일 OPEC+ 회의에서 4분기 생산 정책 결정 예정으로, 이란 원유 수출과 호르무즈 및 홍해 해상로 정상화가 관건임.", "2022년부터의 전체 200만 b/d 감산은 연말까지 유지되어 증산은 일부 국가의 감산분 단계적 복원에 해당.", "시장 점유율 조정을 둘러싼 회원국 간 갈등 확대 가능성 존재.", "국제유가는 미국·이란 긴장 완화 기대와 OPEC+ 증산 결정이 뒤섞여 단기 급락했으며, 공급 과잉 우려와 에너지 시설 복구 지연이 유가 변동성 요인.", "에너지, 화학, 태양광 주요 제품 가격은 대부분 약세를 보임.", "중국 시장 선물가격은 일부 제품 중심으로 혼조세를 나타냄."], "risks": ["지정학적 리스크 완화 여부에 따른 국제유가 변동성 리스크.", "미국·이란 간 긴장 지속 시 시설 복구 지연과 공급 차질 가능성.", "OPEC+ 회원국 간 생산능력 재평가 및 쿼터 조정에 따른 시장 점유율 경쟁 심화 위험.", "글로벌 수급 불확실성으로 인한 가격 변동성 높음."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/651431.pdf", "json_path": "../reports_json/산업/651431.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651431"}, {"report_idx": "651430", "category": "산업", "published_at": "2026-08-04", "title": "무엇이 중요한가?", "author": "손인준", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "반도체", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "반도체 산업에서는 메모리 업종 조정이 AI 관련 자본지출 부담과 국채금리, 중국 CXMT 상장에 의한 수급 변화에서 기인한다. 빅테크의 지속적인 인프라 투자를 위해서는 금리 안정과 영업현금흐름 증가, 하드웨어 가격 하락이 필요하며, 메모리 가격 하락이 부담 완화에 중요한 변수다. CXMT는 전략적 자산이나 시장 경쟁 구도에 미칠 영향은 제한적이다. NVIDIA의 HBM 수요 구조 변화와 DRAM 공급 부족이 병목을 야기하며, 하이퍼스케일러의 AI 투자 지속과 AI 시장 성장 속에서 DRAM이 핵심 병목으로 남을 전망이다. 투자심리 회복과 주가 반등 가능성이 있다.", "key_points": ["메모리 업종의 최근 조정은 AI 자본지출 부담, 국채금리 상승, CXMT 상장 등 수급 변화 영향임.", "빅테크의 지속적 인프라 투자를 위해 국채 금리 안정, OCF 성장, 하드웨어 가격 하락 필요.", "메모리 가격 하락 기대감에 시장은 AI 인프라 투자 부담 완화를 베팅 중임.", "CXMT는 중국 메모리 자립의 전략적 자산으로 단기 수급 부담과 주가 하락 원인이나 경쟁 구도 변화 제한적임.", "NVIDIA는 2027년 Rubin Ultra 가속기 출시 시 HBM 수요 전환으로 수요 일부 감소 가능성 있음.", "DRAM 공급 부족이 HBM 공급 증가 제약하며, 메모리 부족이 스마트폰·PC 생산 차질으로 이어짐.", "하이퍼스케일러의 AI 투자와 AI 시장 성장에 따른 DRAM 병목 현상 지속 전망.", "조기 주주환원 정책이 투자심리 회복 촉진 가능성이 있고, 메모리 업종 주가 회복 본격화 예상."], "risks": ["AI CapEx 지속 가능성 불확실성 관련 빅테크 FCF 감소 및 CDS 프리미엄 상승.", "CXMT 상장으로 인한 단기적인 주식 수급 부담과 주가 변동성 존재.", "DRAM 공급 부족으로 인한 컨슈머 제품 생산 차질 가능성.", "HBM 공급 부족으로 인한 가속기 생산 제약 위험."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/651430.pdf", "json_path": "../reports_json/산업/651430.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651430"}, {"report_idx": "651427", "category": "산업", "published_at": "2026-08-04", "title": "하이퍼스케일러 실적과 오픈웨이트 모델의 함의점", "author": "박재환", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "글로벌 테크", "market_topic": "하이퍼스케일러 실적과 오픈웨이트 모델의 함의점", "investment_opinion": null, "target_price": null, "summary": "글로벌 주요 하이퍼스케일러 4사는 2026년 약 7,500억 달러의 대규모 캐팩스 투자를 계획하며, AI 인프라 확장에 적극 나서고 있다. 이들의 잔여 계약 이행 의무(RPO) 및 클라우드 성장률이 크게 증가해 AI 및 클라우드 서비스의 강력한 수요를 뒷받침한다. 일부 기업의 잉여현금흐름(FCF) 음전 우려는 있으나, 전체적으로 영업활동현금흐름으로 캐팩스 부담은 관리 가능하며, 클라우드 사업 수익성도 개선되고 있다. 또한 오픈웨이트 모델 확산은 기존 AI 반도체 수요 잠식 우려 대신 차세대 고성능 인프라 수요를 촉진해 산업 성장의 긍정적 요소로 작용한다. 전반적으로 불확실성에도 불구하고 AI 인프라 투자 사이클은 여전히 유효하며, 중장기적으로 AI 반도체 및 클라우드 생태계의 확장에 긍정적인 산업 환경을 조성하고 있다.", "key_points": ["2026년 하이퍼스케일러 4사의 합산 캐팩스 가이던스는 약 7,500억 달러로 전년 대비 82% 증가하며, 2027년에도 투자가 확대될 것임을 시사한다.", "RPO(잔여계약 이행의무) 및 클라우드 성장률이 매우 높아 장기 수요가 견조함을 확인할 수 있다 (구글 82%, Azure 43%, AWS 37%).", "아마존과 구글의 FCF는 음전으로 재무 건전성 우려가 있으나, 합산 영업활동현금흐름(CFO)은 캐팩스를 초과해 관리 가능한 리스크로 판단된다.", "오픈웨이트 모델의 확산은 AI 반도체 수요를 잠식할 우려가 있었으나, 대규모 AI 인프라 수요 증가 및 차세대 고성능 XPU 인프라 수요 증가로 오히려 반도체에 긍정적 영향으로 작용한다.", "클라우드 사업의 수익성도 개선 중이며, 일부 하이퍼스케일러는 캐팩스 투자금을 3년 내 회수 가능하다고 언급함."], "risks": ["하이퍼스케일러 일부의 FCF 음전으로 인한 재무 건전성 우려 존재", "캐팩스 투자 확대에 따른 자금 조달 부담 증가 가능성", "금리 불확실성에 따른 자금 조달 비용 상승 위험"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/651427.pdf", "json_path": "../reports_json/산업/651427.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651427"}, {"report_idx": "651446", "category": "기업", "published_at": "2026-08-04", "title": "iM금융지주(139130) 주주환원 확대기조 유지", "author": "전배승", "source": "LS증권", "compa         <div class="price-box">
          <div class="price-label">${formatQuoteAsOf(group.live_price_as_of)}</div>
          <div class="price-main">${safe(group.live_price)}원</div>
          <div class="price-change ${directionClass}">${change}</div>
          ${high52w ? `<div class="price-extra">52주 최고가 ${high52w}원</div>` : ""}
          ${renderSparkline(group.price_history)}
        </div>
      `;
    }

    function renderAlphaBox(item) {
      if (item.alpha_score === null || item.alpha_score === undefined) return "";
      return `
        <div class="score-box">
          <div class="score-grade">Alpha ${safe(item.alpha_grade || "-")}</div>
          <div class="score-main">${safe(item.alpha_score)}</div>
          <div class="score-sub">${safe(item.score_reason || "")}</div>
        </div>
      `;
    }

    function stockWebUrl(stockCode) {
      if (!stockCode) return "";
      return `https://finance.naver.com/item/main.naver?code=${encodeURIComponent(stockCode)}`;
    }

    async function copyStockCode(stockCode) {
      if (!stockCode) return;
      try {
        await navigator.clipboard.writeText(String(stockCode));
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = String(stockCode);
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      alert(`종목코드 복사: ${stockCode}`);
    }

    async function fetchReportsForDate(date) {
      if (!date) return [];
      if (reportCache.has(date)) return reportCache.get(date) || [];
      try {
        const response = await fetch(`./archive/${date}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const nextReports = payload.reports || [];
        reportCache.set(date, nextReports);
        return nextReports;
      } catch (error) {
        return null;
      }
    }

    async function ensureHistoryLoaded() {
      if (historyLoaded) return true;
      for (const date of availableDates) {
        const loaded = await fetchReportsForDate(date);
        if (loaded === null) return false;
      }
      historyLoaded = true;
      return true;
    }

    function allCachedReports() {
      return Array.from(reportCache.values()).flat();
    }

    function stockCatalog() {
      const grouped = new Map();
      for (const item of allCachedReports()) {
        if (item.category !== "기업" || !item.stock_code) continue;
        const key = item.stock_code;
        if (!grouped.has(key)) {
          grouped.set(key, {
            stock_code: item.stock_code,
            company_name: item.company_name || item.title || item.stock_code,
            report_count: 0,
            dates: new Set(),
            latest_date: item.published_at || "",
          });
        }
        const stock = grouped.get(key);
        stock.report_count += 1;
        if (item.company_name) stock.company_name = item.company_name;
        if (item.published_at) stock.dates.add(item.published_at);
        if ((item.published_at || "") > stock.latest_date) stock.latest_date = item.published_at || "";
      }
      return Array.from(grouped.values());
    }

    function renderSearchResults(htmlText) {
      document.getElementById("search-results").innerHTML = htmlText;
    }

    function renderHistoryEmpty(message) {
      const root = document.getElementById("history-section");
      root.innerHTML = `<div class="history-empty">${safe(message)}</div>`;
    }

    function matchingStocks(query) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return [];
      return stockCatalog()
        .map((item) => {
          const name = String(item.company_name || "").toLowerCase();
          const code = String(item.stock_code || "").toLowerCase();
          let score = -1;
          if (code === keyword) score = 100;
          else if (name === keyword) score = 95;
          else if (code.startsWith(keyword)) score = 80;
          else if (name.startsWith(keyword)) score = 70;
          else if (code.includes(keyword)) score = 60;
          else if (name.includes(keyword)) score = 50;
          return { ...item, score };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => {
          const scoreDiff = b.score - a.score;
          if (scoreDiff !== 0) return scoreDiff;
          const dateDiff = (b.latest_date || "").localeCompare(a.latest_date || "");
          if (dateDiff !== 0) return dateDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });
    }

    function renderHistoryReportCard(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" 쨌 ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <h3 class="history-report-title">${safe(item.title)}</h3>
            <div class="report-brief">${meta}</div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStock(stockCode) {
      renderHistoryForStockCompact(stockCode);
    }

    function renderHistoryReportCardCompact(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" / ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <div class="history-title-row">
              <h3 class="history-report-title">${safe(item.title)}</h3>
              ${item.published_at ? `<span class="badge">${safe(item.published_at)}</span>` : ""}
            </div>
            <div class="report-brief">${meta}</div>
            <p class="summary">${safe(item.summary)}</p>
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문</a>
            </div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStockCompact(stockCode) {
      const entries = allCachedReports()
        .filter((item) => item.stock_code === stockCode)
        .sort((a, b) => {
          const dateDiff = (b.published_at || "").localeCompare(a.published_at || "");
          if (dateDiff !== 0) return dateDiff;
          return String(b.report_idx || "").localeCompare(String(a.report_idx || ""));
        });
      const root = document.getElementById("history-section");
      if (!entries.length) {
        renderHistoryEmpty("?대떦 醫낅ぉ????λ맂 ?대젰???놁뒿?덈떎.");
        return;
      }

      const companyName = entries.find((item) => item.company_name)?.company_name || stockCode;
      const uniqueDates = new Set(entries.map((item) => item.published_at).filter(Boolean));
      const bestEntry = entries.find((item) => item.alpha_score !== null && item.alpha_score !== undefined);
      const cards = entries.map((item) => renderHistoryReportCardCompact(item)).join("");

      root.innerHTML = `
        <article class="group-card history-group-card">
          <div class="group-head">
            <div>
              <div class="group-title-row">
                <h2 class="group-title">${safe(companyName)}</h2>
              </div>
            </div>
          </div>
          <div class="group-meta">
            <span class="pill"><button type="button" data-copy-stock="${safe(stockCode)}">종목코드 복사</button></span>
            <span class="pill"><a href="${stockWebUrl(stockCode)}" target="_blank" rel="noreferrer">네이버금융</a></span>
          </div>
          <div class="report-stack">${cards}</div>
        </article>
      `;
    }

    async function runStockSearch() {
      const input = document.getElementById("stock-search");
      const query = String(input.value || "").trim();
      if (!query) {
        renderSearchResults("");
        renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
        return;
      }

      renderSearchResults('<span class="badge">아카이브 확인 중...</span>');
      const loaded = await ensureHistoryLoaded();
      if (!loaded) {
        renderSearchResults("");
        renderHistoryEmpty("아카이브를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      const matches = matchingStocks(query).slice(0, 12);
      if (!matches.length) {
        renderSearchResults("");
        renderHistoryEmpty(`"${query}"와 일치하는 종목 이력이 없습니다.`);
        return;
      }

      renderSearchResults(
        matches
          .map(
            (item) => `
              <button type="button" data-stock-history="${safe(item.stock_code)}">
                ${safe(item.company_name)} (${safe(item.stock_code)}) · ${item.report_count}건
              </button>
            `
          )
          .join("")
      );
      renderHistoryForStockCompact(matches[0].stock_code);
    }

    function renderFactorSections(item) {
      if (item.category !== "기업") return "";
      const sections = [];
      if (item.revision_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Revision Signal</div><p class="factor-text">${safe(item.revision_signal)}</p></div>`);
      }
      if (item.structural_growth_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Structural Growth</div><p class="factor-text">${safe(item.structural_growth_signal)}</p></div>`);
      }
      if (item.valuation_risk_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Valuation / Risk</div><p class="factor-text">${safe(item.valuation_risk_signal)}</p></div>`);
      }
      const positiveText = (item.positive_factors || []).map((value) => `+ ${safe(value)}`).join("<br>");
      const negativeText = (item.negative_factors || []).map((value) => `- ${safe(value)}`).join("<br>");
      if (positiveText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Positive Factors</div><p class="factor-text">${positiveText}</p></div>`);
      }
      if (negativeText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Negative Factors</div><p class="factor-text">${negativeText}</p></div>`);
      }
      if (item.market_reaction_placeholder) {
        sections.push(`<div class="factor-box"><div class="factor-title">Market Reaction</div><p class="factor-text">D+1 / D+5 / D+20 추후 연결 예정</p></div>`);
      }
      return sections.length ? `<div class="factor-grid">${sections.join("")}</div>` : "";
    }

    function renderGrouped(items) {
      const root = document.getElementById("list");
      const { groupedCompanies, industry, market } = groupedData(items);

      const groupCards = groupedCompanies.map((group) => {
        const reportsHtml = group.reports.map((report) => {
          const pointItems = (report.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
          return `
            <details class="report-detail">
              <summary>
                <div>
                  <div>${safe(report.title)}</div>
                  <div class="report-brief">${[
                    safe(report.source),
                    safe(report.author),
                    [safe(report.investment_opinion), safe(report.target_price)].filter(Boolean).join(" "),
                    upsideLabel(report),
                  ].filter(Boolean).join(" · ")}</div>
                </div>
                <div>
                  ${report.alpha_score !== null && report.alpha_score !== undefined ? `<div class="badge">${safe(report.alpha_grade || "-")} ${safe(report.alpha_score)}</div>` : ""}
                  <div class="badge">#${safe(report.report_idx)}</div>
                </div>
              </summary>
              <div class="report-body">
                <p class="summary">${safe(report.summary)}</p>
                ${pointItems ? `<ul class="points">${pointItems}</ul>` : ""}
                ${renderFactorSections(report)}
                <div class="links">
                  <a href="${safe(report.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
                </div>
              </div>
            </details>
          `;
        }).join("");

        return `
          <article class="group-card">
            <div class="group-head">
              <div>
                <div class="group-title-row">
                  <h2 class="group-title">${safe(group.company_name)}</h2>
                  ${renderPriceBox(group)}
                </div>
              </div>
            </div>
            <div class="group-meta">
              ${group.stock_code ? `<span class="pill"><button type="button" data-copy-stock="${safe(group.stock_code)}">종목코드 복사</button></span>` : ""}
              ${group.stock_code ? `<span class="pill"><a href="${stockWebUrl(group.stock_code)}" target="_blank" rel="noreferrer">네이버금융</a></span>` : ""}
            </div>
            <div class="report-stack">${reportsHtml}</div>
          </article>
        `;
      }).join("");

      const renderStandaloneSection = (title, entries) => entries.length
        ? `
          <div class="section-title">${title}</div>
          ${entries.map((item) => `
            <article class="card">
              <div class="row">
                <span class="badge">${safe(item.category)}</span>
                <span class="badge">${safe(item.published_at)}</span>
                <span class="badge">#${safe(item.report_idx)}</span>
              </div>
              <h2 class="title">${safe(item.title)}</h2>
              <div class="meta">작성자 ${safe(item.author)} · 출처 ${safe(item.source)}${item.market_topic ? ` · 주제 ${safe(item.market_topic)}` : ""}${item.industry_name ? ` · 산업 ${safe(item.industry_name)}` : ""}</div>
              <p class="summary">${safe(item.summary)}</p>
              ${renderFactorSections(item)}
              <div class="links">
                <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
              </div>
            </article>
          `).join("")}
        `
        : "";

      root.innerHTML = groupCards
        + renderStandaloneSection("산업 리포트", industry)
        + renderStandaloneSection("시장 리포트", market);
    }

    function renderList(items) {
      const root = document.getElementById("list");
      root.innerHTML = items.map((item) => {
        const meta = [
          item.author ? `작성자 ${item.author}` : "",
          item.source ? `출처 ${item.source}` : "",
          item.company_name ? `회사 ${item.company_name}` : "",
          item.stock_code ? `코드 ${item.stock_code}` : "",
          item.industry_name ? `산업 ${item.industry_name}` : "",
          item.market_topic ? `주제 ${item.market_topic}` : "",
          item.investment_opinion ? `의견 ${item.investment_opinion}` : "",
          item.target_price ? `목표가 ${item.target_price}` : "",
          upsideLabel(item),
          item.alpha_score !== null && item.alpha_score !== undefined ? `Alpha ${item.alpha_grade || "-"} ${item.alpha_score}` : "",
          item.live_price ? `현재가 ${item.live_price}원` : "",
        ].filter(Boolean).join(" · ");
        const points = (item.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
        return `
          <article class="card">
            <div class="row">
              <span class="badge">${safe(item.category)}</span>
              <span class="badge">${safe(item.published_at)}</span>
              <span class="badge">#${safe(item.report_idx)}</span>
            </div>
            <h2 class="title">${safe(item.title)}</h2>
            <div class="meta">${meta}</div>
            ${renderAlphaBox(item)}
            <p class="summary">${safe(item.summary)}</p>
            ${points ? `<ul class="points">${points}</ul>` : ""}
            ${renderFactorSections(item)}
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function render() {
      renderModes();
      renderDateOptions();
      renderFilters();
      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
</html>
