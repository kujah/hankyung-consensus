name": null, "stock_code": null, "industry_name": "은행", "market_topic": "금리 상승과 은행 산업 수익성의 변화", "investment_opinion": null, "target_price": null, "summary": "은행 산업은 과거처럼 단순히 금리 상승이 수익성 개선으로 직결되지 않는다. 대출자산과 조달구조의 복잡성이 증가했고, 비은행 포트폴리오 확대로 금리 영향 경로가 다변화됐다. 이에 따라 NIM 개선폭이 제한적이며, 금융지주의 수익성은 금리 변동을 통과한 뒤 남는 이익과 CET1 자본 축적 및 활용에 집중되고 있다. 향후 은행주 투자의 핵심은 자본 배분 능력과 주주환원 정책 지속 가능성으로 변화하고 있다. 투자자들은 금리 상승으로 인한 단기 이익보다 안정적인 자본력 기반의 성장과 배당에 주목하고 있다.", "key_points": ["은행은 전통적으로 금리 상승 수혜주로 여겨졌으나, 최근 금리와 은행 수익성 간 관계가 단순하지 않음", "대출자산 리프라이싱으로 이자 수익 증가하지만, 조달 비용 상승과 차주 이자 부담 증가로 신용 리스크 확대 가능성 존재", "금융지주 사업구조가 은행 중심에서 비은행 부문으로 확대되면서 금리 영향 경로가 다변화됨", "금리 민감도가 예대마진에서 비은행, 운용자산, 자본 항목으로 분산되어 금리 변동에 대한 ROA 민감도는 과거보다 크게 축소됨", "핵심 평가는 금리 방향보다 금리를 통과한 뒤 남는 이익과 CET1 자본의 축적 및 활용으로 이동", "향후 차별화 요인은 자본 배분 능력과 주주환원 정책의 지속 가능성에 있음", "총주주환원율은 상승 중이며, 투자자의 관심은 배당수익률과 자본력으로 점차 이동하고 있음"], "risks": ["고금리 장기화에 따른 차주 이자 부담 증가 및 연체, 부실 위험 확대", "조달비용 증가 및 운용자산 평가손실 가능성", "금리 상승에 따른 비은행 부문 수익성 악화 가능성"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652888.pdf", "json_path": "../reports_json/산업/652888.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652888"}, {"report_idx": "652883", "category": "산업", "published_at": "2026-10-12", "title": "3Q26 Preview: 보험은 좋아지고 투자는 나쁘다", "author": "김도하", "source": "한화투자증권", "company_name": null, "stock_code": null, "industry_name": "손해보험", "market_topic": "보험 업황 및 3Q26 실적 전망", "investment_opinion": null, "target_price": null, "summary": "2026년 3분기 손해보험 업계는 보험손익 부문에서 자 획, 빅테크 고객 확보 중점 전략.", "스타링크 위성 D2D 서비스 위해 FCC 1.5만기 위성 배치 승인, 단말기 별도 안테나 불필요해져 통신 판도 변화 예상."], "risks": ["LG유플러스 해킹 사고 관련 조사 방해 여부에 따른 위약금 면제 요구 및 신뢰도 저하 위험.", "FCC 승인 지연 및 미국 규제 문제로 인한 스페이스X 주파수 인수 및 위성통신망 구축 지연 가능성.", "해저케이블과 AI 데이터센터 투자에 따른 초기 자금 부담 및 장기 고객 확보 불확실성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652869.pdf", "json_path": "../reports_json/산업/652869.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652869"}, {"report_idx": "652865", "category": "산업", "published_at": "2026-10-12", "title": "팔아도,안 팔아도, 앞으로도, 문제", "author": "김준성,배현서", "source": "메리츠증권", "company_name": null, "stock_code": null, "industry_name": "자동차/모빌리티", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "현대차와 기아는 2026년 3분기부터 판매 실적에서 명확한 차이를 보이고 있으나 양사 모두 전기차 원가 경쟁력 부족으로 실적 부진이 이어지고 있다. 특히 중국 브랜드의 급성장과 가격 경쟁 압력 속에서 현대차는 NEV 판매 감소, 기아는 NEV 판매 증가에도 불구하고 영업이익은 모두 목표치에 미치지 못할 것으로 예상된다. 2029년부터 대량 생산 예정인 스마트카에 탑재될 고가의 추론 컴퓨팅 장치도 원가 부담을 증가시켜 향후 원가 경쟁력 확보가 더욱 중요한 과제로 부상하고 있다. 추가로, 원화 강세와 인도-EU FTA 등 대외 환경 변화도 현지 생산 거점의 경쟁력을 위협하는 요인으로 작용하고 있다. 이러한 산업 환경 변화들은 향후 자동차 업체들의 투자 및 영업 전략에 상당한 영향을 줄 전망이다.", "key_points": ["현대차와 기아는 2026년 3분기 판매 실적에서 엇갈린 모습을 보임. 현대차는 -10%, 기아는 +8% 성장률 기록.", "판매 부진 원인은 전기차(NEV) 원가 경쟁력 차이로, 기아는 NEV 판매가 증가하여 전체 판매가 성장했으나 현대차는 NEV 판매 감소.", "양사 모두 3분기 영업이익이 컨센서스 대비 크게 하회하는 부진한 실적 예상, 전기차 주요 모델의 대당 손익 적자가 원인.", "중국 전기차 브랜드가 주요 시장에서 점유율을 빠르게 확대하며, 경쟁 심화와 가격 인하가 실적 악화 요인.", "2029년 출시 예정인 스마트카는 전기차 원가에 추론 컴퓨팅 비용이 추가되어 원가 경쟁력 확보가 더 어려워질 전망.", "대외 환경 변화도 부담으로 작용 중이며, 원화 강세와 인도-EU FTA 등으로 현지 생산 거점 경쟁력 약화 우려.", "현대차·기아의 2027년 EPS는 원가 경쟁력 저하를 반영해 각각 -8% 및 -3% 하향 조정됨."], "risks": ["전기차 원가 경쟁력 미확보에 따른 가격 경쟁 심화 및 수익성 악화 위험.", "중국산 전기차의 시장 점유율 확대 및 가격 경쟁력 상승으로 인한 경쟁 압력 증가.", "엔화 대비 원화 강세에 따른 미국 시장 점유율 하락 가능성.", "인도-EU FTA로 인한 관세 인하가 현지 생산 거점의 경쟁 우위 약화 위험.", "스마트카에 적용되는 고가의 추론 컴퓨팅 비용으로 인한 원가 상승 부담."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652865.pdf", "json_path": "../reports_json/산업/652865.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652865"}, {"report_idx": "652863", "category": "산업", "published_at": "2026-10-12", "title": "Weekly (10.12~10.16) “2026년 3분기 실적 프리뷰 모아보기”", "author": "배기연,김현비", "source": "메리츠증권", "company_name": null, "stock_code": null, "industry_name": "조선/기계", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "2026년 3분기 조선/기계업종은 조업일수 감소와 원/달러 환율 하락 영향으로 영업이익이 시장 컨센서스 대비 일부 하회할 것으로 예상된다. 상선 부문의 구조적 선가 상승과 LNG선 내 저가 수주 대비 물량 감소는 긍정적이며, 해양플랜트와 엔진기계 부문도 안정적 실적을 보이고 있다. 노사 임단협 문제가 지속되고 있으나 4분기 내 타결 기대가 있으며, 환율 하락은 환헷지 정책으로 일부 완화 가능하다. 2026년부터 2028년까지 매출과 이익 성장세가 지속될 전망이다.", "key_points": ["2026년 3분기 조선업종 전체 매출 5조 5,892억원, 영업이익 9,122억원으로 전년동기 대비 크게 증가했으나 전분기 대비 감소 전망.", "조업일수 감소, 원/달러 환율 하락이 영업이익 컨센서스 하회 요인으로 작용.", "상선 부문은 조업일수 감소 영향으로 3분기 영업이익률 하락. 특수선 부문은 특별한 이슈 없음.", "해양플랜트 부문은 Woodside Trion FPU, Ruya 프로젝트 매출 인식 진행 중으로 2026년까지 고정비 회수 가능 수준 유지 예상.", "엔진기계 부문은 조업일수 영향 적고, 영업이익 및 수익성 개선 지속 전망.", "노사간 임단협 이슈로 파업은 있었으나 조업일수 감소 폭은 크지 않음. 4분기 내 //consensus.hankyung.com/analysis/downpdf?report_idx=652852"}, {"report_idx": "652851", "category": "산업", "published_at": "2026-10-12", "title": "ESS, 가스 발전의 경제성을 앞서기 시작", "author": "황성현", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "Power & Battery", "market_topic": "ESS 및 가스 발전 경제성 변화와 배터리 시장 동향", "investment_opinion": null, "target_price": null, "summary": "본 산업 리포트는 ESS(에너지 저장 시스템)가 가스 발전 대비 발전 비용 경쟁력을 확보하기 시작했음을 중심으로 주요 이슈를 분석한다. 가스터빈 공급 부족과 연료가격 변동성 확대가 가스 발전 비용을 상승시키는 반면, 배터리 생산능력 확대로 ESS 발전 비용은 점차 하락하여 2026년 이후 ESS가 신규 피크발전 설비에서 경제적 우위를 가지게 될 전망이다. 미국과 중동·아프리카 지역에서 ESS 비용 경쟁력이 강화되고 있으며, 배터리 투자세액공제는 ESS 공급 확대에 긍정적 요인으로 작용 중이다. 다만 ESS는 장시간 전력 공급이 필요한 경우 가스 발전을 완전히 대체하기 어려운 한계가 존재한다. 데이터센터 전력 수요 증가와 가스터빈 공급 병목 현상이 ESS 수요의 전기차 중심에서 전력 인프라 중심 확장을 예상하게 한다. 배터리 원재료 가격과 주요 배터리 업체들의 재료 및 기술 협력 등의 소식도 함께 언급되었다. 전반적으로 ESS와 관련한 산업 및 정책적 환경은 긍정적이나 장기적인 비용 및 공급 리스크는 상존함을 시사한다.", "key_points": ["ESS의 LCOE가 가스 발전보다 낮아지며 경제성 우위 확보 시작", "가스터빈 공급 부족과 연료가격 변동성으로 가스 발전 비용 상승 지속 전망", "ESS는 배터리 생산능력 확대와 투자세액공제로 비용 경쟁력 강화 중", "미국·중동·아프리카 등 지역에서 ESS 발전비용 하락과 가스 발전 대비 우위 예상", "가스발전의 높은 설비투자비와 긴 납기 대비 ESS의 빠른 공급 확대 가능", "ESS는 장시간 전력 공급 제한으로 가스 발전 완전 대체는 어려움", "데이터센터 전력수요 증가와 가스터빈 병목 현상으로 ESS 수요 전력 인프라 중심 확대 예상", "배터리 가격 하락과 원재료 가격 동향 감안 시 ESS 비용 추가 하락 기대"], "risks": ["ESS의 방전시간 및 재충전 제약에 따른 장시간 전력 공급 한계", "2038년 이후 투자세액공제 축소에 따른 ESS 비용 일시 상승 가능성", "가스발전 설비비용 상승과 공급 병목 현상 증가에 따른 시장 불확실성"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652851.pdf", "json_path": "../reports       for (const item of items) counts[item.category] = (counts[item.category] || 0) + 1;
      return counts;

    function groupedData(items) {
      const groups = new Map();
      const industry = [];
      const market = [];

      for (const item of items) {
        if (item.category === "기업" && item.stock_code) {
          const key = item.stock_code;
          if (!groups.has(key)) {
            groups.set(key, {
              stock_code: item.stock_code,
              company_name: item.company_name || item.title,
              live_price: item.live_price,
              live_price_change: item.live_price_change,
              live_price_rate: item.live_price_rate,
              live_price_as_of: item.live_price_as_of,
              live_price_high_52w: item.live_price_high_52w,
              price_history: item.price_history || [],
              best_alpha_score: item.alpha_score,
              best_alpha_grade: item.alpha_grade,
              reports: [],
            });
          }
          const group = groups.get(key);
          if ((!group.price_history || !group.price_history.length) && item.price_history?.length) {
            group.price_history = item.price_history;
          }
          if ((item.alpha_score || -1) > (group.best_alpha_score || -1)) {
            group.best_alpha_score = item.alpha_score;
            group.best_alpha_grade = item.alpha_grade;
          }
          group.reports.push(item);
        } else if (item.category === "산업") {
          industry.push(item);
        } else {
          market.push(item);
        }
      }

      const groupedCompanies = Array.from(groups.values())
        .map((group) => ({
          ...group,
          reports: group.reports.sort((a, b) => {
            const scoreDiff = (b.alpha_score || -1) - (a.alpha_score || -1);
            if (scoreDiff !== 0) return scoreDiff;
            const sourceA = a.source || "";
            const sourceB = b.source || "";
            return sourceA.localeCompare(sourceB, "ko");
          }),
        }))
        .sort((a, b) => {
          const scoreDiff = (b.best_alpha_score || -1) - (a.best_alpha_score || -1);
          if (scoreDiff !== 0) return scoreDiff;
          const countDiff = b.reports.length - a.reports.length;
          if (countDiff !== 0) return countDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });

      return { groupedCompanies, industry, market };
    }

    function formatQuoteAsOf(value) {
      const text = safe(value);
      const matched = text.match(/(\d{4}\.\d{2}\.\d{2})/);
      if (matched) return `${matched[1].slice(2)} 장마감 기준`;
      return text
        .replace(/^현재가\s*/, "")
        .replace(/\s*기준(?:\(KRX 장마감\)|\(장마감\)|\(KRX장마감\)|\(KRX 마감\))?/g, "")
        .trim();
    }

    function priceDirectionClass(group) {
      const explicit = safe(group.live_price_direction).toLowerCase();
      if (explicit === "up" || explicit === "rise") return "up";
      if (explicit === "down" || explicit === "fall") return "down";

      const changeAmount = parsePriceValue(group.live_price_change);
      const changeRate = parsePriceValue(group.live_price_rate);
      if (Number.isFinite(changeAmount) && changeAmount < 0) return "down";
      if (Number.isFinite(changeRate) && changeRate < 0) return "down";
      if (Number.isFinite(changeAmount) && changeAmount > 0) return "up";
      if (Number.isFinite(changeRate) && changeRate > 0) return "up";

      const text = `${safe(group.live_price_change)} ${safe(group.live_price_rate)}`;
      if (text.includes("-")) return "down";
      return "";
    }

    function renderSparkline(history) {
      const values = (history || [])
        .map((item) => parsePriceValue(item.close))
        .filter((value) => Number.isFinite(value));
      if (values.length < 2) return "";

      const width = 220;
      const height = 40;
      const padding = 2;
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const range = Math.max(maxValue - minValue, 1);
      const points = values.map((value, index) => {
        const x = padding + ((width - padding * 2) * index) / (values.length - 1);
        const y = height - padding - ((value - minValue) / range) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const lastPoint = points[points.length - 1].split(",");
      const trendUp = values[values.length - 1] >= values[0];
      const stroke = trendUp ? "#0d7a5f" : "#ca6702";
      return `
        <div class="price-chart" aria-label="최근 3개월 주가 추이">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-hidden="true">
            <polyline fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${points.join(" ")}"></polyline>
            <circle cx="${lastPoint[0]}" cy="${lastPoint[1]}" r="2.8" fill="${stroke}"></circle>
          </svg>
        </div>
        <div class="price-caption">[3개월 주가 추이]</div>
      `;
    }

      const change = [safe(group.live_price_change), safe(group.live_price_rate)].filter(Boolean).join(" / ");

    async function copyStockCode(stockCode) {
      if (!stockCode) return;
      try {
        await navigator.clipboard.writeText(String(stockCode));
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = String(stockCode);
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      alert(`종목코드 복사: ${stockCode}`);
    }

    async function fetchReportsForDate(date) {
      if (!date) return [];
      if (reportCache.has(date)) return reportCache.get(date) || [];
      try {
        const response = await fetch(`./archive/${date}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const nextReports = payload.reports || [];
        reportCache.set(date, nextReports);
        return nextReports;
      } catch (error) {
        return null;
      }
    }

    async function ensureHistoryLoaded() {
      if (historyLoaded) return true;
      for (const date of availableDates) {
        const loaded = await fetchReportsForDate(date);
        if (loaded === null) return false;
      }
      historyLoaded = true;
      return true;
    }

    function allCachedReports() {
      return Array.from(reportCache.values()).flat();
    }

    function stockCatalog() {
      const grouped = new Map();
      for (const item of allCachedReports()) {
        if (item.category !== "기업" || !item.stock_code) continue;
        const key = item.stock_code;
        if (!grouped.has(key)) {
          grouped.set(key, {
            stock_code: item.stock_code,
            company_name: item.company_name || item.title || item.stock_code,
            report_count: 0,
            dates: new Set(),
            latest_date: item.published_at || "",
          });
        }
        const stock = grouped.get(key);
        stock.report_count += 1;
        if (item.company_name) stock.company_name = item.company_name;
        if (item.published_at) stock.dates.add(item.published_at);
        if ((item.published_at || "") > stock.latest_date) stock.latest_date = item.published_at || "";
      }
      return Array.from(grouped.values());
    }

    function matchingStocks(query) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return [];
      return stockCatalog()
        .map((item) => {
          const name = String(item.company_name || "").toLowerCase();
          const code = String(item.stock_code || "").toLowerCase();
          let score = -1;
          if (code === keyword) score = 100;
          else if (name === keyword) score = 95;
          else if (code.startsWith(keyword)) score = 80;
          else if (name.startsWith(keyword)) score = 70;
          else if (code.includes(keyword)) score = 60;
          else if (name.includes(keyword)) score = 50;
          return { ...item, score };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => {
          const scoreDiff = b.score - a.score;
          if (scoreDiff !== 0) return scoreDiff;
          const dateDiff = (b.latest_date || "").localeCompare(a.latest_date || "");
          if (dateDiff !== 0) return dateDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });
    }

    }

    function render() {
      renderModes();
      renderDateOptions();
      renderFilters();
      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
</html>
