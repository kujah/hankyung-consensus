": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/시장/651999.pdf", "json_path": "../reports_json/시장/651999.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651999"}, {"report_idx": "652027", "category": "산업", "published_at": "2026-08-31", "title": "IM Steel Weekly", "author": "김윤상", "source": "iM증권", "company_name": null, "stock_code": null, "industry_name": "-", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "이 주간 보고서는 글로벌 및 국내 철강 업황에 대한 산업 분석으로, 현재 강보합세를 보이고 있으나 수요 부진 및 체인 내 가격 상승 모멘텀 부재로 인해 추세적 반등 가능성은 낮다고 평가함. 중국은 원료탄 및 코크스 가격 강세와 감산 기대감으로 가격이 강보합 전환했으나, 전방 산업 수요 약화와 중국 내 투자 감소가 단기 반등을 제한한다. 미국과 유럽 시장은 강보합세이나 수요 부진과 세부 규제 이슈가 가격 상승 성공 가능성을 낮추고 있다. 국내 시장은 수입재 약세와 수요 부진으로 열연과 철근 가격이 하락했고, 원재료 시장도 일부 품목에서 상이한 움직임을 보인다. 전반적으로 체인 내 수급 문제와 정책 영향, 글로벌 시장 동향이 복합적으로 작용하는 가운데 철강 산업은 강한 추세적 상승 동력을 확보하기 어려운 상황이다.", "key_points": ["글로벌 철강 및 비철금속 업종은 주로 강보합세를 보이고 있으며, 중동 긴장 완화 및 중국의 철강 감산 기대감으로 전반적인 소재 가격 호조 관찰됨.", "중국 철강 가격은 원료탄 및 코크스 가격 강세와 감산 기대감에 힘입어 강보합 전환하였으나, 전방산업 수요 부진과 중국 경제 투자 감소로 단기 반등에 그칠 전망.", "미국과 유럽 시장도 강보합세를 유지 중이며, 미국은 뉴코의 가격 인상과 캐나다산 철강재 수입 중단 기대감 등으로 가격 강세가 기대됨.", "국내 철강 유통시장에서는 열연과 철근 가격이 약세를 보이고 있으며, 수입재 약세와 수요 부진으로 가격 상승 모멘텀 부재 지속.", "원재료 가격은 호주 원료탄 및 중국 코크스 가격이 강세를 보였고, 철광석과 스크랩 수입가격은 혼조세를 보임.", "중국 철강 가동률은 82%대 중후반을 유지하나 유통 재고는 증가세이며, 중국 철강사들의 흑자 비중은 하락세 유지 중.", "전반적으로 글로벌 및 국내 철강 시장은 체인 내 공급부족이나 상승 모멘텀 부재, 그리고 수요 약세가 맞물려 추세적 강세는 어려운 상황임."], "risks": ["중국 철강산업 수요 부진에 따른 단기적 가격 반등 제한 가능성.", "유럽 및 미국 등 주요 시장의 수요 부진과 수입 규제 강화에 따른 시장 불확실성.", "글로벌 경제 둔화 및 투자 위축으로 인한 중장기 수요 감소 우려.", "국내 철강 유통 시장의 가격 약세 지속과 외국산 수입 철강재 가격 변동성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_retur  "../reports_pdf/산업/652026.pdf", "json_path": "../reports_json/산업/652026.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652026"}, {"report_idx": "652023", "category": "산업", "published_at": "2026-08-31", "title": "[인터넷/게임] IBKS Daily", "author": "이승훈, 박상준", "source": "IBK투자증권", "company_name": null, "stock_code": null, "industry_name": "인터넷/게임", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "인터넷/게임 산업은 정부의 '모두의 AI' 프로젝트 선정과 주요 IT기업인 SK텔레콤, 카카오, KT의 AI 서비스 차별화 경쟁으로 성장 모멘텀이 예상된다. 또한 두나무와 비자의 협력으로 스테이블코인 기반 금융 서비스가 도입되어 신기술과 금융 융합 측면에서 산업 내 혁신적 변화를 이끌 전망이다.", "key_points": ["과학기술정보통신부가 SK텔레콤, 카카오, KT 등 3개 컨소시엄을 '모두의 AI' 프로젝트 사업자로 최종 선정함.", "SK텔레콤은 전화·문자 기반 AI 에이전트, 카카오는 카카오톡 내 AI 서비스, KT는 기존 플랫폼 연계 선제형 AI를 선보이며 차별화된 AI 서비스 경쟁을 예고함.", "두나무가 글로벌 카드사 비자(Visa)와 전략적 파트너십을 체결하여 스테이블코인 기반 결제·송금 등 새로운 금융 서비스를 발굴 중임.", "두나무와 비자는 OUSD 기반 사업 모델 탐색, AI와 스테이블코인 결합 서비스 공동 발굴 추진과 관련 법규 검토 등을 계획하고 있음."], "risks": [], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652023.pdf", "json_path": "../reports_json/산업/652023.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652023"}, {"report_idx": "652020", "category": "산업", "published_at": "2026-08-31", "title": "Global Carbon Daily", "author": "최관순", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "탄소배출권 및 에너지 시장", "market_topic": "글로벌 탄소배출권 가격 동향과 에너지 원자재 가격 변화", "investment_opinion": null, "target_price": null, "summary": "본 산업 리포트는 글로벌 탄소배출권 시장과 주요 에너지 원자재 가격 동향을 분석하였다. 전반적으로 탄소배출권 가격은 지역별로 일부 차이가 있으나 상승세를 유지하고 있으며, 특히 국내 관련 인증 실적의 가격 상승이 두드러진다. 에너지 원자재 가격은 글로벌 경제 상황과 지정학적 이슈로 인해 변동성이 존재한다. 정책적으로는 재생에너지 거래 플랫폼 확장과 탄소배출권 시장의 연계 강화 등의 긍정적 흐름이 나타나고 있다. 향후 시장 수급 및 정책 환경 변수를 면밀히 관찰할 필요가 있다.", "key_points": ["글로벌 주요 지역의 탄소배출권(EUA, UKA, RGGI, CCA 등) 가격은 일간 및 주간 기준 소폭 변동을 보이고 있으며, 특히 국내 KOC, i-KOC는 최근 3개월간 60% 내외의 큰 상승세를 기록함.", "글로벌 원자재 가격 중 원유(브렌트, WTI)와 천연가스, 석탄 가격은 최근 한달 간 다소 하락 또는 변동성 있는 움직임을 보임.", "탄소배출권 ETF 및 ETN은 가격과 총자산 측면에서 안정적이나 일부 종목은 소폭 상승 또는 하락세 존재.", "재생에너지 거래의 접근성 개선, 미국 캘리포니아 탄소배출권 시장 완판 등 정책 및 시장 참여 확대 움직임이 보임.", "유럽 및 미국 등 주요 배출권 선물시장 가격 추이와 함께 국내 현물 및 선물시장 자료 추적 가능."], "risks": ["에너지 및 원자재 가격 변동성에 따른 탄소배출권 가격 영향 위험", "정책 변화나 국제정세에 따른 시장 변동성 확대 가능성", "탄소배출권 시장 수급 불균형에 따른 가격 급등락 위험"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652020.pdf", "json_path": "../reports_json/산업/652020.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652020"}, {"report_idx": "652009", "category": "산업", "published_at": "2026-08-31", "title": "PCB/CCL, 다시 한번 확산되는 판가 인상 조짐", "author": "양승수", "source": "메리츠증권", "company_name": null, "stock_code": null, "industry_name": "PCB/CCL", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "2026년 하반기 PCB/CCL 산업에서는 중국, 대만, 일본의 주요 CCL 업체들이 원재료 공급 부족과 고사양 수요 증가를 배경으로 판가 인상에 나서고 있다. 이러한 판가 인상은 국내 PCB 기판 업체들에도 추가 판가 인상을 촉발하고 있으며, 원가 상승 압박을 고객사에 전가할 수 있는 명분으로 작용하고 있다. 두산 전자BG 등 국내 메모리 패키징용 CCL 경쟁력 보유 기업들은 판가 인상과 증설 효과, 제품 믹스 개선으로 실적 개선이 기대된다. 다만, 원재료 수급 문제 지속, 가격 인상에 따른 수요 변동, 글로벌 공급망 불확실성 등이 리스크 요인이다.", "key_points": ["글로벌 CCL(동박 적층판) 주요 업체들이 2026년 하반기 들어 판가 인상을 동시에 단행하고 있음. 주요 인상 기업은 중국 Kingboard, 대만 Nan Ya Plastic, 일본 Panasonic Industry 등.", "인상 폭은 CCL 및 Prepreg 기준 10~30% 수준으로, 원재료인 유리섬유, 동박 공급 부족과 조달비 상승을 근거로 하고 있음.", "AI 서버용 CCL의 고사양화 수요와 원재료 공급난이 맞물려 글로벌 CCL 공급 부담이 계속되는 상황임.", "국내 PCB 기판 업체들도 상반기 원재료 가격 상승을 반영해 판가를 인상했으며, 하반기에도 추가적인 판가 인상이 불가피할 전망.", "국내 업체들은 글로벌 CCL 가격 인상에 힘입어 고객사에 원가 부담 전가의 명분을 확보함.", "두산 전자BG는 메모리 패키징용 CCL 라인업 경쟁력과 원재료 가격 인상으로 인한 판가 인상 가능성 및 4분기 생산 증설, 고급 제품 믹스 개선으로 실적 향상 기대.", "시장 전반적으로 판가 인상 기조가 확산 중이며, 후행적인 가격 조정 움직임이 이어질 가능성이 높음."], "risks": ["원재료 공급 부족 지속에 따른 비용 압박 확대 가능성.", "판가 인상에 따른 수요 둔화 또는 고객사 반발 위험.", "글로벌 공급망 이슈 및 정책 변화에 따른 시장 불확실성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652009.pdf", "json_path": "../reports_json/산업/652009.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652009"}, {"report_idx": "652008", "category": "산업", "published_at": "2026-08-31", "title": "통신서비스 weekly", "author": "정지수,박건영", "source": "메리츠증권", "company_name": null, "stock_code": null, "industry_name": "통신서비스", "market_topic": "AI 시대 통신 네트워크 고도화, 우주항공 위성 발사, 통신주 외국인 지분 소폭 변동", "investment_opinion": null, "target_price": null, "summary": "국내외 통신서비스 산업은 AI와 6G 등 신기술 도입에 따른 네트워크 고도화와 우주항공 분야 위성 발사를 중심으로 산업 발전을 모색하고 있다. 국내에서는 과기정통부가 주도하는 '모두의 AI' 사업이 추진 중이며, SK텔레콤은 AI 기반 데이터센터 사업 분할을 통한 전문기업 설립으로 인공지능 인프라 확대에 주력한다. 또한, 글로벌 통신산업 표준과 정책 변화, 주파수 정책 개선 논의도 활발히 진행 중이다. 외국인 투자자들은 SK텔레콤 원 이상으로 상승 중", "공사비 상승과 PUE 개선에 따른 IT Load 증가는 동일 수전용량 대비 건설사 수주 규모 확대 요인", "MEP(기계·전기·배관) 비용이 공사비의 60% 이상 차지하며 전선 및 케이블 가격도 큰 폭 상승(지난 1년간 43.1% 상승)"], "risks": ["데이터센터 건설비용 상승이 공사 수익성 압박 가능성 있음", "미·이란 및 기타 국제 관계 리스크가 건설 프로젝트 지연 또는 비용 증가 요인 될 수 있음"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/651998.pdf", "json_path": "../reports_json/산업/651998.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651998"}, {"report_idx": "651997", "category": "산업", "published_at": "2026-08-31", "title": "전기본 시사점, 이제는 발전보다 계통", "author": "황성현", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "전력 및 배터리 산업", "market_topic": "AI·반도체 중심으로 급증하는 전력수요와 전력망 중심의 구조 개편", "investment_opinion": null, "target_price": null, "summary": "본 산업 리포트는 12차 전력수급기본계획을 중심으로 전력산업의 구조 변화와 수급 변동성에 대해 다루었다. AI 및 반도체 중심의 전력수요 증가에 따라 발전 설비와 더불어 전력망(계통) 투자가 핵심 과제로 부상하고 있으며, 한전의 재무구조 문제로 송전망 사업의 재편 논의도 진행 중이다. 또한 수요자 비용 분담과 지역별 전기요금제 도입 등 전력 시장과 정책 체계 전반의 전환이 예상된다. 이러한 변화는 발전보다 계통 및 수요 관리 중심으로의 패러다임 전환임을 시사한다.", "key_points": ["12차 전력수급기본계획에서 AI·반도체 등의 수요가 대폭 상향 조정되어 2040년 최대전력 목표는 158.4GW로 설정됨", "수요관리 효과 가정을 포함해도 발전·계통 설비 필요성이 커질 가능성 존재", "대규모 부채 부담으로 한전 재무구조 한계, 송전망 사업 분리 또는 국가 역할 확대 등 재원 조달 및 사업구조 변화 논의 중", "AI 데이터센터 수요 불확실성 존재, 장기 조달 확약과 비용 부담 분담 논의 중", "전력시장 핵심이 발전소 건설에서 신규 수요 배치, 계통 투자비 부담 및 가격체계 조정으로 전환됨", "산업용 지역별 전기요금제 도입으로 지역별 전력수급 조절 시도 중", "호남 재생에너지 출력제어 문제는 발전설비 부족보다 송전망 병목에 기인", "정부가 신산업용 전력 및 용수 확보를 위해 한전·수자원공사에 신규 출자", "SK이노베이션의 SKIET 흡수합병, 美 웨스팅하우스 지분 인수 제안 등 산       return text
        .replace(/^현재가\s*/, "")
        .replace(/\s*기준(?:\(KRX 장마감\)|\(장마감\)|\(KRX장마감\)|\(KRX 마감\))?/g, "")
        .trim();
    }

    function priceDirectionClass(group) {
      const explicit = safe(group.live_price_direction).toLowerCase();
      if (explicit === "up" || explicit === "rise") return "up";
      if (explicit === "down" || explicit === "fall") return "down";

      const changeAmount = parsePriceValue(group.live_price_change);
      const changeRate = parsePriceValue(group.live_price_rate);
      if (Number.isFinite(changeAmount) && changeAmount < 0) return "down";
      if (Number.isFinite(changeRate) && changeRate < 0) return "down";
      if (Number.isFinite(changeAmount) && changeAmount > 0) return "up";
      if (Number.isFinite(changeRate) && changeRate > 0) return "up";

      const text = `${safe(group.live_price_change)} ${safe(group.live_price_rate)}`;
      if (text.includes("-")) return "down";
      return "";
    }

    function renderSparkline(history) {
      const values = (history || [])
        .map((item) => parsePriceValue(item.close))
        .filter((value) => Number.isFinite(value));
      if (values.length < 2) return "";

      const width = 220;
      const height = 40;
      const padding = 2;
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const range = Math.max(maxValue - minValue, 1);
      const points = values.map((value, index) => {
        const x = padding + ((width - padding * 2) * index) / (values.length - 1);
        const y = height - padding - ((value - minValue) / range) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const lastPoint = points[points.length - 1].split(",");
      const trendUp = values[values.length - 1] >= values[0];
      const stroke = trendUp ? "#0d7a5f" : "#ca6702";
      return `
        <div class="price-chart" aria-label="최근 3개월 주가 추이">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-hidden="true">
            <polyline fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${points.join(" ")}"></polyline>
            <circle cx="${lastPoint[0]}" cy="${lastPoint[1]}" r="2.8" fill="${stroke}"></circle>
          </svg>
        </div>
        <div class="price-caption">[3개월 주가 추이]</div>
      `;
    }

    function renderPriceBox(group) {
      if (!group.live_price) {
        return `
          <div class="price-box">
            <div class="price-label">현재가</div>
            <div class="price-main">조회 실패</div>
          </div>
        `;
      }

      const change = [safe(group.live_price_change), safe(group.live_price_rate)].filter(Boolean).join(" / ");
      const directionClass = priceDirectionClass(group);
      const high52w = safe(group.live_price_high_52w);
      return `
        <div class="price-box">
          <div class="price-label">${formatQuoteAsOf(group.live_price_as_of)}</div>
          <div class="price-main">${safe(group.live_price)}원</div>
          <div class="price-change ${directionClass}">${change}</div>
          ${high52w ? `<div class="price-extra">52주 최고가 ${high52w}원</div>` : ""}
          ${renderSparkline(group.price_history)}
        </div>
      `;
    }

    function renderAlphaBox(item) {
      if (item.alpha_score === null || item.alpha_score === undefined) return "";
      return `
        <div class="score-box">
          <div class="score-grade">Alpha ${safe(item.alpha_grade || "-")}</div>
          <div class="score-main">${safe(item.alpha_score)}</div>
          <div class="score-sub">${safe(item.score_reason || "")}</div>
        </div>
      `;
    }

    function stockWebUrl(stockCode) {
      if (!stockCode) return "";
      return `https://finance.naver.com/item/main.naver?code=${encodeURIComponent(stockCode)}`;
    }

    async function copyStockCode(stockCode) {
      if (!stockCode) return;
      try {
        await navigator.clipboard.writeText(String(stockCode));
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = String(stockCode);
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      alert(`종목코드 복사: ${stockCode}`);
    }

    async function fetchReportsForDate(date) {
      if (!date) return [];
      if (reportCache.has(date)) return reportCache.get(date) || [];
      try {
        const response = await fetch(`./archive/${date}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const nextReports = payload.reports || [];
        reportCache.set(date, nextReports);
        return nextReports;
      } catch (error) {
        return null;
      }
    }

    async function ensureHistoryLoaded() {
      if (historyLoaded) return true;
      for (const date of availableDates) {
        const loaded = await fetchReportsForDate(date);
        if (loaded === null) return false;
      }
      historyLoaded = true;
      return true;
    }

    function allCachedReports() {
      return Array.from(reportCache.values()).flat();
    }

    function stockCatalog() {
      const grouped = new Map();
      for (const item of allCachedReports()) {
        if (item.category !== "기업" || !item.stock_code) continue;
        const key = item.stock_code;
        if (!grouped.has(key)) {
          grouped.set(key, {
            stock_code: item.stock_code,
            company_name: item.company_name || item.title || item.stock_code,
            report_count: 0,
            dates: new Set(),
            latest_date: item.published_at || "",
          });
        }
        const stock = grouped.get(key);
        stock.report_count += 1;
        if (item.company_name) stock.company_name = item.company_name;
        if (item.published_at) stock.dates.add(item.published_at);
        if ((item.published_at || "") > stock.latest_date) stock.latest_date = item.published_at || "";
      }
      return Array.from(grouped.values());
    }

    function renderSearchResults(htmlText) {
      document.getElementById("search-results").innerHTML = htmlText;
    }

    function renderHistoryEmpty(message) {
      const root = document.getElementById("history-section");
      root.innerHTML = `<div class="history-empty">${safe(message)}</div>`;
    }

    function matchingStocks(query) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return [];
      return stockCatalog()
        .map((item) => {
          const name = String(item.company_name || "").toLowerCase();
          const code = String(item.stock_code || "").toLowerCase();
          let score = -1;
          if (code === keyword) score = 100;
          else if (name === keyword) score = 95;
          else if (code.startsWith(keyword)) score = 80;
          else if (name.startsWith(keyword)) score = 70;
          else if (code.includes(keyword)) score = 60;
          else if (name.includes(keyword)) score = 50;
          return { ...item, score };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => {
          const scoreDiff = b.score - a.score;
          if (scoreDiff !== 0) return scoreDiff;
          const dateDiff = (b.latest_date || "").localeCompare(a.latest_date || "");
          if (dateDiff !== 0) return dateDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });
    }

    function renderHistoryReportCard(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" 쨌 ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <h3 class="history-report-title">${safe(item.title)}</h3>
            <div class="report-brief">${meta}</div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStock(stockCode) {
      renderHistoryForStockCompact(stockCode);
    }

    function renderHistoryReportCardCompact(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" / ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <div class="history-title-row">
              <h3 class="history-report-title">${safe(item.title)}</h3>
              ${item.published_at ? `<span class="badge">${safe(item.published_at)}</span>` : ""}
            </div>
            <div class="report-brief">${meta}</div>
            <p class="summary">${safe(item.summary)}</p>
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문</a>
            </div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStockCompact(stockCode) {
      const entries = allCachedReports()
        .filter((item) => item.stock_code === stockCode)
        .sort((a, b) => {
          const dateDiff = (b.published_at || "").localeCompare(a.published_at || "");
          if (dateDiff !== 0) return dateDiff;
          return String(b.report_idx || "").localeCompare(String(a.report_idx || ""));
        });
      const root = document.getElementById("history-section");
      if (!entries.length) {
        renderHistoryEmpty("?대떦 醫낅ぉ????λ맂 ?대젰???놁뒿?덈떎.");
        return;
      }

      const companyName = entries.find((item) => item.company_name)?.company_name || stockCode;
      const uniqueDates = new Set(entries.map((item) => item.published_at).filter(Boolean));
      const bestEntry = entries.find((item) => item.alpha_score !== null && item.alpha_score !== undefined);
      const cards = entries.map((item) => renderHistoryReportCardCompact(item)).join("");

      root.innerHTML = `
        <article class="group-card history-group-card">
          <div class="group-head">
            <div>
              <div class="group-title-row">
                <h2 class="group-title">${safe(companyName)}</h2>
              </div>
            </div>
          </div>
          <div class="group-meta">
            <span class="pill"><button type="button" data-copy-stock="${safe(stockCode)}">종목코드 복사</button></span>
            <span class="pill"><a href="${stockWebUrl(stockCode)}" target="_blank" rel="noreferrer">네이버금융</a></span>
          </div>
          <div class="report-stack">${cards}</div>
        </article>
      `;
    }

    async function runStockSearch() {
      const input = document.getElementById("stock-search");
      const query = String(input.value || "").trim();
      if (!query) {
        renderSearchResults("");
        renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
        return;
      }

      renderSearchResults('<span class="badge">아카이브 확인 중...</span>');
      const loaded = await ensureHistoryLoaded();
      if (!loaded) {
        renderSearchResults("");
        renderHistoryEmpty("아카이브를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      const matches = matchingStocks(query).slice(0, 12);
      if (!matches.length) {
        renderSearchResults("");
        renderHistoryEmpty(`"${query}"와 일치하는 종목 이력이 없습니다.`);
        return;
      }

      renderSearchResults(
        matches
          .map(
            (item) => `
              <button type="button" data-stock-history="${safe(item.stock_code)}">
                ${safe(item.company_name)} (${safe(item.stock_code)}) · ${item.report_count}건
              </button>
            `
          )
          .join("")
      );
      renderHistoryForStockCompact(matches[0].stock_code);
    }

    function renderFactorSections(item) {
      if (item.category !== "기업") return "";
      const sections = [];
      if (item.revision_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Revision Signal</div><p class="factor-text">${safe(item.revision_signal)}</p></div>`);
      }
      if (item.structural_growth_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Structural Growth</div><p class="factor-text">${safe(item.structural_growth_signal)}</p></div>`);
      }
      if (item.valuation_risk_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Valuation / Risk</div><p class="factor-text">${safe(item.valuation_risk_signal)}</p></div>`);
      }
      const positiveText = (item.positive_factors || []).map((value) => `+ ${safe(value)}`).join("<br>");
      const negativeText = (item.negative_factors || []).map((value) => `- ${safe(value)}`).join("<br>");
      if (positiveText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Positive Factors</div><p class="factor-text">${positiveText}</p></div>`);
      }
      if (negativeText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Negative Factors</div><p class="factor-text">${negativeText}</p></div>`);
      }
      if (item.market_reaction_placeholder) {
        sections.push(`<div class="factor-box"><div class="factor-title">Market Reaction</div><p class="factor-text">D+1 / D+5 / D+20 추후 연결 예정</p></div>`);
      }
      return sections.length ? `<div class="factor-grid">${sections.join("")}</div>` : "";
    }

    function renderGrouped(items) {
      const root = document.getElementById("list");
      const { groupedCompanies, industry, market } = groupedData(items);

      const groupCards = groupedCompanies.map((group) => {
        const reportsHtml = group.reports.map((report) => {
          const pointItems = (report.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
          return `
            <details class="report-detail">
              <summary>
                <div>
                  <div>${safe(report.title)}</div>
                  <div class="report-brief">${[
                    safe(report.source),
                    safe(report.author),
                    [safe(report.investment_opinion), safe(report.target_price)].filter(Boolean).join(" "),
                    upsideLabel(report),
                  ].filter(Boolean).join(" · ")}</div>
                </div>
                <div>
                  ${report.alpha_score !== null && report.alpha_score !== undefined ? `<div class="badge">${safe(report.alpha_grade || "-")} ${safe(report.alpha_score)}</div>` : ""}
                  <div class="badge">#${safe(report.report_idx)}</div>
                </div>
              </summary>
              <div class="report-body">
                <p class="summary">${safe(report.summary)}</p>
                ${pointItems ? `<ul class="points">${pointItems}</ul>` : ""}
                ${renderFactorSections(report)}
                <div class="links">
                  <a href="${safe(report.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
                </div>
              </div>
            </details>
          `;
        }).join("");

        return `
          <article class="group-card">
            <div class="group-head">
              <div>
                <div class="group-title-row">
                  <h2 class="group-title">${safe(group.company_name)}</h2>
                  ${renderPriceBox(group)}
                </div>
              </div>
            </div>
            <div class="group-meta">
              ${group.stock_code ? `<span class="pill"><button type="button" data-copy-stock="${safe(group.stock_code)}">종목코드 복사</button></span>` : ""}
              ${group.stock_code ? `<span class="pill"><a href="${stockWebUrl(group.stock_code)}" target="_blank" rel="noreferrer">네이버금융</a></span>` : ""}
            </div>
            <div class="report-stack">${reportsHtml}</div>
          </article>
        `;
      }).join("");

      const renderStandaloneSection = (title, entries) => entries.length
        ? `
          <div class="section-title">${title}</div>
          ${entries.map((item) => `
            <article class="card">
              <div class="row">
                <span class="badge">${safe(item.category)}</span>
                <span class="badge">${safe(item.published_at)}</span>
                <span class="badge">#${safe(item.report_idx)}</span>
              </div>
              <h2 class="title">${safe(item.title)}</h2>
              <div class="meta">작성자 ${safe(item.author)} · 출처 ${safe(item.source)}${item.market_topic ? ` · 주제 ${safe(item.market_topic)}` : ""}${item.industry_name ? ` · 산업 ${safe(item.industry_name)}` : ""}</div>
              <p class="summary">${safe(item.summary)}</p>
              ${renderFactorSections(item)}
              <div class="links">
                <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
              </div>
            </article>
          `).join("")}
        `
        : "";

      root.innerHTML = groupCards
        + renderStandaloneSection("산업 리포트", industry)
        + renderStandaloneSection("시장 리포트", market);
    }

    function renderList(items) {
      const root = document.getElementById("list");
      root.innerHTML = items.map((item) => {
        const meta = [
          item.author ? `작성자 ${item.author}` : "",
          item.source ? `출처 ${item.source}` : "",
          item.company_name ? `회사 ${item.company_name}` : "",
          item.stock_code ? `코드 ${item.stock_code}` : "",
          item.industry_name ? `산업 ${item.industry_name}` : "",
          item.market_topic ? `주제 ${item.market_topic}` : "",
          item.investment_opinion ? `의견 ${item.investment_opinion}` : "",
          item.target_price ? `목표가 ${item.target_price}` : "",
          upsideLabel(item),
          item.alpha_score !== null && item.alpha_score !== undefined ? `Alpha ${item.alpha_grade || "-"} ${item.alpha_score}` : "",
          item.live_price ? `현재가 ${item.live_price}원` : "",
        ].filter(Boolean).join(" · ");
        const points = (item.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
        return `
          <article class="card">
            <div class="row">
              <span class="badge">${safe(item.category)}</span>
              <span class="badge">${safe(item.published_at)}</span>
              <span class="badge">#${safe(item.report_idx)}</span>
            </div>
            <h2 class="title">${safe(item.title)}</h2>
            <div class="meta">${meta}</div>
            ${renderAlphaBox(item)}
            <p class="summary">${safe(item.summary)}</p>
            ${points ? `<ul class="points">${points}</ul>` : ""}
            ${renderFactorSections(item)}
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function render() {
      renderModes();
      renderDateOptions();
      renderFilters();
      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
