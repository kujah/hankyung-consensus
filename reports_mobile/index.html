 파이프라인은 2026년 4분기부터 2027년 상반기까지 계약 전환이 예상되어 방산 주가에 중요한 변수로 작용할 것이다. 방산 5사의 잔고는 2025년 말 대비 18% 감소하였으나 신규 및 중소형 계약 확장이 이루어지고 있어 성장성은 유지된다. 주요 수혜종목으로는 LIG디펜스앤에어로스페이스와 한화에어로스페이스가 꼽힌다.", "key_points": ["2027년 방위산업 투자 방향은 수주 실적에 달려 있음", "중동 전쟁은 교전은 잦아들었으나 호르무즈 해상봉쇄 지속 중 'No war, no peace' 국면", "방산 5사 잔고 136조원, 2026~2027년 대형 수출 계약 체결 기대", "미국 민주당 상·하원 장악으로 전쟁 종료 압박과 국방예산 증액 제동 영향", "중동 걸프국 요격미사일 재고 고갈, 미국산 공급 부족, 한국산 무기 수요 증가 전망"], "risks": ["중동 정세 불확실성 지속", "미국 국방예산 증액 제동 가능성", "신규 수주 공백에 따른 성장 둔화 우려"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654456.pdf", "json_path": "../reports_json/산업/654456.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654456"}, {"report_idx": "654455", "category": "산업", "published_at": "2026-11-23", "title": "2027년 미드스몰캡(호텔) 연간전망: 우리나라에서 돈 쓰는 외국인은 늘어난다", "author": "나승두", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "호텔", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "2026년 한국 호텔 산업은 객실 점유율과 객실 단가가 상승하며 수익성이 개선되었으나, 2027년부터는 객실 점유율 추가 상승 여력이 제한되어 가격 인상이 이익 개선의 핵심 동력이 될 전망이다. 5성급 이상의 호텔 공급은 제한적이며, 초럭셔리 호텔 시장이 확대되어 객실 단가가 지속적으로 상승할 것으로 기대된다. 외국인 관광객의 숙박 지출이 증가하는 가운데, 한국 호텔의 객실 단가는 경쟁 해외 도시 대비 낮아 가격 저항 가능성이 적다. 다만 내국인 수요 감소 및 경기 변수에 따른 수요 변동 리스크는 상존한다.", "key_points": ["2026년 한국 호텔 산업은 객실 점유율(OCC)과 객실 단가(ADR) 상승으로 RevPAR이 개선됨.", "서울 5성급 호텔 객실 점유율은 80% 수준으로 추가 상승 여력 제한적.", "2027년부터는 가격(ADR) 상승이 매출 및 이익 성장의 주요 동력으로 작용할 전망.", "5성급 이상 호텔 공급은 2014년 88개에서 2025년 74개로 감소했으며, 향후 초럭셔리 호텔이 순차적으로 개장 예정.", "초럭셔리 호텔 출현으로 공급은 제한적이나 서비스 업그레이드와 함께 객실 가격은 상승할 전망.", "외국인 관광객의 숙박 관련 신용카드 지출액이 26년 10월까지 전년 동기 대비 27.6% 증가하여 외국인 수요가 증가하고 있음.", "국내 호텔 ADR는 미국, 유럽, 일본 등 주요 경쟁 도시 대비 현저히 낮아 외국인 관광객의 가격 저항 가능성 낮음.", "소비자물가 상승에도 불구하고 한국 호텔 시장은 외국인 관광객 중심 수요로 가격 인상 여력이 존재."], "risks": ["국내 호텔 객실 점유율 상승 여력 제한으로 매출 확대가 가격에 의존.", "소비자 물가 상승으로 인한 내국인 수요 감소 가능성.", "극장, 골프장 등 다른 레저 산업에서 가격 저항으로 인한 수요 감소 사례와 대비.", "초럭셔리 호텔 공급 증가에 따른 경쟁 심화 가능성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654455.pdf", "json_path": "../reports_json/산업/654455.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654455"}, {"report_idx": "654454", "category": "산업", "published_at": "2026-11-23", "title": "2027년 조선 연간전망: 리레이팅은 상선 밖에서", "author": "한승한", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "조선", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "2027년 조선 산업은 고선가 건조 물량 확대와 생산성 향상에 힘입어 역대 최대 실적 성장이 예상되나, 중국의 조선 캐파 증설과 원가 상승, 선가 및 환율 하락 등으로 상선 부문 이익의 지속성에 대한 우려가 존재한다. 이에 따라 조선주 주가의 리레이팅 동력은 기존 상선 부문을 벗어난 데이터센터, MASGA 등 신성장 동력에서 나올 전망이다. 글로벌 조선 캐파 증설의 75% 이상이 중국에 집중되고 있어 상선 멀티플의 상단이 제한되는 환경에서, 4행정 중속엔진과 부유식 데이터센터 수주 본격화, 마스가모멘텀을 통한 새로운 성장 모멘텀 확보가 주가 반등의 핵심 변수로 작용할 것으로 보인다. 다만 중국의 캐파 증설 및 미국 정치 리스크 등은 주의가 필요하다.", "key_points": ["2027년 조선업은 비중확대 의견과 함께 HD 현대중공업과 삼성중공업을 최선호 및 차선호주로 제시함.", "고선가 건조 물량 확대와 생산성 향상으로 이익 성장 기대되나, 2028년 이후 상선 부문 이익 지속성은 중국 캐파 증설, 원가 상승, 선가 및 환율 하락 등으로 불확실함.", "2027년 조선업 핵심 키워드는 중국의 캐파 증설, 데이터 on_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654443.pdf", "json_path": "../reports_json/산업/654443.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654443"}, {"report_idx": "654442", "category": "산업", "published_at": "2026-11-23", "title": "2027년 제약/바이오 연간전망: 대규모 특허 만료에 따른 기회 요인 확대", "author": "이선경", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "제약/바이오", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "2027년 제약/바이오 산업 전망은 글로벌 대형 제약사들의 대규모 특허 만료와 IRA 약가 인하로 인한 매출 공백 확대, 연구개발 생산성 위기가 지속되는 한편, 이로 인해 외부 혁신 의존도가 높아지고 있다. 글로벌 M&A 및 기술이전 규모가 역대 최대를 기록 중이며, 특히 중국 바이오텍과의 기술이전 계약 비중이 급증하는 등 혁신 수급이 중국으로 집중되는 모습이다. 그러나 중국 기업들의 가격 경쟁력은 점차 약화되고 있어 산업 내 수급 불확실성이 내재되어 있다.", "key_points": ["2026년 글로벌 제약/바이오 산업은 NBI 지수 26.4% 상승 등 혁신 기술에 대한 투자 관심 증가.", "2025년 글로벌 제약사의 M&A 규모는 1,221억 달러로 24년 대비 133% 증가, 기술이전은 2,743억 달러로 41% 확대, 2026년도 높은 계약 체결 지속.", "2026~2030년 사이 대규모 특허 만료로 약 3,000억 달러 매출 공백 예상, IRA(인플레이션 감축법)에 의한 약가 인하로 매출 하락 가속화.", "2025년부터 IRA 약가 협상의 할인율은 38~85%까지 확대되어 시장 독점 기간 축소 중.", "글로벌 제약사의 자체 연구개발 생산성은 개선되지 않고 있으며, 2023년 R&D 규모는 2,280억 달러로 1991년 대비 8배 증가했으나 FDA 신약 승인 건수는 연 40~50건에 불과.", "글로벌 제약사들은 후기 파이프라인 IRR이 낮은 가운데 GLP-1 계열 치료제 제외시 IRR은 여전히 하락세.", "외부 혁신 의존 증가, 2024년 FDA 승인 신약의 67%가 신흥 바이오텍 제품이며 임상 파이프라인 55% 신흥 바이오텍 보유.", "중국 바이오텍과의 기술이전 계약 비중과 선급금 급증, 2025년 상반기 중국이 기술이전 계약 중 32%, 선급금은 68% 점유.", "중국의 임상 비용이 미국 대비 3분의 1 수준으로 임상 환자 모집 속도 빠르나, 중국 기업들의 가격 경쟁력은 감소 중."], "risks": ["대규모 특허 만료에 따른 매출 공백 확대 및 IRA 약가 협상에 따른 가격 인하 영향.", "글로벌 제약사의 연구개발 생산성 정체 및 임상 실패율 증가.", "중국 바이오텍 등의 가격 경쟁력 약화로 인한 외부 혁신 수급 변동 가능성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors 및 실적 불확실성으로 인한 성장세 둔화 위험", "과도한 캐파증가에 따른 낮은 가동률로 인한 수익성 저하 위험", "치열한 수주 경쟁과 AMPC 공유 요구가 수익성 압박 가능성", "원료 중국 의존도 및 조달 병목으로 인한 비용 상승과 수익성 악화 위험", "대규모 투자에 따른 차입 부담 누적으로 재무 건전성 악화 가능성"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654439.pdf", "json_path": "../reports_json/산업/654439.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654439"}, {"report_idx": "654437", "category": "산업", "published_at": "2026-11-23", "title": "2027년 IT하드웨어 연간전망: IT인플레이션 다음은?", "author": "박형우", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "IT 하드웨어", "market_topic": "2027년 IT 하드웨어 연간 전망", "investment_opinion": null, "target_price": null, "summary": "2027년 IT 하드웨어 산업은 2026년 대규모 IT인플레이션에 따른 부품 가격 상승과 달리, 스마트폰 및 기타 주요 디바이스 출하량이 크게 역성장하면서 어려움이 예상된다. 세트 업체들은 부품 재고를 이미 크게 쌓았으며, 이에 따라 2027년에는 본격적인 부품 주문 감축(오더컷)이 진행될 전망이다. 고객사들의 LTA 체결과 CAPEX 확대가 진행 중이나 과거 사례에 비춰볼 때 계약의 지속성과 선수금 집행 여부, 증설 규모가 수요를 초과하지 않는지가 관건이다. IT부품 가격 인상(IT인플레이션) 이후, 세트 업체들은 원가 부담으로 강한 원가 절감 압박을 받고 있어 쇼티지가 지속되는 부품 및 기업 선별이 중요하다.", "key_points": ["2026년 상반기 IT 하드웨어는 스마트폰 사이클 이후 처음으로 자본시장 주도주로 부상, 전통 전기전자 부품사 주가 크게 상승", "2027년 주요 이슈는 디바이스 역성장, LTA(Long-Term Agreement) 체결 및 대규모 CAPEX 증설, IT 부품 가격 인상(IT인플레이션) 이후의 시장 변화", "2027년 스마트폰, PC, 태블릿 등 주요 세트 제품 출하량 하락세 심화, 일부 중화권 업체 출하량 -30% 이상 감소, 3분기 스마트폰 출하 -20% 전후", "세트 업체들 비축 재고 증가로 인해 2027년 본격적인 오더컷 예상, 삼성전자는 4분기 보급형 스마트폰 부품 주문을 20~30% 줄이고 있음", "LTA는 과거 수요 감소 시 계약 조정·해지 사례 존재, 2027년 선수금 진행여부와 가격 인상 지속 여부, 증설 규모가 수요를 초과하는 지 여부가 중요", "2026년 IT 인플레이션       const width = 220;

      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const range = Math.max(maxValue - minValue, 1);
      const points = values.map((value, index) => {
        const x = padding + ((width - padding * 2) * index) / (values.length - 1);
        const y = height - padding - ((value - minValue) / range) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;

          return String(b.report_idx || "").localeCompare(String(a.report_idx || ""));
        });
      const root = document.getElementById("history-section");
      if (!entries.length) {
        renderHistoryEmpty("?대떦 醫낅ぉ????λ맂 ?대젰???놁뒿?덈떎.");
        return;
      }

      const companyName = entries.find((item) => item.company_name)?.company_name || stockCode;
      const uniqueDates = new Set(entries.map((item) => item.published_at).filter(Boolean));
      const bestEntry = entries.find((item) => item.alpha_score !== null && item.alpha_score !== undefined);
      const cards = entries.map((item) => renderHistoryReportCardCompact(item)).join("");

      root.innerHTML = `
        <article class="group-card history-group-card">
          <div class="group-head">
            <div>
              <div class="group-title-row">
                <h2 class="group-title">${safe(companyName)}</h2>
              </div>
            </div>
          </div>
          <div class="group-meta">
            <span class="pill"><button type="button" data-copy-stock="${safe(stockCode)}">종목코드 복사</button></span>
            <span class="pill"><a href="${stockWebUrl(stockCode)}" target="_blank" rel="noreferrer">네이버금융</a></span>
          </div>
          <div class="report-stack">${cards}</div>
        </article>
      `;
    }

    async function runStockSearch() {
      const input = document.getElementById("stock-search");
      const query = String(input.value || "").trim();
      if (!query) {
        renderSearchResults("");
        renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
        return;
      }

      renderSearchResults('<span class="badge">아카이브 확인 중...</span>');
      const loaded = await ensureHistoryLoaded();
      if (!loaded) {
        renderSearchResults("");
        renderHistoryEmpty("아카이브를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      const matches = matchingStocks(query).slice(0, 12);
      if (!matches.length) {
        renderSearchResults("");
        renderHistoryEmpty(`"${query}"와 일치하는 종목 이력이 없습니다.`);
        return;
      }

      renderSearchResults(
        matches
          .map(
            (item) => `
              <button type="button" data-stock-history="${safe(item.stock_code)}">
                ${safe(item.company_name)} (${safe(item.stock_code)}) · ${item.report_count}건
              </button>
            `
          )
          .join("")
      );
      renderHistoryForStockCompact(matches[0].stock_code);
    }

    function renderFactorSections(item) {
      if (item.category !== "기업") return "";
      const sections = [];
      if (item.revision_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Revision Signal</div><p class="factor-text">${safe(item.revision_signal)}</p></div>`);
      }
      if (item.structural_growth_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Structural Growth</div><p class="factor-text">${safe(item.structural_growth_signal)}</p></div>`);
      }
      if (item.valuation_risk_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Valuation / Risk</div><p class="factor-text">${safe(item.valuation_risk_signal)}</p></div>`);
      }
      const positiveText = (item.positive_factors || []).map((value) => `+ ${safe(value)}`).join("<br>");
      const negativeText = (item.negative_factors || []).map((value) => `- ${safe(value)}`).join("<br>");
      if (positiveText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Positive Factors</div><p class="factor-text">${positiveText}</p></div>`);
      }
      if (negativeText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Negative Factors</div><p class="factor-text">${negativeText}</p></div>`);
      }
      if (item.market_reaction_placeholder) {
        sections.push(`<div class="factor-box"><div class="factor-title">Market Reaction</div><p class="factor-text">D+1 / D+5 / D+20 추후 연결 예정</p></div>`);
      }
      return sections.length ? `<div class="factor-grid">${sections.join("")}</div>` : "";
    }

    function renderGrouped(items) {
      const root = document.getElementById("list");
      const { groupedCompanies, industry, market } = groupedData(items);

      const groupCards = groupedCompanies.map((group) => {
        const reportsHtml = group.reports.map((report) => {
          const pointItems = (report.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
          return `
            <details class="report-detail">
              <summary>
                <div>
                  <div>${safe(report.title)}</div>
                  <div class="report-brief">${[
                    safe(report.source),
                    safe(report.author),
                    [safe(report.investment_opinion), safe(report.target_price)].filter(Boolean).join(" "),
                    upsideLabel(report),
                  ].filter(Boolean).join(" · ")}</div>
                </div>
                <div>
                  ${report.alpha_score !== null && report.alpha_score !== undefined ? `<div class="badge">${safe(report.alpha_grade || "-")} ${safe(report.alpha_score)}</div>` : ""}
                  <div class="badge">#${safe(report.report_idx)}</div>
                </div>
              </summary>
              <div class="report-body">
                <p class="summary">${safe(report.summary)}</p>
                ${pointItems ? `<ul class="points">${pointItems}</ul>` : ""}
                ${renderFactorSections(report)}
                <div class="links">
                  <a href="${safe(report.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
                </div>
              </div>
            </details>
          `;
        }).join("");

        return `
          <article class="group-card">
            <div class="group-head">
              <div>
                <div class="group-title-row">
                  <h2 class="group-title">${safe(group.company_name)}</h2>
                  ${renderPriceBox(group)}
                </div>
              </div>
            </div>
            <div class="group-meta">
              ${group.stock_code ? `<span class="pill"><button type="button" data-copy-stock="${safe(group.stock_code)}">종목코드 복사</button></span>` : ""}
              ${group.stock_code ? `<span class="pill"><a href="${stockWebUrl(group.stock_code)}" target="_blank" rel="noreferrer">네이버금융</a></span>` : ""}
            </div>
            <div class="report-stack">${reportsHtml}</div>
          </article>
        `;
      }).join("");

      const renderStandaloneSection = (title, entries) => entries.length
        ? `
          <div class="section-title">${title}</div>
          ${entries.map((item) => `
            <article class="card">
              <div class="row">
                <span class="badge">${safe(item.category)}</span>
                <span class="badge">${safe(item.published_at)}</span>
                <span class="badge">#${safe(item.report_idx)}</span>
              </div>
              <h2 class="title">${safe(item.title)}</h2>
              <div class="meta">작성자 ${safe(item.author)} · 출처 ${safe(item.source)}${item.market_topic ? ` · 주제 ${safe(item.market_topic)}` : ""}${item.industry_name ? ` · 산업 ${safe(item.industry_name)}` : ""}</div>
              <p class="summary">${safe(item.summary)}</p>
              ${renderFactorSections(item)}
              <div class="links">
                <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
              </div>
            </article>
          `).join("")}
        `
        : "";

      root.innerHTML = groupCards
        + renderStandaloneSection("산업 리포트", industry)
        + renderStandaloneSection("시장 리포트", market);
    }

    function renderList(items) {
      const root = document.getElementById("list");
      root.innerHTML = items.map((item) => {
        const meta = [
          item.author ? `작성자 ${item.author}` : "",
          item.source ? `출처 ${item.source}` : "",
          item.company_name ? `회사 ${item.company_name}` : "",
          item.stock_code ? `코드 ${item.stock_code}` : "",
          item.industry_name ? `산업 ${item.industry_name}` : "",
          item.market_topic ? `주제 ${item.market_topic}` : "",
          item.investment_opinion ? `의견 ${item.investment_opinion}` : "",
          item.target_price ? `목표가 ${item.target_price}` : "",
          upsideLabel(item),
          item.alpha_score !== null && item.alpha_score !== undefined ? `Alpha ${item.alpha_grade || "-"} ${item.alpha_score}` : "",
          item.live_price ? `현재가 ${item.live_price}원` : "",
        ].filter(Boolean).join(" · ");
        const points = (item.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
        return `
          <article class="card">
            <div class="row">
              <span class="badge">${safe(item.category)}</span>
              <span class="badge">${safe(item.published_at)}</span>
              <span class="badge">#${safe(item.report_idx)}</span>
            </div>
            <h2 class="title">${safe(item.title)}</h2>
            <div class="meta">${meta}</div>
            ${renderAlphaBox(item)}
            <p class="summary">${safe(item.summary)}</p>
            ${points ? `<ul class="points">${points}</ul>` : ""}
            ${renderFactorSections(item)}
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function render() {
      renderModes();
      renderDateOptions();
      renderFilters();
      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
</html>
