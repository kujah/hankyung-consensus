hankyung.com/analysis/downpdf?report_idx=651920"}, {"report_idx": "651939", "category": "산업", "published_at": "2026-08-26", "title": "박제민의 Q&A.I", "author": "박제민", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "-", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "2026년 AI 산업은 대형언어모델(LLM) 단가 하락과 가격 경쟁 심화가 두드러지며, 주요 글로벌 AI 랩들이 경쟁적 가격 정책을 펼치고 있음. 반면 중국 내 AI 스타트업은 컴퓨트 부족으로 가격 인상을 단행하는 등 시장 내 양극화 현상이 진행 중이다. 기업들의 AI 비용 관리가 필수화되며 지출 통제가 강화되는 추세다. 중국 빅테크는 AI 투자 확대 속에 클라우드 및 AI 서비스 부문이 성장하는 반면 본업 수익성은 하락 압력을 받고 있다. 특히, 알리바바는 자체 칩과 슈퍼노드 시스템을 통해 AI 인프라 경쟁력 강화에 주력하고 있으며, 이는 엔비디아 대비 시스템 단위 경쟁력 강화로 해석된다. 산업 전반적으로 가격 경쟁 및 투자 확대에 의한 수익성 조정 국면에 있으나, AI 서비스 및 인프라의 지속적 확장으로 향후 성장 모멘텀은 유지될 전망이다.", "key_points": ["2026년 상반기 대형 LLM(대형언어모델) 지출 단가가 신규 플래그십 모델 출시 후 단기 상승하나, 저가 모델 대량 출시로 단가가 다시 하락하는 사이클 반복.", "OpenAI, Anthropic, Google 등 주요 AI 랩들이 경쟁적 가격 인하를 단행해 고객 비용 부담 완화에 나섬.", "중국 AI 업체 DeepSeek는 수요 폭주와 컴퓨트 자원 부족으로 가격 인상을 예고하며 양방향 가격 조정 현상 등장.", "AI 비용 관리 중요성이 커져 기업들의 AI 지출 초과 사례가 늘어나고, 비용 관리 조직의 전환 가속화.", "중국 빅테크 알리바바와 바이두는 AI 투자 확대에도 본업 수익성은 압박받고 있으나 클라우드 및 AI 관련 사업부 성장 지속.", "알리바바가 자체 설계한 T-Head 칩과 슈퍼노드 시스템 상용화하며 시스템 단위에서 엔비디아 대비 자체 경쟁력 강화 중.", "아마존과 알리바바는 유사한 장기 수익성·CapEx 프레임을 공유하나 규모, 수익성 측면에서 차이가 존재."], "risks": ["LLM 단가 하락과 가격 경쟁 심화에 따른 마진 압박", "중국 업체들의 AI 기술 투자 확대로 인한 수익성 악화 위험", "자체 칩 공급망 병목과 공급 부족 이슈"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/651939.pdf", "json_path": "../reports_json/산업/651939.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651939"}, {"report_idx": "651938", "category": "산업", "published_at": "2026-08-26", "title": "Global Carbon Daily", "author": "최관순", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "탄소배출권 및 에너지 시장", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "글로벌 탄소배출권 시장은 주요 지역의 배출권 가격이 최근 완만하게 상승하는 가운데, 국내 온실가스 저감 인증 실적의 가격 상승이 돋보인다. 반면 글로벌 에너지 가격은 원유 중심으로 하락세가 뚜렷하나 LNG는 견조한 모습을 유지한다. 정책적으로는 탄소 배출권 과징금 미납률이 극히 높고 강제징수 실적이 없는 등 집행의 어려움이 존재한다. 또한 LNG 발전에서의 추가 배출이 늘어나면서 정부의 탄소중립 정책과 실제 시장 상황 간 괴리가 심화되고 있다. 향후 탄소배출권과 에너지 시장은 국제 경제 및 지정학적 상황, 정책 집행력, 에너지 수급 변화 등 다양한 요인에 의해 변동할 가능성이 크다.", "key_points": ["글로벌 주요 지역 배출권 가격이 최근 1개월과 3개월 기준으로 완만한 상승세를 보임(EUA, UKA, KAU 등).", "국내 온실가스 저감 인증 실적(KOC, i-KOC) 가격도 큰 폭으로 상승하여 3개월 동안 30% 이상 증가.", "글로벌 에너지 가격은 최근 1개월 및 3개월 동안 원유와 천연가스 가격이 하락세를 보이나 일부 LNG 가격은 상대적으로 견조함.", "국내외 탄소배출권 관련 ETF/ETN들은 주가 및 총자산에서 소폭 상승 혹은 변동이 제한적임.", "온실가스 배출권 과징금 대다수 미납 상태이고, 강제징수 실적 부재로 정책 집행 미흡 문제 지적.", "LNG 발전에서 탄소 배출량이 증가하며 정부의 탈탄소 정책과는 상반되는 상황이 발생 중.", "국제유가 급락은 대이란 제재 완화 기대에 따른 것으로 시장 변동성 확대 가능성 있음."], "risks": ["온실가스 과징금 미납 및 강제징수 부재에 따른 정책 효과 저하 리스크.", "에너지 가격 변동성 및 국제 지정학적 이슈에 의해 탄소배출권 시장 영향 가능성.", "정부 정책과 실제 배출 상황 간 괴리에 따른 탄소중립 목표 달성 차질 가능성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/651938.pdf", "json_path": "../reports_json/산업/651938.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651938"}, {"report_idx": "651937", "category": "산업", "published_at": "2026-08-26", "title": "Weekly Amazon Beauty Check", "author": "형권훈", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "K뷰티 산업", "market_topic": "아마존 플랫폼을 통한 K뷰티 브랜드의 판매 및 인기 동향 분석", "investment_opinion": null, "target_price": null, "summary": "K뷰티 산업의 미국 아마존 시장 내 전반적인 판매 및 인기도 조사 결과, 주요 브랜드의 BSR 점수는 지난 주 대비 소폭 하락하였으나 상위 인기 브랜드들은 대체로 안정적인 점수를 유지하고 있음. 일부 브랜드들은 점수 상승이 두드러져 아마존 내에서의 브랜드 인지도 및 수요가 변동 중임을 시사한다. 산업 내 주요 브랜드 및 제품들의 판매 동향을 주기적으로 모니터링하여 시장 변화에 대응하는 전략 수립이 요구된다.", "key_points": ["2026년 8월 현재 K뷰티 브랜드들의 아마존 BSR(베스트 셀러 랭킹) 총점은 약 1611점으로 전주 대비 33점 하락하여 다소 둔화됨.", "상위 인기 브랜드는 medicube, ANUA, EQQUALBERRY이며, 점수 상승 폭이 큰 브랜드는 CENTELLIAN 24, ARENCIA, Dr.Althea 등이 있음.", "K뷰티 브랜드 외에도 CeraVe, The Ordinary 같은 글로벌 브랜드들이 높은 순위를 유지하고 있으며, CeraVe는 점수가 크게 상승함.", "전체적으로 아마존 내 K뷰티 유니버스의 BSR 점수는 변동성이 있으나 전반적 상위 브랜드들의 안정적인 인기를 확인 가능.", "제품별로는 medicube의 Toner Pads Zero Pore Pad, Mighty Patch의 Hero Cosmetics Original Nighttime Acne Pimple Patch 등이 상위권을 차지하며, 점수 변화가 미미하거나 소폭 상승함.", "아마존 내 K뷰티 브랜드들의 점수 데이터는 월별/분기별로 추적되어 전반적인 시장 동향 파악에 활용됨."], "risks": [], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/651937.pdf", "json_path": "../reports_json/산업/651937.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651937"}, {"report_idx": "651935", "category": "산업", "published_at": "2026-08-26", "title": "통신 Weekly", "author": "이승웅", "source": "유안타증권", "company_name": null, "stock_code": null, "industry_name": "통신서비스", "market_topic": "통신 3사 및 관련 AI, 네트워크, 3G 종료, 미국 사업장 효율화", "investment_opinion": null, "target_price": null, "summary": "통신 산업은 최근 대외 환경 속에서도 상대적 방어력을 보이며 안정적인 시장 수익률을 유지하고 있다. SK텔레콤은 미국 내 자회사들을 집결해 운영 효율성을 극대화하고 있으며, 3G 서비스 종료를 준비하며 이용자 전환 지원에 집중하고 있다. 한편, 통신 3사는 AI 분야에서 각기 차별화된 전략을 추진 중이며, AI 인프라 고도화와 신규 서비스 출시에 적극적이다. 앤트로픽에 대한 SK텔레콤의 투자 가치는 크게 상승하여 자산가치 제고에 기여하고 있다. 해외 주요 통신사들의 밸류에이션도 안정적인 편이다. 전체적으로 통신 산업은 AI 및 차세대 네트워크 기술 중심의 구조적 성장 가능성은 있지만, 기술 경쟁과 정책 리스크, 글로벌 경기 변동성에 대비가 필요하다.", "key_points": ["통신업종은 최근 1주간 코스피 대비 상대적으로 방어적 성과를 보임(-1.2% vs -1.9%)", "SK텔레콤은 미국 내 자회사들을 산타클라라 지역으로 집결하여 운영 효율화 및 시너지 제고 추진", "통신 3사는 AI 사업 강화를 위해 자체 AI 서비스 및 플랫폼 역량 기반의 ‘모두의 AI’ 프로젝트를 진행 중이며, 8월 말까지 사업자 선정을 목표로 함", "KT는 AI 시대에 맞춰 고효율 AI 인프라 개발에 집중, 광기반 통신기술과 모듈러 데이터센터 도입 등 혁신적 인프라 전략 제시", "SK텔레콤이 3G 신규가입 중단 및 서비스 종료를 준비 중으로, 관련 이용자 지원 프로그램도 시행 중", "앤트로픽 관련 SK텔레콤의 지분가치가 크게 상승했으며, 기업가치는 약 9,650억 달러 수준으로 평가됨", "국내외 통신사들의 주가 및 배당 수익률, 외국인 지분율 등은 일정 수준 유지 중"], "risks": ["AI 인프라 투자와 관련 기술 개발에 따른 경쟁 심화", "3G 서비스 종료에 따른 이용자 전환 이슈 및 정부 승인 절차 지연 가능성", "글로벌 및 국내 경제 불확실성으로 인한 통신 산업 수익성 변동 위험"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/651935.pdf", "json_path": "../reports_json/산업/651935.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651935"}, {"report_idx": "651930", "category": "산업", "published_at": "2026-08-26", "title": "[인터넷/게임] IBKS Daily", "author": "이승훈, 박상준", "source": "IBK투자증권", "company_name": null, "stock_code": null, "industry_name": "인터넷/게임", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "인터넷·게임 산업 내 게임 벤처투자는 전반적으로 감소세이나, 인공지능(AI)을 활용한 게임 개발 기술에 대한 투자는 증가 추세임. 국내 주요 기업인 카카오는 내부 재배치로 AI 집중 전략을, 네이버는 글로벌 플랫폼 인수를 통한 AI 자원 확충 전략을 각각 진행 중이다. AI 기술 도입에 따른 개발 비용 절감이 투자 핵심으로 부상하면서 업계는 AI 중심으로 전략 재편 중이다. 다만 AI 수익화 성공 여부는 향후 기업 가치에 중요한 변수로 남아 있다.", "key_points": ["글로벌 게임 벤처투자액은 2020년 대비 급감했으나, AI를 활용한 게임 개발 인프라 기업에 대한 투자는 2배 이상 증가.", "국내 게임 분야 벤처투자도 2023년 상반기 기준 전년 대비 76.3% 감소했으나, AI기술을 활용한 게임 개발 기업에 대한 투자는 소폭 유지됨.", "카카오는 적자 계열사 정리 및 인적분할을 통해 AI에 자본과 인력을 집중하는 내부 재배치 전략 시행 중.", "네이버는 해외 플랫폼 인수를 통해 AI 활용을 위한 이용자, 상품, 거래 데이터를 확충하며 글로벌 확장 전략 추진.", "2024년까지 자회사 수를 줄였던 네이버와 카카오가 향후 AI 관련 성장 전략에서 상반된 길을 선택함.", "AI를 활용한 개발 비용 절감 기술이 신규 투자 핵심으로 부상하며 업계의 전략 변화가 두드러짐."], "risks": ["AI 수익화 및 기업가치 개선에 대한 불확실성 존재.", "글로벌 게임 인프라 투자 위축이 장기 성장에 부정적 영향 가능성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/651930.pdf", "json_path": "../reports_json/산업/651930.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=651930"}, {"report_idx": "651921", "category": "산업", "published_at": "2026-08-26", "title": "AI 에이전트의 개화기, 인터넷 산업은 격동기", "author": "정해창", "source": "대신증권", "company_name": null, "stock_code": null, "industry_name": "인터넷 산업", "market_topic": "AI 에이전트의 개화기 및 인터넷 산업 격동", "investment_opinion": null, "target_price": null, "summary": "인터넷 산업은 AI 에이전트의 본격화로 산업 전반에 걸쳐 큰 변화를 겪고 있으며, AI 인프라 중심의 거대한 투자 사이클이 진행 중이다. 국내 인터넷 기업들은 AI 도입에 따른 불확실성과 글로벌 경쟁압력으로 인해 저평가된 상태이나, 2029년 이후 AI 수익화가 본격화될 것으로 기대된다. 특히 삼성에스디에스와 NAVER가 AI 인프라 투자 측면에서 우위를 점하고 있으며, 로컬 서비스           <div class="score-grade">Alpha ${safe(item.alpha_grade || "-")}</div>
          <div class="score-main">${safe(item.alpha_score)}</div>
          <div class="score-sub">${safe(item.score_reason || "")}</div>
        </div>
      `;
    }

    function stockWebUrl(stockCode) {
      if (!stockCode) return "";
      return `https://finance.naver.com/item/main.naver?code=${encodeURIComponent(stockCode)}`;
    }

    async function copyStockCode(stockCode) {
      if (!stockCode) return;
      try {
        await navigator.clipboard.writeText(String(stockCode));
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = String(stockCode);
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      alert(`종목코드 복사: ${stockCode}`);
    }

    async function fetchReportsForDate(date) {
      if (!date) return [];
      if (reportCache.has(date)) return reportCache.get(date) || [];
      try {
        const response = await fetch(`./archive/${date}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const nextReports = payload.reports || [];
        reportCache.set(date, nextReports);
        return nextReports;
      } catch (error) {
        return null;
      }
    }

    async function ensureHistoryLoaded() {
      if (historyLoaded) return true;
      for (const date of availableDates) {
        const loaded = await fetchReportsForDate(date);
        if (loaded === null) return false;
      }
      historyLoaded = true;
      return true;
    }

    function allCachedReports() {
      return Array.from(reportCache.values()).flat();
    }

    function stockCatalog() {
      const grouped = new Map();
      for (const item of allCachedReports()) {
        if (item.category !== "기업" || !item.stock_code) continue;
        const key = item.stock_code;
        if (!grouped.has(key)) {
          grouped.set(key, {
            stock_code: item.stock_code,
            company_name: item.company_name || item.title || item.stock_code,
            report_count: 0,
            dates: new Set(),
            latest_date: item.published_at || "",
          });
        }
        const stock = grouped.get(key);
        stock.report_count += 1;
        if (item.company_name) stock.company_name = item.company_name;
        if (item.published_at) stock.dates.add(item.published_at);
        if ((item.published_at || "") > stock.latest_date) stock.latest_date = item.published_at || "";
      }
      return Array.from(grouped.values());
    }

    function renderSearchResults(htmlText) {
      document.getElementById("search-results").innerHTML = htmlText;
    }

    function renderHistoryEmpty(message) {
      const root = document.getElementById("history-section");
      root.innerHTML = `<div class="history-empty">${safe(message)}</div>`;
    }

    function matchingStocks(query) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return [];
      return stockCatalog()
        .map((item) => {
          const name = String(item.company_name || "").toLowerCase();
          const code = String(item.stock_code || "").toLowerCase();
          let score = -1;
          if (code === keyword) score = 100;
          else if (name === keyword) score = 95;
          else if (code.startsWith(keyword)) score = 80;
          else if (name.startsWith(keyword)) score = 70;
          else if (code.includes(keyword)) score = 60;
          else if (name.includes(keyword)) score = 50;
          return { ...item, score };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => {
          const scoreDiff = b.score - a.score;
          if (scoreDiff !== 0) return scoreDiff;
          const dateDiff = (b.latest_date || "").localeCompare(a.latest_date || "");
          if (dateDiff !== 0) return dateDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });
    }

    function renderHistoryReportCard(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" 쨌 ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <h3 class="history-report-title">${safe(item.title)}</h3>
            <div class="report-brief">${meta}</div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStock(stockCode) {
      renderHistoryForStockCompact(stockCode);
    }

    function renderHistoryReportCardCompact(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" / ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <div class="history-title-row">
              <h3 class="history-report-title">${safe(item.title)}</h3>
              ${item.published_at ? `<span class="badge">${safe(item.published_at)}</span>` : ""}
            </div>
            <div class="report-brief">${meta}</div>
            <p class="summary">${safe(item.summary)}</p>
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문</a>
            </div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStockCompact(stockCode) {
      const entries = allCachedReports()
        .filter((item) => item.stock_code === stockCode)
        .sort((a, b) => {
          const dateDiff = (b.published_at || "").localeCompare(a.published_at || "");
          if (dateDiff !== 0) return dateDiff;
          return String(b.report_idx || "").localeCompare(String(a.report_idx || ""));
        });
      const root = document.getElementById("history-section");
      if (!entries.length) {
        renderHistoryEmpty("?대떦 醫낅ぉ????λ맂 ?대젰???놁뒿?덈떎.");
        return;
      }

      const companyName = entries.find((item) => item.company_name)?.company_name || stockCode;
      const uniqueDates = new Set(entries.map((item) => item.published_at).filter(Boolean));
      const bestEntry = entries.find((item) => item.alpha_score !== null && item.alpha_score !== undefined);
      const cards = entries.map((item) => renderHistoryReportCardCompact(item)).join("");

      root.innerHTML = `
        <article class="group-card history-group-card">
          <div class="group-head">
            <div>
              <div class="group-title-row">
                <h2 class="group-title">${safe(companyName)}</h2>
              </div>
            </div>
          </div>
          <div class="group-meta">
            <span class="pill"><button type="button" data-copy-stock="${safe(stockCode)}">종목코드 복사</button></span>
            <span class="pill"><a href="${stockWebUrl(stockCode)}" target="_blank" rel="noreferrer">네이버금융</a></span>
          </div>
          <div class="report-stack">${cards}</div>
        </article>
      `;
    }

    async function runStockSearch() {
      const input = document.getElementById("stock-search");
      const query = String(input.value || "").trim();
      if (!query) {
        renderSearchResults("");
        renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
        return;
      }

      renderSearchResults('<span class="badge">아카이브 확인 중...</span>');
      const loaded = await ensureHistoryLoaded();
      if (!loaded) {
        renderSearchResults("");
        renderHistoryEmpty("아카이브를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      const matches = matchingStocks(query).slice(0, 12);
      if (!matches.length) {
        renderSearchResults("");
        renderHistoryEmpty(`"${query}"와 일치하는 종목 이력이 없습니다.`);
        return;
      }

      renderSearchResults(
        matches
          .map(
            (item) => `
              <button type="button" data-stock-history="${safe(item.stock_code)}">
                ${safe(item.company_name)} (${safe(item.stock_code)}) · ${item.report_count}건
              </button>
            `
          )
          .join("")
      );
      renderHistoryForStockCompact(matches[0].stock_code);
    }

    function renderFactorSections(item) {
      if (item.category !== "기업") return "";
      const sections = [];
      if (item.revision_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Revision Signal</div><p class="factor-text">${safe(item.revision_signal)}</p></div>`);
      }
      if (item.structural_growth_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Structural Growth</div><p class="factor-text">${safe(item.structural_growth_signal)}</p></div>`);
      }
      if (item.valuation_risk_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Valuation / Risk</div><p class="factor-text">${safe(item.valuation_risk_signal)}</p></div>`);
      }
      const positiveText = (item.positive_factors || []).map((value) => `+ ${safe(value)}`).join("<br>");
      const negativeText = (item.negative_factors || []).map((value) => `- ${safe(value)}`).join("<br>");
      if (positiveText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Positive Factors</div><p class="factor-text">${positiveText}</p></div>`);
      }
      if (negativeText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Negative Factors</div><p class="factor-text">${negativeText}</p></div>`);
      }
      if (item.market_reaction_placeholder) {
        sections.push(`<div class="factor-box"><div class="factor-title">Market Reaction</div><p class="factor-text">D+1 / D+5 / D+20 추후 연결 예정</p></div>`);
      }
      return sections.length ? `<div class="factor-grid">${sections.join("")}</div>` : "";
    }

    function renderGrouped(items) {
      const root = document.getElementById("list");
      const { groupedCompanies, industry, market } = groupedData(items);

      const groupCards = groupedCompanies.map((group) => {
        const reportsHtml = group.reports.map((report) => {
          const pointItems = (report.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
          return `
            <details class="report-detail">
              <summary>
                <div>
                  <div>${safe(report.title)}</div>
                  <div class="report-brief">${[
                    safe(report.source),
                    safe(report.author),
                    [safe(report.investment_opinion), safe(report.target_price)].filter(Boolean).join(" "),
                    upsideLabel(report),
                  ].filter(Boolean).join(" · ")}</div>
                </div>
                <div>
                  ${report.alpha_score !== null && report.alpha_score !== undefined ? `<div class="badge">${safe(report.alpha_grade || "-")} ${safe(report.alpha_score)}</div>` : ""}
                  <div class="badge">#${safe(report.report_idx)}</div>
                </div>
              </summary>
              <div class="report-body">
                <p class="summary">${safe(report.summary)}</p>
                ${pointItems ? `<ul class="points">${pointItems}</ul>` : ""}
                ${renderFactorSections(report)}
                <div class="links">
                  <a href="${safe(report.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
                </div>
              </div>
            </details>
          `;
        }).join("");

        return `
          <article class="group-card">
            <div class="group-head">
              <div>
                <div class="group-title-row">
                  <h2 class="group-title">${safe(group.company_name)}</h2>
                  ${renderPriceBox(group)}
                </div>
              </div>
            </div>
            <div class="group-meta">
              ${group.stock_code ? `<span class="pill"><button type="button" data-copy-stock="${safe(group.stock_code)}">종목코드 복사</button></span>` : ""}
              ${group.stock_code ? `<span class="pill"><a href="${stockWebUrl(group.stock_code)}" target="_blank" rel="noreferrer">네이버금융</a></span>` : ""}
            </div>
            <div class="report-stack">${reportsHtml}</div>
          </article>
        `;
      }).join("");

      const renderStandaloneSection = (title, entries) => entries.length
        ? `
          <div class="section-title">${title}</div>
          ${entries.map((item) => `
            <article class="card">
              <div class="row">
                <span class="badge">${safe(item.category)}</span>
                <span class="badge">${safe(item.published_at)}</span>
                <span class="badge">#${safe(item.report_idx)}</span>
              </div>
              <h2 class="title">${safe(item.title)}</h2>
              <div class="meta">작성자 ${safe(item.author)} · 출처 ${safe(item.source)}${item.market_topic ? ` · 주제 ${safe(item.market_topic)}` : ""}${item.industry_name ? ` · 산업 ${safe(item.industry_name)}` : ""}</div>
              <p class="summary">${safe(item.summary)}</p>
              ${renderFactorSections(item)}
              <div class="links">
                <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
              </div>
            </article>
          `).join("")}
        `
        : "";

      root.innerHTML = groupCards
        + renderStandaloneSection("산업 리포트", industry)
        + renderStandaloneSection("시장 리포트", market);
    }

    function renderList(items) {
      const root = document.getElementById("list");
      root.innerHTML = items.map((item) => {
        const meta = [
          item.author ? `작성자 ${item.author}` : "",
          item.source ? `출처 ${item.source}` : "",
          item.company_name ? `회사 ${item.company_name}` : "",
          item.stock_code ? `코드 ${item.stock_code}` : "",
          item.industry_name ? `산업 ${item.industry_name}` : "",
          item.market_topic ? `주제 ${item.market_topic}` : "",
          item.investment_opinion ? `의견 ${item.investment_opinion}` : "",
          item.target_price ? `목표가 ${item.target_price}` : "",
          upsideLabel(item),
          item.alpha_score !== null && item.alpha_score !== undefined ? `Alpha ${item.alpha_grade || "-"} ${item.alpha_score}` : "",
          item.live_price ? `현재가 ${item.live_price}원` : "",
        ].filter(Boolean).join(" · ");
        const points = (item.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
        return `
          <article class="card">
            <div class="row">
              <span class="badge">${safe(item.category)}</span>
              <span class="badge">${safe(item.published_at)}</span>
              <span class="badge">#${safe(item.report_idx)}</span>
            </div>
            <h2 class="title">${safe(item.title)}</h2>
            <div class="meta">${meta}</div>
            ${renderAlphaBox(item)}
            <p class="summary">${safe(item.summary)}</p>
            ${points ? `<ul class="points">${points}</ul>` : ""}
            ${renderFactorSections(item)}
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function render() {
      renderModes();
      renderDateOptions();
      renderFilters();
      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
</html>
