완화에 따른 KOSPI 반등 및 업종별 차별화, 글로벌 정책 불확실성 해소로 증시 긍정 전망", "investment_opinion": null, "target_price": null, "summary": "2026년 미국 중간선거에서 민주당이 상하원 과반을 차지하며 AI 규제 우려가 일시적으로 확대되었으나 과도한 불안 심리가 진정되어 KOSPI는 반등하였다. KOSPI는 5,200선 부근에서 지지력을 확보할 것으로 전망되며, 변동성 증가에도 추가 하락시 단기 조정 후 빠른 회복이 예상된다. 업종별로는 신재생에너지와 2차전지 부문에서 정책 수혜 기대감이 크게 반영된 반면, 반도체 및 AI 밸류체인은 투자 심리 위축과 데이터센터 건설 지연 우려로 조정받았다. 미국 내 정치적 제도적 제약으로 트럼프 행정부의 정책 기조는 유지될 전망이며, 이로 인해 입법 교착 상태가 지속되어 AI 규제와 투자 속도에 한정된 영향만 줄 것으로 보인다. 전반적으로 중간선거 이후 불확실성 해소에 따른 안도감으로 미국 증시 상승세가 기대되나 전력 비용 부담과 인허가 강화에 따른 투자 지연 가능성 등 리스크도 상존한다.", "key_points": ["미국 중간선거에서 민주당이 상하원 과반 확보, AI 데이터센터 투자 둔화 우려에도 과도한 불안 심리 진정 후 KOSPI 반등", "KOSPI는 5,200선 지지력 확보 기대, 변동성 확대 가능성 있지만 추가 하락시 단기 조정 후 회복 예상", "신재생에너지 및 2차전지 업종은 정책 수혜 기대감에 급등, 반도체 및 AI 밸류체인은 투자심리 위축 및 건설 지연 우려에 낙폭 확대", "미국 정책 방향은 대통령 거부권 등 제도적 제약으로 트럼프 정책 유지 전망, 입법 교착과 AI 규제 영향은 제한적", "중간선거 이후 불확실성 해소로 미국 증시 상승 기대, 금리 및 환율 영향 제한적"], "risks": ["AI 데이터센터에 대한 전력 비용 부담 증가와 인허가 규제로 인한 투자 집행 지연 가능성 존재", "정치적 불확실성에 따른 수급 변동성 확대 위험", "미국 연방정부 셧다운, 부채한도 협상 지연 등의 입법 교착 리스크 내재"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/시장/653766.pdf", "json_path": "../reports_json/시장/653766.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653766"}, {"report_idx": "653804", "category": "산업", "published_at": "2026-11-05", "title": "은행 중심 방어력이 관건이 되는 구간", "author": "im증권 리서치본부", "source": "iM증권", "company_name": null, "stock_code": null, "industry_name": "은행 및 금융업", "market_topic": "은행 중심 방어력 중요, 2027년 안정적 실적 및 주주환원 변화 전망" 국(CEA, 95.2위안/톤) 및 한국(KAU, KOC, i-KOC) 등에서 변동을 보임.", "최근 3개월 기준 유럽 및 영국 배출권 가격은 10% 이상 상승하는 등 상승세를 유지하나, 일부 지역은 등락이 혼재됨.", "글로벌 에너지 원자재 가격(원유, 천연가스, LNG 등)은 최근 1개월 내 큰 폭으로 하락 후 일부 회복세를 보이면서 변동성이 큰 모습.", "탄소배출권 관련 ETF/ETN은 전반적으로 최근 1주일 간 소폭 상승 흐름을 나타냄.", "미국의 정치 상황(민주당 압승)에 따른 이란 전쟁 종식 기대감으로 국제 유가가 급락하는 등 지정학적 리스크 영향이 큼.", "국내에서는 에너지공단이 해외 탄소감축사업 진출 지원 등 탄소시장 공략을 강화하고, 시민·노동계가 정부에 온실가스 감축목표 상향을 촉구하는 등 정책적 관심이 높아지고 있음.", "글로벌 탄소배출권 및 에너지 시장은 지정학적, 정책적 변화 및 수급 상황에 민감하게 반응하며 가격에 영향을 미치고 있음."], "risks": ["국제 정치 상황 및 지정학적 리스크로 인한 에너지 및 탄소배출권 가격 변동성 증가 가능성.", "정책 변화에 따른 시장 불확실성 내재.", "에너지 가격 변동에 따른 배출권 수요 및 가격 영향 가능성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/653793.pdf", "json_path": "../reports_json/산업/653793.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653793"}, {"report_idx": "653781", "category": "산업", "published_at": "2026-11-05", "title": "[2027년 연간전망] 2027, 왜 다시 2차전지인가", "author": "이안나, 배종성", "source": "유안타증권", "company_name": null, "stock_code": null, "industry_name": "2차전지", "market_topic": "2027년 2차전지 산업 연간전망", "investment_opinion": null, "target_price": null, "summary": "2027년 2차전지 산업은 미국 중간선거 이후 정책 리스크 해소와 강화된 비중국 소재 규제로 북미 시장에서의 '북미 요새' 완성이 예상된다. 이로 인해 북미 BESS 셀 공급에 심각한 병목 현상이 나타나며, 한국 셀 업체들이 현지 시장을 주도할 전망이다. 유럽 시장 또한 배터리 패스포트 및 공급망 규제 강화로 현지 생산 기업에 유리한 환경이 조성되고, BEV 판매 증가가 예상된다. 한편, 중국의 LFP 배터리 정책 변경과 더불어 High-Ni 배터리 기술이 재평가받으면서 한국산 프리미엄 배터리의 경쟁력이 강화되고 있다. 신규 고출력 전지 수요가 예상되는 AI, 휴머노이드, 항공우주 분야에서 삼성SDI의 전고체 배터리 양산 시작은 기술 프리미엄을 부각시킬 전망이다. 이에 업체 위탁도 검토 중이다. 이 과정에서 국내 통신장비 업체들이 새로운 공급망 진입 기회를 확보할 수 있으며, 미국 내 보안 이슈로 비중국 공급망 선호 현상이 국내 업체에 긍정적 영향을 줄 전망이다. 다만, 직접 수주 여부는 아직 불확실하며 글로벌 경쟁과 투자 일정 변화 등 위험 요인도 존재한다. 전체적으로 스페이스X의 지상망 투자와 미국 내 신규 5G 인프라 구축은 국내 통신장비 산업 내 신규 수요 및 투자 기대감을 높이는 요인이다.", "key_points": ["스페이스X가 미국에서 지상 5G 기지국 구축 계획을 구체화함.", "퀄컴과 5G 지상 기지국용 반도체 및 소프트웨어 공급 계약을 체결하여 2027년부터 수만 개 기지국 구축 예정.", "스페이스X는 기존 통신철탑 임대 후 신규 무선장비 설치 예정이며, Starlink 위성망과 연계하여 음영지역을 보완하는 구조.", "기지국 설계는 스페이스X 자체 설계 가능성이 높으며, Open RAN 전문업체 위탁 가능성은 중간, 기존 3대 RAN 벤더 설계 가능성은 낮음.", "국내 통신장비 업체들이 스페이스X 및 퀄컴을 통한 신규 공급망 진입 기회를 모색 중이며, 직접 공급 가능성 있음.", "미국 내 통신장비 보안 규제로 비중국 공급망 선호 현상이 국내 업체에 긍정적 영향을 미칠 수 있음.", "스페이스X 지상망 구축은 국내 통신장비 섹터 내 신규 투자 사이클 기대감을 자극하고 있음."], "risks": ["스페이스X 및 퀄컴과의 직접 공급 레퍼런스 부족으로 실제 수주 여부 불확실.", "글로벌 통신장비 업체와 경쟁 심화 가능성.", "스페이스X 지상망 구축 및 투자 일정 및 규모가 변동될 위험.", "미국 통신시장 및 규제 환경 변화에 따른 영향 가능성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/653763.pdf", "json_path": "../reports_json/산업/653763.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653763"}, {"report_idx": "653762", "category": "산업", "published_at": "2026-11-05", "title": "美 블루 쓰나미, 그린산업 전체에 훈풍", "author": "한병화", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "그린산업", "market_topic": "미국 중간선거 후 민주당의 압도적 승리와 인허가 개혁법(BAAJA) 진행이 그린산업에 긍정적 영향", "investment_opinion": null, "target_price": null, "summary": "2026년 미국 중간선거에서 민주당이 상·하원을 모두 장악함에 따라 그린산업에 대한 정책 지원과 업황 개선 기대감이 커지고 있다. 특히 연내 법안 통과가 예상되는 인허가 개혁법(BAAJA)은 재생에너지 인프라             groups.set(key, {
              stock_code: item.stock_code,
              company_name: item.company_name || item.title,
              live_price: item.live_price,
              live_price_change: item.live_price_change,
              live_price_rate: item.live_price_rate,
              live_price_as_of: item.live_price_as_of,
              live_price_high_52w: item.live_price_high_52w,
              price_history: item.price_history || [],
              best_alpha_score: item.alpha_score,
              best_alpha_grade: item.alpha_grade,
              reports: [],
            });
          }
          const group = groups.get(key);
          if ((!group.price_history || !group.price_history.length) && item.price_history?.length) {
            group.price_history = item.price_history;
          }
          if ((item.alpha_score || -1) > (group.best_alpha_score || -1)) {
            group.best_alpha_score = item.alpha_score;
            group.best_alpha_grade = item.alpha_grade;
          }
          group.reports.push(item);
        } else if (item.category === "산업") {
          industry.push(item);
        } else {
          market.push(item);
        }
      }

      const groupedCompanies = Array.from(groups.values())
        .map((group) => ({
          ...group,
          reports: group.reports.sort((a, b) => {
            const scoreDiff = (b.alpha_score || -1) - (a.alpha_score || -1);
            if (scoreDiff !== 0) return scoreDiff;
            const sourceA = a.source || "";
            const sourceB = b.source || "";
            return sourceA.localeCompare(sourceB, "ko");
          }),
        }))
        .sort((a, b) => {
          const scoreDiff = (b.best_alpha_score || -1) - (a.best_alpha_score || -1);
          if (scoreDiff !== 0) return scoreDiff;
          const countDiff = b.reports.length - a.reports.length;
          if (countDiff !== 0) return countDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });

      return { groupedCompanies, industry, market };
    }

    function formatQuoteAsOf(value) {
      const text = safe(value);
      const matched = text.match(/(\d{4}\.\d{2}\.\d{2})/);
      if (matched) return `${matched[1].slice(2)} 장마감 기준`;
      return text
        .replace(/^현재가\s*/, "")
        .replace(/\s*기준(?:\(KRX 장마감\)|\(장마감\)|\(KRX장마감\)|\(KRX 마감\))?/g, "")
        .trim();
    }

    function priceDirectionClass(group) {
      const explicit = safe(group.live_price_direction).toLowerCase();
      if (explicit === "up" || explicit === "rise") return "up";
      if (explicit === "down" || explicit === "fall") return "down";

      const changeAmount = parsePriceValue(group.live_price_change);
      const changeRate = parsePriceValue(group.live_price_rate);
      if (Number.isFinite(changeAmount) && changeAmount < 0) return "down";
      if (Number.isFinite(changeRate) && changeRate < 0) return "down";
      if (Number.isFinite(changeAmount) && changeAmount > 0) return "up";
      if (Number.isFinite(changeRate) && changeRate > 0) return "up";

      const text = `${safe(group.live_price_change)} ${safe(group.live_price_rate)}`;
      if (text.includes("-")) return "down";
      return "";
    }

    function renderSparkline(history) {
      const values = (history || [])
        .map((item) => parsePriceValue(item.close))
        .filter((value) => Number.isFinite(value));
      if (values.length < 2) return "";

      const width = 220;
      const height = 40;
      const padding = 2;
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const range = Math.max(maxValue - minValue, 1);
      const points = values.map((value, index) => {
        const x = padding + ((width - padding * 2) * index) / (values.length - 1);
        const y = height - padding - ((value - minValue) / range) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const lastPoint = points[points.length - 1].split(",");
      const trendUp = values[values.length - 1] >= values[0];
      const stroke = trendUp ? "#0d7a5f" : "#ca6702";
      return `
        <div class="price-chart" aria-label="최근 3개월 주가 추이">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-hidden="true">
            <polyline fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${points.join(" ")}"></polyline>
            <circle cx="${lastPoint[0]}" cy="${lastPoint[1]}" r="2.8" fill="${stroke}"></circle>
          </svg>
        </div>
        <div class="price-caption">[3개월 주가 추이]</div>
      `;
    }

    function renderPriceBox(group) {
      if (!group.live_price) {
        return `

            <div class="price-label">현재가</div>
            <div class="price-main">조회 실패</div>
          </div>
        `;
      }

      const change = [safe(group.live_price_change), safe(group.live_price_rate)].filter(Boolean).join(" / ");
      const directionClass = priceDirectionClass(group);
      const high52w = safe(group.live_price_high_52w);
      return `
        <div class="price-box">
          <div class="price-label">${formatQuoteAsOf(group.live_price_as_of)}</div>
          <div class="price-main">${safe(group.live_price)}원</div>

          ${high52w ? `<div class="price-extra">52주 최고가 ${high52w}원</div>` : ""}

    async function copyStockCode(stockCode) {
      if (!stockCode) return;
      try {
        await navigator.clipboard.writeText(String(stockCode));
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = String(stockCode);
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      alert(`종목코드 복사: ${stockCode}`);
    }

    async function fetchReportsForDate(date) {
      if (!date) return [];
      if (reportCache.has(date)) return reportCache.get(date) || [];
      try {
        const response = await fetch(`./archive/${date}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const nextReports = payload.reports || [];
        reportCache.set(date, nextReports);
        return nextReports;
      } catch (error) {
        return null;
      }
    }

    async function ensureHistoryLoaded() {
      if (historyLoaded) return true;
      for (const date of availableDates) {
        const loaded = await fetchReportsForDate(date);
        if (loaded === null) return false;
      }
      historyLoaded = true;
      return true;
    }

    function allCachedReports() {
      return Array.from(reportCache.values()).flat();
    }

    function stockCatalog() {
      const grouped = new Map();
      for (const item of allCachedReports()) {
        if (item.category !== "기업" || !item.stock_code) continue;
        const key = item.stock_code;
        if (!grouped.has(key)) {
          grouped.set(key, {
            stock_code: item.stock_code,
            company_name: item.company_name || item.title || item.stock_code,
            report_count: 0,
            dates: new Set(),
            latest_date: item.published_at || "",
          });
        }
        const stock = grouped.get(key);
        stock.report_count += 1;
        if (item.company_name) stock.company_name = item.company_name;
        if (item.published_at) stock.dates.add(item.published_at);
        if ((item.published_at || "") > stock.latest_date) stock.latest_date = item.published_at || "";
      }
      return Array.from(grouped.values());
    }

    function renderHistoryEmpty(message) {

    function matchingStocks(query) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return [];
      return stockCatalog()
        .map((item) => {
          const name = String(item.company_name || "").toLowerCase();
          const code = String(item.stock_code || "").toLowerCase();
          let score = -1;
          if (code === keyword) score = 100;
          else if (name === keyword) score = 95;
          else if (code.startsWith(keyword)) score = 80;
          else if (name.startsWith(keyword)) score = 70;
          else if (code.includes(keyword)) score = 60;
          else if (name.includes(keyword)) score = 50;
          return { ...item, score };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => {
          const scoreDiff = b.score - a.score;
          if (scoreDiff !== 0) return scoreDiff;
          const dateDiff = (b.latest_date || "").localeCompare(a.latest_date || "");
          if (dateDiff !== 0) return dateDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });
    }

    async function runStockSearch() {
      const input = document.getElementById("stock-search");
      const query = String(input.value || "").trim();
      if (!query) {
        renderSearchResults("");
        renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");

      renderSearchResults('<span class="badge">아카이브 확인 중...</span>');

          .map(

              </button>
            `

          .join("")
      );
      renderHistoryForStockCompact(matches[0].stock_code);

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
</html>
