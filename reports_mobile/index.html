문객 수도 13.9% 증가했으며, 신규 제주 직항 노선 개설 및 마카오 노선 증편 계획으로 방문객 증가세 지속 전망.", "파라다이스는 드롭액이 2.2% 감소했으나 순매출은 13.1% 상승, VIP 고객의 중국인 비중 감소와 일본·기타 지역 고객 증가가 특징.", "GKL은 드롭액 및 순매출 소폭 상승하며 VIP 방문객 수도 늘었으나 전체 방문객 수는 감소 추세.", "9월 외국인 관광객 수가 전년 대비 21.1% 증가하며 견조한 성장세 유지, 특히 중국, 일본, 대만 등 아시아 주요국 관광객 증가가 두드러짐.", "정부의 관광산업 육성 의지에 힘입어 2027년 관광 부문 예산 전년 대비 18.8% 증가, 2,300만명 외국인 관광객 목표 달성 가시권에 있음.", "마카오 카지노 매출은 중국 정부의 강화된 과세 및 거시경제 영향으로 10% 감소, VIP 고객 위축 심화로 센티먼트 회복에 시간 필요."], "risks": ["중국 정부의 해외 신탁 과세 및 신고 강화로 VIP 고객 베팅 위축 지속.", "환율 하락에 따른 인바운드 관광 성장 둔화 가능성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654109.pdf", "json_path": "../reports_json/산업/654109.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654109"}, {"report_idx": "654107", "category": "산업", "published_at": "2026-11-12", "title": "상선 시장에 드리운 암운, 그 너머의 빛", "author": "김용민", "source": "유안타증권", "company_name": null, "stock_code": null, "industry_name": "조선", "market_topic": "상선 시장 업황 및 한미 해양방산 협력(MASGA) 영향", "investment_opinion": null, "target_price": null, "summary": "조선산업은 FY27F 신조선가 지수가 다소 상승했음에도 고수익 선종 발주 약화와 중국 조선산업의 경쟁력 강화로 상선 발주시장의 성장 둔화가 우려된다. 특히 LNGC 수주 확대에도 대형선 수주가 기대에 미치지 못하고, 미·이란 갈등 등 외부 요인이 해운시장에 부정적 영향을 끼치고 있다. 한미 해양방산 협력(MASGA)에 대한 기대감은 조선업종 시가총액 변동에 큰 역할을 했으나, FY26 연중 기대심리의 정상화와 축소로 업종 주가가 조정받았다. 상선과 방산사업은 가치평가 기준이 달라 각각 POR와 P/E Multiple로 구분하여 평가하는 것이 필요하며, 현재 밸류에이션에는 방산 기대가치 축소가 반영되어 있다. 상선사업은 중장기 성장에 제한이 있으나, AIDC 관련 신사업은 조선산업 내 새로운 성장 동력으로 관심받고 있다. 종합적으로 조선산업 밸류에이션은 전통적 상선사업 펀더멘털과 방산사업 및 신사업 성장 기대감의 상호작용 속에서 재평가가 이뤄지고 있다.", "key_points": ["FY27F Clarksons 신조선가 지수는 186pts ±3pts 예상, 현재 187.2pts로 보수적 시각 유지", "고수익 선종(LNGC, 컨테이너선) 발주 약화 및 중국 조선업체의 생산능력 확장으로 상선 발주시장 둔화", "LNGC 수주는 증가했으나 대형선 수주량 예측치 하회, 미·이란 갈등 등 해운시장 부정적 영향", "중국 조선업체의 양적·질적 성장으로 국내 조선업체 가격 결정력에 부정적 영향", "한미 해양방산 협력(MASGA)에 대한 기대감이 조선업종 시가총액에 큰 영향 미침", "MASGA 기대감 축소가 FY26 연중 업종 주가 조정 주요 원인", "상선부문은 POR(Price/Orderbook Ratio)을 통한 가치 산출, 방산부문은 P/E Multiple 적용", "방산사업 기대가치 축소로 밸류에이션 불확실성 확대, 상선과 방산사업 가치 분리 필요성 대두", "AIDC 관련 사업은 상선 경쟁격화에서 벗어나 신규 성장사업으로 평가받음", "상선 사업 성장 여력 제한적이나 방산 및 AIDC 신사업 성장 기대감은 여전히 존재"], "risks": ["중국 조선업체의 생산능력 확장과 수주 경쟁 심화", "상선 발주시장 및 선종별 수급 불균형 지속 가능성", "MASGA 사업 구체적 수주 및 사업화 시점과 수익성 불확실성", "상선 이익 피크아웃 우려와 이에 따른 밸류에이션 리스크"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654107.pdf", "json_path": "../reports_json/산업/654107.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654107"}, {"report_idx": "654106", "category": "산업", "published_at": "2026-11-12", "title": "[엔터 2027 전망: 바닥 다지고 반등하는 해]", "author": "이환욱", "source": "유안타증권", "company_name": null, "stock_code": null, "industry_name": "엔터테인먼트", "market_topic": "2027년 엔터 산업 전망 및 이익 사이클 반등", "investment_opinion": null, "target_price": null, "summary": "2026년 국내 엔터테인먼트 산업은 주요 4사(YG, SM, JYP, 하이브)의 급격한 주가 하락과 이익 성장 둔화로 어려운 시기를 겪었으나, 2027년에는 저연차 IP(지식재산권) 중심의 수익화 및 마진 개선을 기반으로 영업이익이 크게 반등할 것으로 전망된다. 특히 SM과 하이브는 저연차 IP 포트폴리오의 깊이와 신인 그룹의 빠른 수익화가 강점으로 평가받는다. 반면, JYP와 YG는 상대적으로 저연차 IP 공백 및 투자 변동성에 노출돼 있다. 전반적으로 2027년을 엔터 산업 이익 사 요가 있다.", "key_points": ["글로벌 주요 지역의 탄소배출권 가격은 전반적으로 3개월 기준 상승세를 보이나, 중국 현물 배출권 가격은 하락 중임.", "유럽연합(EUA)과 영국(UKA) 배출권 가격이 강세를 보이며 각각 8.2%, 14.0% 상승을 기록.", "미국 RGGI와 CCA 배출권 가격은 완만한 상승세를 이어감.", "국내 탄소배출권 가격(KAU, KOC, i-KOC)은 혼조세로, 특히 KOC와 i-KOC는 최근 높은 상승률(3개월 기준 166.4%, 142.6%) 기록.", "글로벌 에너지 가격은 유가 및 천연가스 가격 변동이 크며, 북미 및 유럽 전력가격은 최근 상승 추세 유지.", "탄소배출권 관련 ETF 및 ETN 가격은 소폭 변동하며 총자산 규모는 안정적임.", "미·이란 협상 기대 후퇴로 국제유가가 상승하는 등 국제 정세가 에너지 가격에 영향.", "EU의 철강·알루미늄 수출을 위해 ‘탄소배출 검증’을 국내에서 받을 수 있도록 하여 관련 산업 수급에 긍정적 요인.", "COP31에서 전력화 35% 목표를 놓고 이해관계 충돌이 발생, 글로벌 정책 방향성 불확실성 존재."], "risks": ["중국 현물 배출권 가격 하락이 글로벌 시장 불확실성을 내포.", "국제 유가 및 에너지 가격 변동성 확대 가능성.", "COP31 전력화 목표 관련 국제 정책 불확실성.", "미·이란 협상 및 국제 정세에 따른 에너지 수급 리스크."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654096.pdf", "json_path": "../reports_json/산업/654096.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654096"}, {"report_idx": "654095", "category": "산업", "published_at": "2026-11-12", "title": "은행/증권 국고채 PD 담합 과징금 관련 Comment", "author": "장영임", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "금융 (은행/증권)", "market_topic": "국고채 전문딜러(PD) 담합 과징금 부과", "investment_opinion": null, "target_price": null, "summary": "공정거래위원회가 은행 및 증권사의 국고채 전문딜러 담합 행위에 대해 총 1조 6,265억원 규모의 과징금을 부과하였다. 이 담합은 2020년부터 2023년까지 국고채 입찰 과정에서 이루어진 것으로, 총 담합 규모는 약 76조원에 달한다. 과징금 부과 대상은 15개 금융사로, 증권사 중 KB증권이 가장 큰 부담을 가지며, 중소형 증권사들의 부담이 상대적으로 크다. 이들 과징금은 주로 4분기 실적에 반영될 예정이며, 증권업 전반의 실적에 부정적인 영향을 미칠 것으로 보인다. 금융지주사는 영향이 제한적이 nts": ["올해 상반기 ABF 기판 업체들은 공급 부족에 따른 판가 인상과 고객사와의 LTA 체결로 주가 리레이팅을 경험함", "메모리향 기판 시장에서도 공급자 우위가 강화되었으며, 메모리 업체의 높은 수익성으로 기판 가격 민감도 감소", "패키지기판과 모듈 PCB 증설 부재로 메모리향 공급 여력 축소, 일부 제품군에서 공급 부족 심화", "4분기 중 메모리향 기판 업체들이 추가 판가 인상을 합의, 인상률은 과거 대비 공격적인 수준", "고객사와의 다년간 LTA 협의 및 완료 단계로, ASP 프리미엄 확보와 선수금 지원이 포함되어 증설 부담 완화 및 중장기 수요 가시성 확보", "메모리 기판 업체들은 단순 업황 회복 이상의 밸류에이션 리레이팅과 실적 추정치 상향 기대"], "risks": ["공급 부족에 따른 판가 인상으로 인한 고객사 가격 부담 가능성", "장기공급계약이 체결되지 못할 경우 수요 가시성 확보에 제약 발생 가능성", "대규모 증설 관련 투자 부담과 시장 환경 변화에 따른 전략적 위험"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654082.pdf", "json_path": "../reports_json/산업/654082.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654082"}, {"report_idx": "654080", "category": "산업", "published_at": "2026-11-12", "title": "supply matters", "author": "장재혁", "source": "메리츠증권", "company_name": null, "stock_code": null, "industry_name": "-", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "본 산업 리포트는 구리, 철강, 리튬 시장 및 관련 기업들의 수급 현황과 가격 동향을 분석하였다. 구리 시장은 공급 차질과 감산 영향으로 가격 반등 기대가 크고, 철강 시장은 과잉 속에서도 비용 개선으로 실적 회복이 예상된다. 리튬 시장은 가격 변동성과 공급 확대 우려가 혼재되어 있어 보수적 접근이 요구된다. 중국 수요 둔화와 글로벌 이슈들이 업황에 부담을 주나, 구리 관련 주요 기업들의 실적 변동성은 여전히 구리 가격에 민감하게 반응한다. 전반적으로 각 원자재 시장은 구조적 변화와 지정학적 변수, 정책 환경에 따라 불확실성이 존재한다.", "key_points": ["구리(Cu) 시장은 광산 공급 차질과 리얼 수급 부족 현상 지속, 제련소 감산 및 TC(Benchmark Treatment Charge) 하락으로 가격 상승 가능성 높음.", "철강(Fe) 시장은 구조적 과잉 공급 문제에도 불구하고 원료탄 가격 변동성 및 원화 강세로 비용 개선, 2027년 2분기 실적 회복 기대.", "리튬(Li) 시장은 공급 차질과 ESS(에너지 저장장치) 수요로 가격 급등 후 조정 중, 공급 확대 우려로 보수적인 접근 권고.", "전반적으로 2024년부터 2027년까지 구리 가격 상승 기대되나, 중국 수요 부진과 구조조정으로 인한 업황 불확실성 내포.", "구리 관련 주요 기업(LS, 풍산)은 구리 가격 변동에 따른 실적 영향 큼, 풍산은 방산 부문 확대로 주가 변동성 존재.", "시장 시각은 2024년 수요 부양책 → 2025년 감산과 구조조정 → 2026년 개별 모멘텀 중심으로 변화 중."], "risks": ["중국 전기동 생산 감소 및 가동률 조정으로 인한 수급 악화 가능성.", "리튬 공급 과잉과 남미 저비용 염호 재가동 등 공급 확대 리스크.", "원료탄 가격 상승과 글로벌 지정학적 리스크(중동 전쟁 등) 불확실성.", "시장 변동성에 따른 기업 주가의 과도한 급등락 리스크."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654080.pdf", "json_path": "../reports_json/산업/654080.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654080"}, {"report_idx": "654075", "category": "산업", "published_at": "2026-11-12", "title": "안녕하세요 데일리에요", "author": "양승윤", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "로봇/방산/조선", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "로봇/방산/조선 산업은 국책과제 선정, 대규모 펀드 투자, 해외 수주 및 전략적 협력 확대 등의 호재 속에 일부 계약 지연 및 무역 환경 불확실성 등의 리스크가 상존한다. 특히 방산 분야는 KF-21 수출 계약 지연 가능성이 있으나 협력 영역 확대로 성장 동력이 유지되고 있으며, 조선 분야는 미국과 중국 간의 무역 제재 유예와 신조선 수주 호조가 긍정적 요인으로 작용한다.", "key_points": ["로봇 산업에서는 삼현이 산업부 국책과제 주관기관으로 선정되어 휴머노이드 액추에이터 개발을 진행 중이며, 원익로보틱스는 국민성장펀드 3,500억원 투자 계약을 확정하고 핸드 양산시설 구축에 착수하였다.", "방산 업계는 한화에어로스페이스의 L-SAM UAE 수주 가능성이 가시화되고, 인도네시아 KF-21 계약은 2027년으로 지연 가능성이 커졌으나 협력범위는 확대 중이다.", "미국 해군은 해외에서의 군함 설계 및 건조 방안을 평가 중이며, 중국 대상 무역 제재 조치는 2027년 1월까지 2개월 추가 유예되었다.", "조선 업계는 한화쉬핑의 LNG선 용선 계약 체결, 미국·중국 간 조선 보복 동시 유예, 중국 양쯔장 조선소의 신조선 수주 목표 초과 달성 등이 주요 이슈로     function renderHistoryReportCard(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" 쨌 ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <h3 class="history-report-title">${safe(item.title)}</h3>
            <div class="report-brief">${meta}</div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStock(stockCode) {
      renderHistoryForStockCompact(stockCode);
    }

    function renderHistoryReportCardCompact(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" / ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <div class="history-title-row">
              <h3 class="history-report-title">${safe(item.title)}</h3>
              ${item.published_at ? `<span class="badge">${safe(item.published_at)}</span>` : ""}
            </div>
            <div class="report-brief">${meta}</div>
            <p class="summary">${safe(item.summary)}</p>
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문</a>
            </div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStockCompact(stockCode) {
      const entries = allCachedReports()
        .filter((item) => item.stock_code === stockCode)
        .sort((a, b) => {
          const dateDiff = (b.published_at || "").localeCompare(a.published_at || "");
          if (dateDiff !== 0) return dateDiff;
          return String(b.report_idx || "").localeCompare(String(a.report_idx || ""));
        });
      const root = document.getElementById("history-section");
      if (!entries.length) {
        renderHistoryEmpty("?대떦 醫낅ぉ????λ맂 ?대젰???놁뒿?덈떎.");
        return;
      }

      const companyName = entries.find((item) => item.company_name)?.company_name || stockCode;
      const uniqueDates = new Set(entries.map((item) => item.published_at).filter(Boolean));
      const bestEntry = entries.find((item) => item.alpha_score !== null && item.alpha_score !== undefined);
      const cards = entries.map((item) => renderHistoryReportCardCompact(item)).join("");

      root.innerHTML = `
        <article class="group-card history-group-card">
          <div class="group-head">
            <div>
              <div class="group-title-row">
                <h2 class="group-title">${safe(companyName)}</h2>
              </div>
            </div>
          </div>
          <div class="group-meta">
            <span class="pill"><button type="button" data-copy-stock="${safe(stockCode)}">종목코드 복사</button></span>
            <span class="pill"><a href="${stockWebUrl(stockCode)}" target="_blank" rel="noreferrer">네이버금융</a></span>
          </div>
          <div class="report-stack">${cards}</div>
        </article>
      `;
    }

    async function runStockSearch() {
      const input = document.getElementById("stock-search");
      const query = String(input.value || "").trim();
      if (!query) {
        renderSearchResults("");
        renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
        return;
      }

      renderSearchResults('<span class="badge">아카이브 확인 중...</span>');
      const loaded = await ensureHistoryLoaded();
      if (!loaded) {
        renderSearchResults("");
        renderHistoryEmpty("아카이브를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      const matches = matchingStocks(query).slice(0, 12);
      if (!matches.length) {
        renderSearchResults("");
        renderHistoryEmpty(`"${query}"와 일치하는 종목 이력이 없습니다.`);
        return;
      }

      renderSearchResults(
        matches
          .map(
            (item) => `
              <button type="button" data-stock-history="${safe(item.stock_code)}">
                ${safe(item.company_name)} (${safe(item.stock_code)}) · ${item.report_count}건
              </button>
            `
          )
          .join("")
      );
      renderHistoryForStockCompact(matches[0].stock_code);
    }

    function renderFactorSections(item) {
      if (item.category !== "기업") return "";
      const sections = [];
      if (item.revision_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Revision Signal</div><p class="factor-text">${safe(item.revision_signal)}</p></div>`);
      }
      if (item.structural_growth_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Structural Growth</div><p class="factor-text">${safe(item.structural_growth_signal)}</p></div>`);
      }
      if (item.valuation_risk_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Valuation / Risk</div><p class="factor-text">${safe(item.valuation_risk_signal)}</p></div>`);
      }
      const positiveText = (item.positive_factors || []).map((value) => `+ ${safe(value)}`).join("<br>");
      const negativeText = (item.negative_factors || []).map((value) => `- ${safe(value)}`).join("<br>");
      if (positiveText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Positive Factors</div><p class="factor-text">${positiveText}</p></div>`);
      }
      if (negativeText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Negative Factors</div><p class="factor-text">${negativeText}</p></div>`);
      }
      if (item.market_reaction_placeholder) {
        sections.push(`<div class="factor-box"><div class="factor-title">Market Reaction</div><p class="factor-text">D+1 / D+5 / D+20 추후 연결 예정</p></div>`);
      }
      return sections.length ? `<div class="factor-grid">${sections.join("")}</div>` : "";
    }

    function renderGrouped(items) {
      const root = document.getElementById("list");
      const { groupedCompanies, industry, market } = groupedData(items);

      const groupCards = groupedCompanies.map((group) => {
        const reportsHtml = group.reports.map((report) => {
          const pointItems = (report.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
          return `
            <details class="report-detail">
              <summary>
                <div>
                  <div>${safe(report.title)}</div>
                  <div class="report-brief">${[
                    safe(report.source),
                    safe(report.author),
                    [safe(report.investment_opinion), safe(report.target_price)].filter(Boolean).join(" "),
                    upsideLabel(report),
                  ].filter(Boolean).join(" · ")}</div>
                </div>
                <div>
                  ${report.alpha_score !== null && report.alpha_score !== undefined ? `<div class="badge">${safe(report.alpha_grade || "-")} ${safe(report.alpha_score)}</div>` : ""}
                  <div class="badge">#${safe(report.report_idx)}</div>
                </div>
              </summary>
              <div class="report-body">
                <p class="summary">${safe(report.summary)}</p>
                ${pointItems ? `<ul class="points">${pointItems}</ul>` : ""}
                ${renderFactorSections(report)}
                <div class="links">
                  <a href="${safe(report.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
                </div>
              </div>
            </details>
          `;
        }).join("");

        return `
          <article class="group-card">
            <div class="group-head">
              <div>
                <div class="group-title-row">
                  <h2 class="group-title">${safe(group.company_name)}</h2>
                  ${renderPriceBox(group)}
                </div>
              </div>
            </div>
            <div class="group-meta">
              ${group.stock_code ? `<span class="pill"><button type="button" data-copy-stock="${safe(group.stock_code)}">종목코드 복사</button></span>` : ""}
              ${group.stock_code ? `<span class="pill"><a href="${stockWebUrl(group.stock_code)}" target="_blank" rel="noreferrer">네이버금융</a></span>` : ""}
            </div>
            <div class="report-stack">${reportsHtml}</div>
          </article>
        `;
      }).join("");

      const renderStandaloneSection = (title, entries) => entries.length
        ? `
          <div class="section-title">${title}</div>
          ${entries.map((item) => `
            <article class="card">
              <div class="row">
                <span class="badge">${safe(item.category)}</span>
                <span class="badge">${safe(item.published_at)}</span>
                <span class="badge">#${safe(item.report_idx)}</span>
              </div>
              <h2 class="title">${safe(item.title)}</h2>
              <div class="meta">작성자 ${safe(item.author)} · 출처 ${safe(item.source)}${item.market_topic ? ` · 주제 ${safe(item.market_topic)}` : ""}${item.industry_name ? ` · 산업 ${safe(item.industry_name)}` : ""}</div>
              <p class="summary">${safe(item.summary)}</p>
              ${renderFactorSections(item)}
              <div class="links">
                <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
              </div>
            </article>
          `).join("")}
        `
        : "";

      root.innerHTML = groupCards
        + renderStandaloneSection("산업 리포트", industry)
        + renderStandaloneSection("시장 리포트", market);
    }

    function renderList(items) {
      const root = document.getElementById("list");
      root.innerHTML = items.map((item) => {
        const meta = [
          item.author ? `작성자 ${item.author}` : "",
          item.source ? `출처 ${item.source}` : "",
          item.company_name ? `회사 ${item.company_name}` : "",
          item.stock_code ? `코드 ${item.stock_code}` : "",
          item.industry_name ? `산업 ${item.industry_name}` : "",
          item.market_topic ? `주제 ${item.market_topic}` : "",
          item.investment_opinion ? `의견 ${item.investment_opinion}` : "",
          item.target_price ? `목표가 ${item.target_price}` : "",
          upsideLabel(item),
          item.alpha_score !== null && item.alpha_score !== undefined ? `Alpha ${item.alpha_grade || "-"} ${item.alpha_score}` : "",
          item.live_price ? `현재가 ${item.live_price}원` : "",
        ].filter(Boolean).join(" · ");
        const points = (item.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
        return `
          <article class="card">
            <div class="row">
              <span class="badge">${safe(item.category)}</span>
              <span class="badge">${safe(item.published_at)}</span>
              <span class="badge">#${safe(item.report_idx)}</span>
            </div>
            <h2 class="title">${safe(item.title)}</h2>
            <div class="meta">${meta}</div>
            ${renderAlphaBox(item)}
            <p class="summary">${safe(item.summary)}</p>
            ${points ? `<ul class="points">${points}</ul>` : ""}
            ${renderFactorSections(item)}
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function render() {
      renderModes();
      renderDateOptions();
      renderFilters();
      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
</html>
