rt_idx=654359"}, {"report_idx": "654355", "category": "시장", "published_at": "2026-11-18", "title": "10월 미국 소매판매: 선별적인 소비와 신중한 회복", "author": "최규호", "source": "한화투자증권", "company_name": null, "stock_code": null, "industry_name": null, "market_topic": "10월 미국 소매판매 동향 및 소비 행태", "investment_opinion": null, "target_price": null, "summary": "10월 미국 소매판매는 전월대비 소폭 증가하며 예상치를 충족했다. 주유소와 무점포 판매 등의 선별적인 소비가 개선을 견인했고 헬스케어 분야도 꾸준한 성장세를 보였다. 그러나 가구와 자동차 판매는 감소해 내구재 부문의 약세가 지속되었다. 소비 심리는 소폭 반등했으나 고용과 소득 전망에 대한 불확실성이 존재한다. 소비자들은 가격에 민감한 선별적 지출 패턴을 유지하며 할인 및 프로모션 시기에 구매를 집중하는 모습이다. 연말 쇼핑 시즌 매출은 전년 대비 증가할 것으로 기대되나, 전반적인 소비 회복은 신중하고 무난한 흐름이 전망된다.", "key_points": ["10월 미국 소매판매 전월대비 0.2% 증가, 전년동월대비 6.8% 증가하며 예상치 부합", "주유소(+1.5%) 및 무점포(+1.2%) 판매가 증가세 견인, 헬스케어 판매 9개월 연속 증가", "가구(-2.3%) 및 자동차(-1.6%) 판매는 감소, 자동차 제외 소매판매는 전월대비 0.6% 증가", "통제 그룹(Control-group) 소매판매 전월대비 0.6% 증가하며 소비 모멘텀 유지 전망", "연말 쇼핑 시즌 매출 전년 대비 약 4.2% 증가 예상, 핼러윈 시즌 및 겨울 휴가 프로모션이 수요 견인", "소비자들은 가계 예산을 신중하게 관리하며 할인 행사 및 특수 기간에 구매 집중, 선별적 소비 지속 전망", "소비심리는 소폭 반등했으나 고용과 소득에 대한 우려는 지속적 존재", "실질 소매판매는 전월대비 0.1% 감소 전환, 물가 상승 압력과 고용 완만한 둔화 상황 유지"], "risks": ["소비자 물가와 유가 부담이 남아있어 소비 확장에 제약 가능성", "소비자 신뢰지수 고용 및 소득 전망에 대한 지속적 우려", "자동차 및 가구 등 일부 내구재 수요 위축 가능성"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/시장/654355.pdf", "json_path": "../reports_json/시장/654355.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654355"}, {"report_idx": "654354", "category": "시장", "published_at": "2026-11-18", "title": "K-뷰티, 볼트온 ,M&A 적기", "author": "김은지", "source": "메리츠증권", "company_name": null, "stock_code": null, "industry_name": null, "market_topic": "K-뷰티 M&A 시장의 선별적 볼트온 M&A 확대와 밸류체인 전반에 걸친 인수 움직임", "investment_opinion": null, "target_price": null, "summary": "K-뷰티 M&A 시장은 2025년 역대 최고치의 거래규모를 기록하였으며, 올해는 대형 딜보다 중소형 딜 중심의 선별적 볼트온 M&A가 활발하다. 이는 핵심 사업 시너지와 비효율 제거, 밸류체인 전반으로의 확대를 목표로 하며, 글로벌 뷰티 M&A 트렌드와도 부합한다. 이러한 시장 변화는 글로벌 유통채널과 구매 요인의 변화에 따른 브랜드 성장 차별화 및 비상장 화장품 기업 매출 증가에 기반한다. 반면 대형 브랜드 인수는 밸류에이션 부담과 리스크가 상존한다.", "key_points": ["2025년 K-뷰티 M&A 거래규모는 역대 최고치인 3.6조원 기록", "2023년은 중소형 딜 중심의 M&A 활발, 대형 딜은 상대적으로 감소", "선별적 볼트온 M&A가 핵심 사업과 시너지 창출 및 비효율 제거 목적으로 확대 중", "M&A 대상이 브랜드 기업에서 ODM, 용기 제조사 등 밸류체인 전반으로 확장", "대형 브랜드 인수는 밸류에이션과 브랜드 라이프사이클 리스크 존재", "글로벌 뷰티 M&A 역시 사업역량 확보, 밸류체인 확장 목적의 선별적 M&A 증가", "기존 포트폴리오 확대 목적 딜은 감소 추세, 사업역량 확보 목적 딜 증가", "아시아 내 일본과 중국 제외 지역에서 M&A 딜 비중은 낮으나 K-뷰티 입지 강화 중", "글로벌 유통채널 변화와 구매 결정요인 변화에 따라 개별 브랜드 성장 차별화 발생", "화장품 관련 비상장 기업 매출 증가로 인수대상 기업 풀 확대, 볼트온 M&A 수요 증가"], "risks": ["대형 브랜드 인수 시 밸류에이션 부담과 브랜드 라이프사이클 리스크 존재"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/시장/654354.pdf", "json_path": "../reports_json/시장/654354.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654354"}, {"report_idx": "654351", "category": "시장", "published_at": "2026-11-18", "title": "YUANTA DAILY MARKET VIEW", "author": "리서치센터", "source": "유안타증권", "company_name": null, "stock_code": null, "industry_name": null, "market_topic": "국내외 증시 및 투자자별 시장 수급 동향 분석", "investment_opinion": null, "target_price": null, "summary": "최근 국내외 증시는 전반적인 약세를 보이고 있는 가운데, 투자자들의 매매 동향에서 외국인과 기관 투자자의 혼재된 움직임이 나타나며, 금융시장 변동성과 투자심리 불안이 지속되고 있다. 원자재 가격과 글로벌 주요 기업들의 밸류에이션 하락이 복합적으로 작용해 현 시장의 불확실성이 높아진 상황이다. 이에 따른 리스크 관리와 투자 전략 조정이 요구된다.", "key_points": ["국내 KOSPI 및 KOSDAQ 지수는 3개월 기준 각각 -28.8%, -24.8% 하락하며, 단기 및 중기 약세 지속", "글로벌 주요 증시들도 최근 1주 및 1개월 기준 대체로 하락세를 보임, 특히 나스닥 등 기술주 중심 지수의 약세 두드러짐", "VIX 지수는 변동성 증가를 반영하며 지난 3개월간 크게 상승, 투자심리 불안 지속", "원/달러 환율과 달러 인덱스 변동성 확대, 국채 금리 스프레드 변화 등 금융시장 변동성 존재", "투자자별 매매 동향에서는 외국인과 기관 투자자가 국내 증시에서 혼재된 매매를 보임, 특히 외국인 순매도세 지속", "주요 원자재 가격은 최근 1개월간 대부분 하락세를 기록, 금, 은, 구리 등에서 약세 기조 확인", "국내외 주요 IT, 헬스케어, 에너지 기업들의 주가 및 밸류에이션도 하락세를 보이며 글로벌 경기 둔화 우려 반영"], "risks": ["글로벌 경기 둔화 및 지정학적 리스크로 인한 투자 심리 위축 가능성", "미국 및 국내 금리 변동성 확대에 따른 금융시장 불안정성 증가 위험", "원자재 가격 하락과 환율 변동이 수익성 및 밸류에이션에 부정적 영향", "외국인 투자자 순매도 지속으로 인한 코스피 및 코스닥 시장 변동성 확대 전망"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/시장/654351.pdf", "json_path": "../reports_json/시장/654351.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654351"}, {"report_idx": "654350", "category": "시장", "published_at": "2026-11-18", "title": "morning meeting brief", "author": "리서치센터", "source": "대신증권", "company_name": null, "stock_code": null, "industry_name": null, "market_topic": "KOSPI 지수 5,000p선 붕괴, AI 반도체 관련 악재와 외국인 매도세로 인한 투자심리 위축, 보험업 약세 지속, PCB 소캠2 모듈 성장 기대, 방위산업과 AI 인프라 관련 정책 변화", "investment_opinion": null, "target_price": null, "summary": "2026년 11월 대다수 증권 전략 보고서는 KOSPI 지수가 5,000p선 이하로 내려서며 밸류에이션 언더슈팅 상태임을 공유하였다. AI 반도체 관련 악재와 미국의 수출  SpaceX(0.118%)보다 작으나, 금융여건 완화 폭이 줄고 국내 금융불안지수가 과거 메가 IPO 직전보다 높아 수급 변동성 확대 가능성 존재.", "과거 메가 IPO 사례를 보면 상장 전 10거래일간 코스피 평균 -3.0% 하락, 상장 후 20거래일간 평균 +2.8% 반등하는 패턴 반복.", "앤트로픽의 1년 약정 규모가 TTM 매출의 2배에 이르고, 현금·단기투자 자산이 늘어 단기 지급 부담 완화 기대.", "외국인 코스피 순매도는 근원적 위험 지표인 CDS 고점 대비는 하락했으나 아직 높은 수준으로, 수급 정상화는 CDS가 1000bp 하향 안착 시 가능할 전망.", "국내 증시는 10월 말 급락이 지진이라면 현재는 여진 국면으로, 반도체 업종 중심으로 KOSPI 5,000pt 전후 매수 대응 전략 유지 중."], "risks": ["앙트로픽 IPO 시 주가 변동성이 확대되어 가격 착시 발생 가능성.", "금융여건 완화 폭이 축소되고 국내 금융불안지수가 높은 수준 유지.", "외국인 수급이 CDS 수준 영향 받으며 아직 완전 정상화되지 않음."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654358.pdf", "json_path": "../reports_json/산업/654358.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654358"}, {"report_idx": "654352", "category": "산업", "published_at": "2026-11-18", "title": "Next Boom", "author": "배기연,김현비", "source": "메리츠증권", "company_name": null, "stock_code": null, "industry_name": "방위산업 (Aerospace & Defense)", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "방위산업 섹터는 2021년부터 수주 랠리가 진행되었으나 2026년 중반 이후 수주잔고 감소로 소강상태에 진입했다. 국방비는 증가 추세이나, 수주잔고 회복과 반등을 위해서는 더 큰 수주가 필요한 상황이다. 2027년 이후 수주잔고가 점진적으로 회복될 전망이다. 세계 지정학적 갈등 및 군사적 긴장은 유지 또는 심화되고 있으며, 방산 산업은 드론과 AI 등 신기술 도입과 함께 변화 중이다. K-방산의 해군함정 수출은 남중국해 및 아시아 주변국을 중심으로 초기 단계이며, 중국의 해양전략 강화로 해당 지역 수요가 증가하고 있다. 투자 관점에서는 종목별 수주 모멘텀 차별화에 따른 ‘옥석 가리기’ 단계에 접어들었다.", "key_points": ["2021년부터 시작된 방산주 수주 랠리는 2026년 2분기 이후 소강상태에 접어들었으며, 수주잔고가 2026년 3분기에 7.1% 감소함.", "방위산업은 비닉사업의 특성상 수주 파이프라인 공개가 제한적이고, 수주잔고 회복 필요성이 크게 대두됨.", "국방비 실질 증가율은 확대 추세 지속 중이며, 세계 각지(특히 NATO vs 러시아, 중동, 아시아)에서 분쟁 리스크가 증대되고 있음.", "2027년부터 수주잔고 회복이 예상되며 2028년에는 2026년 말 대비 약 7.4% 증가 전망.", "2027~28년 방산 섹터는 개별 종목별 수주 모멘텀 차별화로 ‘옥석 가리기’가 중요함.", "유럽 SAFE 차관 제도 추가 배분 가능성은 제한적이며, 드론·AI 기반 저비용 대량 살상 개념이 전장 교리로 자리 잡아감.", "원재료인 방탄강 가격 상승 우려가 있으나 확실한 수주 확보가 필요함.", "함정 무기체계는 수출 초기 국면으로, 필리핀, 인도네시아 등 아시아 국가들과 미 해군, 아라비아 반도 주변 국가로 수출 확대 기대.", "중국의 해양안보전략에 따른 남중국해 인근 국가들의 K-군함 수요가 확인되었으며, 해당 지역 해군력 증강 수요가 커짐."], "risks": ["수주잔고 감소에 따른 섹터 내 투자심리 위축 위험.", "원재료 가격 상승(방탄강 등)에 따른 수익성 압박 가능성.", "글로벌 지정학적 리스크 변동성(특히 러시아-우크라이나, 중동, 아시아 지역).", "유럽 SAFE 차관 제도 추가 배분 제한으로 인한 일부 사업 모멘텀 약화 가능성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654352.pdf", "json_path": "../reports_json/산업/654352.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654352"}, {"report_idx": "654349", "category": "산업", "published_at": "2026-11-18", "title": "달라진, 달라질 환경", "author": "최정환", "source": "대신증권", "company_name": null, "stock_code": null, "industry_name": "방위산업", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "국내 방위산업은 2026-27년을 기점으로 자유현금흐름 회복과 현지화 전략에 따른 밸류에이션 차별화가 예상된다. 유럽 재정 악화로 제한된 방위비 예산 환경에서 가격 경쟁력과 현지 생산 역량을 갖춘 국내 업체들이 수혜를 볼 전망이다. 미래 전장 환경 변화로 군집위성 기반 우주 감시·추적 시스템이 새로운 성장축으로 떠오르고 있으며, 이에 따른 위성 제조 및 발사체 산업도 중장기 성장이 기대된다. 다만 수입국의 현지 생산 요구 강화와 이에 따른 선행 투자로 단기적으로 현금 흐름 부담이 존재하고, 유럽의 방위산업 블록화 정책(EU SAFE) 등으로 인해 시장 진입에 장애 요인도 있다. 전체적으로 글로벌 방위산업 성장은 지속되나 국내 업체들은 현지화 성과를 통한 실질적 경쟁력 증명이 필요하다.             const sourceB = b.source || "";

          }),
        }))
        .sort((a, b) => {
          const scoreDiff = (b.best_alpha_score || -1) - (a.best_alpha_score || -1);
          if (scoreDiff !== 0) return scoreDiff;
          const countDiff = b.reports.length - a.reports.length;
          if (countDiff !== 0) return countDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });

      return { groupedCompanies, industry, market };
    }

    function renderModes() {
      const root = document.getElementById("modes");
      root.innerHTML = "";
      for (const mode of modes) {
        const button = document.createElement("button");
        button.textContent = mode.label;
        if (mode.key === currentMode) button.classList.add("active");
        button.onclick = () => {
          currentMode = mode.key;
          render();
        };
        root.appendChild(button);
      }
    }

    function renderDateOptions() {
      const root = document.getElementById("date-select");
      root.innerHTML = availableDates
        .map((date) => `<option value="${safe(date)}"${date === currentDate ? " selected" : ""}>${safe(date)}</option>`)
        .join("");
      root.onchange = async (event) => {
        await switchDate(event.target.value);
      };
    }

    function renderFilters() {
      const root = document.getElementById("filters");
      root.innerHTML = "";
      for (const category of categories) {
        const button = document.createElement("button");
        button.textContent = category;
        if (category === current) button.classList.add("active");
        button.onclick = () => {
          current = category;
          render();
        };
        root.appendChild(button);
      }
    }

    function renderStats(items) {
      const root = document.getElementById("stats");
      root.innerHTML = "";
      document.getElementById("subline").textContent = "";
      document.getElementById("subline").style.display = "none";
    }

    function formatQuoteAsOf(value) {
      const text = safe(value);
      const matched = text.match(/(\d{4}\.\d{2}\.\d{2})/);
      if (matched) return `${matched[1].slice(2)} 장마감 기준`;
      return text
        .replace(/^현재가\s*/, "")
        .replace(/\s*기준(?:\(KRX 장마감\)|\(장마감\)|\(KRX장마감\)|\(KRX 마감\))?/g, "")
        .trim();
    }

    function priceDirectionClass(group) {
      const explicit = safe(group.live_price_direction).toLowerCase();
      if (explicit === "up" || explicit === "rise") return "up";
      if (explicit === "down" || explicit === "fall") return "down";

      const changeAmount = parsePriceValue(group.live_price_change);
      const changeRate = parsePriceValue(group.live_price_rate);
      if (Number.isFinite(changeAmount) && changeAmount < 0) return "down";
      if (Number.isFinite(changeRate) && changeRate < 0) return "down";
      if (Number.isFinite(changeAmount) && changeAmount > 0) return "up";
      if (Number.isFinite(changeRate) && changeRate > 0) return "up";

      const text = `${safe(group.live_price_change)} ${safe(group.live_price_rate)}`;
      if (text.includes("-")) return "down";
      return "";
    }

    function renderSparkline(history) {
      const values = (history || [])
        .map((item) => parsePriceValue(item.close))
        .filter((value) => Number.isFinite(value));
      if (values.length < 2) return "";

      const width = 220;
      const height = 40;
      const padding = 2;
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const range = Math.max(maxValue - minValue, 1);
      const points = values.map((value, index) => {
        const x = padding + ((width - padding * 2) * index) / (values.length - 1);
        const y = height - padding - ((value - minValue) / range) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const lastPoint = points[points.length - 1].split(",");
      const trendUp = values[values.length - 1] >= values[0];
      const stroke = trendUp ? "#0d7a5f" : "#ca6702";
      return `
        <div class="price-chart" aria-label="최근 3개월 주가 추이">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-hidden="true">
            <polyline fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${points.join(" ")}"></polyline>
            <circle cx="${lastPoint[0]}" cy="${lastPoint[1]}" r="2.8" fill="${stroke}"></circle>
          </svg>
        </div>
        <div class="price-caption">[3개월 주가 추이]</div>
      `;
    }

    function renderPriceBox(group) {
      if (!group.live_price) {
        return `
          <div class="price-box">
            <div class="price-label">현재가</div>
            <div class="price-main">조회 실패</div>
          </div>
        `;
      }

      const change = [safe(group.live_price_change), safe(group.live_price_rate)].filter(Boolean).join(" / ");
      const directionClass = priceDirectionClass(group);
      const high52w = safe(group.live_price_high_52w);
      return `
        <div class="price-box">
          <div class="price-label">${formatQuoteAsOf(group.live_price_as_of)}</div>
          <div class="price-main">${safe(group.live_price)}원</div>
          <div class="price-change ${directionClass}">${change}</div>
          ${high52w ? `<div class="price-extra">52주 최고가 ${high52w}원</div>` : ""}
          ${renderSparkline(group.price_history)}
        </div>
      `;
    }

    function renderAlphaBox(item) {
      if (item.alpha_score === null || item.alpha_score === undefined) return "";
      return `
        <div class="score-box">
          <div class="score-grade">Alpha ${safe(item.alpha_grade || "-")}</div>
          <div class="score-main">${safe(item.alpha_score)}</div>
          <div class="score-sub">${safe(item.score_reason || "")}</div>
        </div>
      `;
    }

    function stockWebUrl(stockCode) {
      if (!stockCode) return "";
      return `https://finance.naver.com/item/main.naver?code=${encodeURIComponent(stockCode)}`;
    }

    async function copyStockCode(stockCode) {
      if (!stockCode) return;
      try {
        await navigator.clipboard.writeText(String(stockCode));
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = String(stockCode);
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      alert(`종목코드 복사: ${stockCode}`);
    }

    async function fetchReportsForDate(date) {
      if (!date) return [];
      if (reportCache.has(date)) return reportCache.get(date) || [];
      try {
        const response = await fetch(`./archive/${date}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const nextReports = payload.reports || [];
        reportCache.set(date, nextReports);
        return nextReports;
      } catch (error) {
        return null;
      }
    }

    async function ensureHistoryLoaded() {
      if (historyLoaded) return true;
      for (const date of availableDates) {
        const loaded = await fetchReportsForDate(date);
        if (loaded === null) return false;
      }
      historyLoaded = true;
      return true;
    }

    function allCachedReports() {
      return Array.from(reportCache.values()).flat();
    }

    function stockCatalog() {
      const grouped = new Map();
      for (const item of allCachedReports()) {
        if (item.category !== "기업" || !item.stock_code) continue;
        const key = item.stock_code;
        if (!grouped.has(key)) {
          grouped.set(key, {
            stock_code: item.stock_code,
            company_name: item.company_name || item.title || item.stock_code,
            report_count: 0,
            dates: new Set(),
            latest_date: item.published_at || "",
          });
        }
        const stock = grouped.get(key);
        stock.report_count += 1;
        if (item.company_name) stock.company_name = item.company_name;
        if (item.published_at) stock.dates.add(item.published_at);
        if ((item.published_at || "") > stock.latest_date) stock.latest_date = item.published_at || "";
      }
      return Array.from(grouped.values());
    }

    function renderSearchResults(htmlText) {
      document.getElementById("search-results").innerHTML = htmlText;
    }

    function renderHistoryEmpty(message) {
      const root = document.getElementById("history-section");
      root.innerHTML = `<div class="history-empty">${safe(message)}</div>`;
    }

    function matchingStocks(query) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return [];
      return stockCatalog()
        .map((item) => {
          const name = String(item.company_name || "").toLowerCase();
          const code = String(item.stock_code || "").toLowerCase();
          let score = -1;
          if (code === keyword) score = 100;
          else if (name === keyword) score = 95;
          else if (code.startsWith(keyword)) score = 80;
          else if (name.startsWith(keyword)) score = 70;
          else if (code.includes(keyword)) score = 60;
          else if (name.includes(keyword)) score = 50;
          return { ...item, score };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => {
          const scoreDiff = b.score - a.score;
          if (scoreDiff !== 0) return scoreDiff;
          const dateDiff = (b.latest_date || "").localeCompare(a.latest_date || "");
          if (dateDiff !== 0) return dateDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });
    }

    function renderHistoryReportCard(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" 쨌 ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <h3 class="history-report-title">${safe(item.title)}</h3>
            <div class="report-brief">${meta}</div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStock(stockCode) {
      renderHistoryForStockCompact(stockCode);
    }

    function renderHistoryReportCardCompact(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" / ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <div class="history-title-row">
              <h3 class="history-report-title">${safe(item.title)}</h3>
              ${item.published_at ? `<span class="badge">${safe(item.published_at)}</span>` : ""}
            </div>
            <div class="report-brief">${meta}</div>
            <p class="summary">${safe(item.summary)}</p>
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문</a>
            </div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStockCompact(stockCode) {
      const entries = allCachedReports()
        .filter((item) => item.stock_code === stockCode)
        .sort((a, b) => {
          const dateDiff = (b.published_at || "").localeCompare(a.published_at || "");
          if (dateDiff !== 0) return dateDiff;
          return String(b.report_idx || "").localeCompare(String(a.report_idx || ""));
        });
      const root = document.getElementById("history-section");
      if (!entries.length) {
        renderHistoryEmpty("?대떦 醫낅ぉ????λ맂 ?대젰???놁뒿?덈떎.");
        return;
      }

      const companyName = entries.find((item) => item.company_name)?.company_name || stockCode;
      const uniqueDates = new Set(entries.map((item) => item.published_at).filter(Boolean));
      const bestEntry = entries.find((item) => item.alpha_score !== null && item.alpha_score !== undefined);
      const cards = entries.map((item) => renderHistoryReportCardCompact(item)).join("");

      root.innerHTML = `
        <article class="group-card history-group-card">
          <div class="group-head">
            <div>
              <div class="group-title-row">
                <h2 class="group-title">${safe(companyName)}</h2>
              </div>
            </div>
          </div>
          <div class="group-meta">
            <span class="pill"><button type="button" data-copy-stock="${safe(stockCode)}">종목코드 복사</button></span>
            <span class="pill"><a href="${stockWebUrl(stockCode)}" target="_blank" rel="noreferrer">네이버금융</a></span>
          </div>
          <div class="report-stack">${cards}</div>
        </article>
      `;
    }

    async function runStockSearch() {
      const input = document.getElementById("stock-search");
      const query = String(input.value || "").trim();
      if (!query) {
        renderSearchResults("");
        renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
        return;
      }

      renderSearchResults('<span class="badge">아카이브 확인 중...</span>');
      const loaded = await ensureHistoryLoaded();
      if (!loaded) {
        renderSearchResults("");
        renderHistoryEmpty("아카이브를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      const matches = matchingStocks(query).slice(0, 12);
      if (!matches.length) {
        renderSearchResults("");
        renderHistoryEmpty(`"${query}"와 일치하는 종목 이력이 없습니다.`);
        return;
      }

      renderSearchResults(
        matches
          .map(
            (item) => `
              <button type="button" data-stock-history="${safe(item.stock_code)}">
                ${safe(item.company_name)} (${safe(item.stock_code)}) · ${item.report_count}건
              </button>
            `
          )
          .join("")
      );
      renderHistoryForStockCompact(matches[0].stock_code);
    }

    function renderFactorSections(item) {
      if (item.category !== "기업") return "";
      const sections = [];
      if (item.revision_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Revision Signal</div><p class="factor-text">${safe(item.revision_signal)}</p></div>`);
      }
      if (item.structural_growth_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Structural Growth</div><p class="factor-text">${safe(item.structural_growth_signal)}</p></div>`);
      }
      if (item.valuation_risk_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Valuation / Risk</div><p class="factor-text">${safe(item.valuation_risk_signal)}</p></div>`);
      }
      const positiveText = (item.positive_factors || []).map((value) => `+ ${safe(value)}`).join("<br>");
      const negativeText = (item.negative_factors || []).map((value) => `- ${safe(value)}`).join("<br>");
      if (positiveText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Positive Factors</div><p class="factor-text">${positiveText}</p></div>`);
      }
      if (negativeText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Negative Factors</div><p class="factor-text">${negativeText}</p></div>`);
      }
      if (item.market_reaction_placeholder) {
        sections.push(`<div class="factor-box"><div class="factor-title">Market Reaction</div><p class="factor-text">D+1 / D+5 / D+20 추후 연결 예정</p></div>`);
      }
      return sections.length ? `<div class="factor-grid">${sections.join("")}</div>` : "";
    }

    function renderGrouped(items) {
      const root = document.getElementById("list");
      const { groupedCompanies, industry, market } = groupedData(items);

      const groupCards = groupedCompanies.map((group) => {
        const reportsHtml = group.reports.map((report) => {
          const pointItems = (report.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
          return `
            <details class="report-detail">
              <summary>
                <div>
                  <div>${safe(report.title)}</div>
                  <div class="report-brief">${[
                    safe(report.source),
                    safe(report.author),
                    [safe(report.investment_opinion), safe(report.target_price)].filter(Boolean).join(" "),
                    upsideLabel(report),
                  ].filter(Boolean).join(" · ")}</div>
                </div>
                <div>
                  ${report.alpha_score !== null && report.alpha_score !== undefined ? `<div class="badge">${safe(report.alpha_grade || "-")} ${safe(report.alpha_score)}</div>` : ""}
                  <div class="badge">#${safe(report.report_idx)}</div>
                </div>
              </summary>
              <div class="report-body">
                <p class="summary">${safe(report.summary)}</p>
                ${pointItems ? `<ul class="points">${pointItems}</ul>` : ""}
                ${renderFactorSections(report)}
                <div class="links">
                  <a href="${safe(report.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
                </div>
              </div>
            </details>
          `;
        }).join("");

        return `
          <article class="group-card">
            <div class="group-head">
              <div>
                <div class="group-title-row">
                  <h2 class="group-title">${safe(group.company_name)}</h2>
                  ${renderPriceBox(group)}
                </div>
              </div>
            </div>
            <div class="group-meta">
              ${group.stock_code ? `<span class="pill"><button type="button" data-copy-stock="${safe(group.stock_code)}">종목코드 복사</button></span>` : ""}
              ${group.stock_code ? `<span class="pill"><a href="${stockWebUrl(group.stock_code)}" target="_blank" rel="noreferrer">네이버금융</a></span>` : ""}
            </div>
            <div class="report-stack">${reportsHtml}</div>
          </article>
        `;
      }).join("");

      const renderStandaloneSection = (title, entries) => entries.length
        ? `
          <div class="section-title">${title}</div>
          ${entries.map((item) => `
            <article class="card">
              <div class="row">
                <span class="badge">${safe(item.category)}</span>
                <span class="badge">${safe(item.published_at)}</span>
                <span class="badge">#${safe(item.report_idx)}</span>
              </div>
              <h2 class="title">${safe(item.title)}</h2>
              <div class="meta">작성자 ${safe(item.author)} · 출처 ${safe(item.source)}${item.market_topic ? ` · 주제 ${safe(item.market_topic)}` : ""}${item.industry_name ? ` · 산업 ${safe(item.industry_name)}` : ""}</div>
              <p class="summary">${safe(item.summary)}</p>
              ${renderFactorSections(item)}
              <div class="links">
                <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
              </div>
            </article>
          `).join("")}
        `
        : "";

      root.innerHTML = groupCards
        + renderStandaloneSection("산업 리포트", industry)
        + renderStandaloneSection("시장 리포트", market);
    }

    function renderList(items) {
      const root = document.getElementById("list");
      root.innerHTML = items.map((item) => {
        const meta = [
          item.author ? `작성자 ${item.author}` : "",
          item.source ? `출처 ${item.source}` : "",
          item.company_name ? `회사 ${item.company_name}` : "",
          item.stock_code ? `코드 ${item.stock_code}` : "",
          item.industry_name ? `산업 ${item.industry_name}` : "",
          item.market_topic ? `주제 ${item.market_topic}` : "",
          item.investment_opinion ? `의견 ${item.investment_opinion}` : "",
          item.target_price ? `목표가 ${item.target_price}` : "",
          upsideLabel(item),
          item.alpha_score !== null && item.alpha_score !== undefined ? `Alpha ${item.alpha_grade || "-"} ${item.alpha_score}` : "",
          item.live_price ? `현재가 ${item.live_price}원` : "",
        ].filter(Boolean).join(" · ");
        const points = (item.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
        return `
          <article class="card">
            <div class="row">
              <span class="badge">${safe(item.category)}</span>
              <span class="badge">${safe(item.published_at)}</span>
              <span class="badge">#${safe(item.report_idx)}</span>
            </div>
            <h2 class="title">${safe(item.title)}</h2>
            <div class="meta">${meta}</div>
            ${renderAlphaBox(item)}
            <p class="summary">${safe(item.summary)}</p>
            ${points ? `<ul class="points">${points}</ul>` : ""}
            ${renderFactorSections(item)}
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function render() {
      renderModes();
      renderDateOptions();
      renderFilters();
      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
