 "title": "wake up! 아침에 슼", "author": "sk증권 리서치센터", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": null, "market_topic": "글로벌 및 국내 주요 증시 전반 현황 요약", "investment_opinion": null, "target_price": null, "summary": "글로벌 및 국내 증시는 3분기 미국 주요 기업 실적 호조와 외국인 투자자 순매수 전환에 힘입어 전반적으로 상승 마감하였다. 다만 배터리 업종 실적 충격 및 일부 소비·신에너지 섹터 약세는 조정 국면으로 작용하였다. 지정학적 이슈와 국제유가 등 변수에 따라 단기 변동성은 상존하나, 주요 시가총액 대형주 및 기술주는 견조한 흐름을 이어갔다. 국내 증시 내에서는 기관 및 연기금 중심의 순매수세가 유지되고 있으며, 섹터별로는 건설·인프라, 에너지, 일부 산업재 섹터가 강세를 보였다. 외국 증시 또한 에너지 및 산업재 섹터 강세 속에 일부 필수소비재와 헬스케어 섹터 중심으로 혼조세를 나타냈다.", "key_points": ["3분기 미국 주요 기업들의 실적 호조로 미국 증시가 강세 마감", "배터리 관련 업종 실적 충격으로 관련 섹터 하락 전환", "외국인 투자자 순매수 전환으로 국내 증시 반등 마감", "트럼프-이란 대통령 회동 가능성 등 지정학적 이슈가 국제유가(WTI)에 영향 미침", "기술주 및 명품, 에너지 섹터 강세, 반면 소비 및 신에너지, 자동차 섹터는 약세 나타남", "국내 주요 섹터별 수익률은 인프라·건설 업종 강세, 반도체·디스플레이 등 IT 관련 섹터는 혼조세", "미국 시장에서는 에너지, 산업재, 헬스케어 등 일부 섹터 강세, 유틸리티와 통신 섹터는 조정 국면", "투자자별 국내 순매수 강도에서는 기관과 연기금 순매수, 개인은 일부 섹터에서 매도세 확인"], "risks": ["지정학적 리스크(트럼프-이란 정상회담 가능성)로 인한 국제유가 변동성 확대 위험", "배터리 업종 실적 충격에 따른 관련 섹터 변동성", "국내외 경기 및 통화 정책 변화에 따른 증시 변동성 내재"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/시장/653201.pdf", "json_path": "../reports_json/시장/653201.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653201"}, {"report_idx": "653199", "category": "시장", "published_at": "2026-10-22", "title": "start with ibks", "author": "투자분석부", "source": "IBK투자증권", "company_name": null, "stock_code": null, "industry_name": null, "market_topic": "글로벌 및 국내 증시 동향, 원자재 및 환율 변동, 투자자별 수급 현황, 주요 업종 및 테마 동향", "investment_opinion": null, "target_price": null, "summary": "본 시장 리포트는 글로벌 및 국내 증시 현황을 매크로, 수급, 전략적 관점에서 종합적으로 다루고 있다. 미국과 유럽 증시는 긍정적인 기업 실적과 지정학적 이슈 완화 기대감으로 상승세를 보였으며, 한국 증시는 반도체와 AI 산업에 대한 기대감에 힘입어 강세를 나타냈다. 반면, 중국 시장은 배터리 관련주의 급락으로 어려움을 겪고 있다. 원자재와 환율 시장은 지정학적 협상 기대와 글로벌 경기 흐름에 영향을 받으면서 복합적인 움직임을 보였다. 투자자 수급은 외국인의 순매수 전환과 기관, 개인의 활발한 매매로 특징지어졌다. 다만 글로벌 지정학 리스크와 중국 성장주에 대한 부정적 심리, 금리 불확실성은 주요 리스크로 작용하고 있다. 이러한 환경에서 투자자들은 시장의 변동성 확대에 대비하며 업종과 테마별 전략적 접근이 요구된다.", "key_points": ["미국 증시는 스페이스X의 흑자 및 AI 관련 기대감에 상승하였다.", "유럽 증시는 기업 실적 호조에 힘입어 상승 마감하였다.", "한국 증시는 반도체 강세 및 AI 산업 성장 기대감으로 외국인 순매수 전환과 지수 상승을 보였다.", "중국 증시는 배터리 관련주 급락 및 성장주 투자심리 악화로 하락 마감하였다.", "국내 증시에서는 KOSPI와 KOSDAQ이 각각 3.29%, 1.38% 상승하며 기관과 개인의 순매수를 기록하였다.", "미국과 유럽을 포함한 주요 글로벌 증시가 실적 시즌과 지정학적 이슈에 따라 변동성을 보임.", "원자재 가격은 러시아-우크라이나 평화협상 기대감에 국제유가가 하락하였다.", "외환시장에서는 달러인덱스가 약보합세를 보이고 주요 통화들이 혼조세를 유지하였다.", "투자자별로 외국인은 국내 증시에서 순매수로 돌아섰고 기관과 개인의 매매도 활발하였다.", "주요 업종 ETF에서는 반도체와 2차전지, AI, 사이버보안 관련 테마가 관심을 받았다."], "risks": ["글로벌 지정학적 긴장 완화 여부에 따른 시장 변동성 지속 가능성.", "중국 배터리 업종과 성장주에 대한 투자심리 위축 지속 위험.", "미국 및 글로벌 금리 변동과 통화정책 불확실성으로 인한 금융시장 변동성 증가 가능성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/시장/653199.pdf", "json_path": "../reports_json/시장/653199.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653199"}, {"report_idx": "653198", "category": "시장", "published_at": "2026-10-22", "title": "[Global Markets Monitor]: 프랑스, 깊어지는 재정의 그늘", "author": "김예슬", "source": "IBK투 ung.com/analysis/downpdf?report_idx=653198"}, {"report_idx": "653197", "category": "시장", "published_at": "2026-10-22", "title": "IBKS Morning Brief", "author": "기간산업분석부, 혁신기업분석부", "source": "IBK투자증권", "company_name": null, "stock_code": null, "industry_name": null, "market_topic": "국내 증시 동향 및 투자자별 매매, 업종별 수익률 및 주요 이슈", "investment_opinion": null, "target_price": null, "summary": "국내 증시는 KOSPI 및 KOSDAQ 모두 상승 마감했다. AI 관련 수익성 우려 완화와 외국인의 순매수에 힘입어 반도체 등 일부 대형주가 강세를 보였다. SK하이닉스의 대규모 자사주 매입 조기 종료 및 소각 계획이 부각되었으며, 수출 호조와 외국인 수급에 따른 원화 강세가 이어지고 있다. 업종별로는 에너지, IT, 산업재 등 일부 업종의 변동성이 엇갈리는 가운데 투자자별 매매동향에서도 차별적 흐름이 나타나고 있다. 다만 일부 방산업체에 대한 입찰 참가 제한 등 규제 리스크도 주시할 필요가 있다.", "key_points": ["KOSPI가 3.3% 상승하며 5,735.7P로 마감, KOSDAQ도 1.4% 상승해 792.8P 마감", "AI 관련 수익성 우려 완화와 외국인 순매수에 힘입어 반도체주 강세, 코스피 장중 매수 사이드카 발동하며 5,700선 회복", "SK하이닉스가 40조원 규모 자사주 매입을 한 달 조기 종료하고 발행주식 3.3% 전량 소각 예정", "수출 호조 및 네고 물량과 외국인 국내주식 순매수에 따른 원화 강세 지속, 원/달러 환율 1,325.2원으로 4거래일 연속 연저점 경신", "주요 업종별 수익률과 대표 종목 등락률 다수 상반된 움직임 관측", "외국인, 기관, 개인 투자자별 매매동향에 차별적 흐름 존재, 특히 외국인 순매수 지속"], "risks": ["방사청이 LIG디펜스앤에어로스페이스에 대해 입찰참가 제한 2년 제재 부과"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/시장/653197.pdf", "json_path": "../reports_json/시장/653197.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653197"}, {"report_idx": "653194", "category": "시장", "published_at": "2026-10-22", "title": "상상인 Macro Daily", "author": "투자전략팀", "source": "상상인증권", "company_name": null, "stock_code": null, "industry_name": null, "market_topic": "한국과 글     function parsePriceValue(value) {
      const digits = String(value || "").replace(/[^0-9.-]/g, "");
      if (!digits) return null;
      const parsed = Number(digits);
      return Number.isFinite(parsed) ? parsed : null;
    }

    function formatWon(value) {
      if (!Number.isFinite(value)) return "";
      return `${Math.round(value).toLocaleString("ko-KR")}원`;
    }

    function formatPercent(value) {
      if (!Number.isFinite(value)) return "";
      return `${value.toFixed(1)}%`;
    }

    function getUpsideData(item) {
      const livePrice = parsePriceValue(item.live_price);
      const targetPrice = parsePriceValue(item.target_price);
      if (!Number.isFinite(livePrice) || !Number.isFinite(targetPrice) || livePrice <= 0) {
        return null;
      }
      const diff = targetPrice - livePrice;
      return {
        diff,
        pct: (diff / livePrice) * 100,
      };
    }

    function upsideLabel(item) {
      const upside = getUpsideData(item);

      if (Number.isFinite(changeAmount) && changeAmount < 0) return "down";
      if (Number.isFinite(changeRate) && changeRate < 0) return "down";
      if (Number.isFinite(changeAmount) && changeAmount > 0) return "up";
      if (Number.isFinite(changeRate) && changeRate > 0) return "up";

      const text = `${safe(group.live_price_change)} ${safe(group.live_price_rate)}`;

      return "";

    function renderSparkline(history) {
      const values = (history || [])
        .map((item) => parsePriceValue(item.close))
        .filter((value) => Number.isFinite(value));
      if (values.length < 2) return "";

      const width = 220;
      const height = 40;
      const padding = 2;
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const range = Math.max(maxValue - minValue, 1);
      const points = values.map((value, index) => {
        const x = padding + ((width - padding * 2) * index) / (values.length - 1);
        const y = height - padding - ((value - minValue) / range) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const lastPoint = points[points.length - 1].split(",");
      const trendUp = values[values.length - 1] >= values[0];
      const stroke = trendUp ? "#0d7a5f" : "#ca6702";
      return `
        <div class="price-chart" aria-label="최근 3개월 주가 추이">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-hidden="true">

            <circle cx="${lastPoint[0]}" cy="${lastPoint[1]}" r="2.8" fill="${stroke}"></circle>
          </svg>
        </div>
        <div class="price-caption">[3개월 주가 추이]</div>
      `;

    async function fetchReportsForDate(date) {
      if (!date) return [];
      if (reportCache.has(date)) return reportCache.get(date) || [];
      try {
        const response = await fetch(`./archive/${date}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const nextReports = payload.reports || [];
        reportCache.set(date, nextReports);
        return nextReports;
      } catch (error) {
        return null;
      }
    }

    async function ensureHistoryLoaded() {
      if (historyLoaded) return true;
      for (const date of availableDates) {
        const loaded = await fetchReportsForDate(date);
        if (loaded === null) return false;
      }
      historyLoaded = true;
      return true;
    }

    function allCachedReports() {
      return Array.from(reportCache.values()).flat();

    function stockCatalog() {
      const grouped = new Map();
      for (const item of allCachedReports()) {
        if (item.category !== "기업" || !item.stock_code) continue;
        const key = item.stock_code;
        if (!grouped.has(key)) {
          grouped.set(key, {
            stock_code: item.stock_code,
            company_name: item.company_name || item.title || item.stock_code,
            report_count: 0,
            dates: new Set(),
            latest_date: item.published_at || "",
          });
        }
        const stock = grouped.get(key);
        stock.report_count += 1;
        if (item.company_name) stock.company_name = item.company_name;
        if (item.published_at) stock.dates.add(item.published_at);
        if ((item.published_at || "") > stock.latest_date) stock.latest_date = item.published_at || "";
      }
      return Array.from(grouped.values());
    }

    function matchingStocks(query) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return [];
      return stockCatalog()
        .map((item) => {
          const name = String(item.company_name || "").toLowerCase();
          const code = String(item.stock_code || "").toLowerCase();
          let score = -1;
          if (code === keyword) score = 100;
          else if (name === keyword) score = 95;
          else if (code.startsWith(keyword)) score = 80;
          else if (name.startsWith(keyword)) score = 70;
          else if (code.includes(keyword)) score = 60;
          else if (name.includes(keyword)) score = 50;
          return { ...item, score };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => {
          const scoreDiff = b.score - a.score;
          if (scoreDiff !== 0) return scoreDiff;
          const dateDiff = (b.latest_date || "").localeCompare(a.latest_date || "");
          if (dateDiff !== 0) return dateDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });
    }

                  ${report.alpha_score !== null && report.alpha_score !== undefined ? `<div class="badge">${safe(report.alpha_grade || "-")} ${safe(report.alpha_score)}</div>` : ""}
                  <div class="badge">#${safe(report.report_idx)}</div>
                </div>
              </summary>
              <div class="report-body">
                <p class="summary">${safe(report.summary)}</p>
                ${pointItems ? `<ul class="points">${pointItems}</ul>` : ""}
                ${renderFactorSections(report)}
                <div class="links">
                  <a href="${safe(report.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
                </div>
              </div>
            </details>
          `;
        }).join("");

        return `
          <article class="group-card">
            <div class="group-head">
              <div>
                <div class="group-title-row">
                  <h2 class="group-title">${safe(group.company_name)}</h2>
                  ${renderPriceBox(group)}
                </div>
              </div>
            </div>
            <div class="group-meta">
              ${group.stock_code ? `<span class="pill"><button type="button" data-copy-stock="${safe(group.stock_code)}">종목코드 복사</button></span>` : ""}
              ${group.stock_code ? `<span class="pill"><a href="${stockWebUrl(group.stock_code)}" target="_blank" rel="noreferrer">네이버금융</a></span>` : ""}
            </div>
            <div class="report-stack">${reportsHtml}</div>
          </article>
        `;
      }).join("");

      const renderStandaloneSection = (title, entries) => entries.length
        ? `
          <div class="section-title">${title}</div>
          ${entries.map((item) => `
            <article class="card">
              <div class="row">
                <span class="badge">${safe(item.category)}</span>
                <span class="badge">${safe(item.published_at)}</span>
                <span class="badge">#${safe(item.report_idx)}</span>
              </div>
              <h2 class="title">${safe(item.title)}</h2>
              <div class="meta">작성자 ${safe(item.author)} · 출처 ${safe(item.source)}${item.market_topic ? ` · 주제 ${safe(item.market_topic)}` : ""}${item.industry_name ? ` · 산업 ${safe(item.industry_name)}` : ""}</div>
              <p class="summary">${safe(item.summary)}</p>
              ${renderFactorSections(item)}
              <div class="links">
                <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
              </div>
            </article>
          `).join("")}
        `
        : "";

      root.innerHTML = groupCards
        + renderStandaloneSection("산업 리포트", industry)
        + renderStandaloneSection("시장 리포트", market);
    }

    function renderList(items) {
      const root = document.getElementById("list");
      root.innerHTML = items.map((item) => {
        const meta = [
          item.author ? `작성자 ${item.author}` : "",
          item.source ? `출처 ${item.source}` : "",
          item.company_name ? `회사 ${item.company_name}` : "",
          item.stock_code ? `코드 ${item.stock_code}` : "",
          item.industry_name ? `산업 ${item.industry_name}` : "",
          item.market_topic ? `주제 ${item.market_topic}` : "",
          item.investment_opinion ? `의견 ${item.investment_opinion}` : "",
          item.target_price ? `목표가 ${item.target_price}` : "",
          upsideLabel(item),
          item.alpha_score !== null && item.alpha_score !== undefined ? `Alpha ${item.alpha_grade || "-"} ${item.alpha_score}` : "",
          item.live_price ? `현재가 ${item.live_price}원` : "",
        ].filter(Boolean).join(" · ");
        const points = (item.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
        return `
          <article class="card">
            <div class="row">
              <span class="badge">${safe(item.category)}</span>
              <span class="badge">${safe(item.published_at)}</span>
              <span class="badge">#${safe(item.report_idx)}</span>
            </div>
            <h2 class="title">${safe(item.title)}</h2>
            <div class="meta">${meta}</div>
            ${renderAlphaBox(item)}
            <p class="summary">${safe(item.summary)}</p>
            ${points ? `<ul class="points">${points}</ul>` : ""}
            ${renderFactorSections(item)}
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function render() {
      renderModes();
      renderDateOptions();
      renderFilters();
      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
</html>
