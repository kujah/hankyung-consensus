ion": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/시장/652093.pdf", "json_path": "../reports_json/시장/652093.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652093"}, {"report_idx": "652112", "category": "산업", "published_at": "2026-09-03", "title": "[인터넷/게임] IBKS Daily", "author": "이승훈, 박상준", "source": "IBK투자증권", "company_name": null, "stock_code": null, "industry_name": "인터넷/게임", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "국내외 인터넷 및 게임 산업은 넥슨의 블리자드 IP 인수 추진과 네이버의 사우디 부동산·행정 디지털 전환 협력 확대 등으로 새로운 성장 모멘텀을 형성 중임. 다만, 단기적 업황은 다소 부진하며 경기 및 정책 관련 리스크도 존재함.", "key_points": ["국내 게임사 넥슨이 블리자드와의 계약을 통해 '스타크래프트' IP 후속작 개발 권리를 확보할 예정으로, 출시 30년이 넘은 게임이지만 PC방 인기 순위 10위권내에 머무름에 따라 후속작의 국내 게임 시장 파급력이 클 것으로 전망됨.", "네이버클라우드와 사우디 NHC이노베이션의 합작법인 '네이버 이노베이션'이 사우디 부동산 등기기관과 MOU를 체결하며 AI와 공간정보 기술을 활용한 부동산 및 지방행정 디지털 전환 사업을 확대 중.", "네이버 이노베이션은 사우디 현지 호스피탈리티 플랫폼 'Wddk'와도 별도 MOU를 체결하여 예약, 결제, 할인 혜택 등을 통합하는 디지털 플랫폼 연동 방안을 검토 중.", "국내 코스피 코스닥 인터넷/게임 업종은 단기적으로 외부 요인 영향으로 변동성 크고 실적도 다소 부진한 양상을 보이나 신규 IP 개발과 해외 디지털 전환 사업 진출 등이 긍정적 모멘텀으로 작용 가능함."], "risks": ["글로벌 경기 불확실성 및 국내외 IT·게임 관련 규제 강화 가능성.", "신규 IP 개발의 성공 여부와 해외 사업 확장에 따른 정책 리스크.", "국내외 경쟁 심화 및 사용자 트렌드 변화로 인한 매출 변동성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652112.pdf", "json_path": "../reports_json/산업/652112.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652112"}, {"report_idx": "652109", "category": "산업", "published_at": "2026-09-03", "title": "Global Carbon Daily", "author": "최관순", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "탄소배출권 및 에너지 산업", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "글로벌 탄소배출권 시장은 유럽과 영국 중심으로 강한 상승세를 보이고 있으며, 국내 온실가스 저감 인증실적도 크게 증가하는 등 환경 규제 강화에 따른 수급 환경이 개선되고 있다. 미국과 중국 일부 지역에서는 가격 조정 및 부진 현상이 나타나나, 전반적으로 정책적 강화 움직임과 에너지 가격 상승이 탄소배출권 수요 및 가격을 지지하고 있다. ETF 시장은 상대적으로 안정화를 유지하고 있으나 조정 위험도 존재한다. 실생활 온실가스 감축 활동까지 거래 대상으로 포함하는 정책 변화는 전체 시장에 중장기적인 긍정 요인으로 작용 가능하다.", "key_points": ["글로벌 탄소배출권 가격은 전반적으로 상승세를 보이나, 지역별로 차별화: 유럽(EUA), 영국(UKA)은 1개월 기준 각각 4.0%, 1.6% 상승, 중국 현물(CEA)은 하락세.", "미국 RGGI 지역 탄소배출권 가격은 단기적으로 하락(-0.5%)했으며, 장기적으로도 부진(-13.8% 3개월)하다.", "국내 온실가스 저감 인증실적(KOC, i-KOC)은 최근 3개월간 급격한 상승세를 기록(각각 112.7%, 93.6%).", "글로벌 에너지 가격은 국제유가, 천연가스, 전력, LNG 등 전반적으로 상승 추세이나, 원유는 최근 3개월간 혼조세를 나타냄.", "탄소배출권 관련 ETF/ETN은 전반적으로 안정적이거나 소폭 상승, 다만 일부 ETF는 단기 조정세 존재.", "정책 이슈로 실생활 온실가스 감축 활동도 배출권 거래 대상에 포함하는 등 규제가 점차 강화되고 있음.", "유럽 및 미국 배출권 선물 가격은 장기적으로 상승세 유지, 이는 탄소 규제 강화 및 수요 증가 기대 반영.", "배출권 가격과 글로벌 에너지 가격 간의 연동성 관찰되며, 특히 유럽 전력 및 천연가스 가격 상승이 두드러짐."], "risks": ["지역별 탄소배출권 가격 변동성 존재, 특히 미국 RGGI와 중국 시장은 부진한 흐름.", "정책 변화에 따른 규제 강화 또는 완화 가능성이 시장에 영향을 줄 위험이 있음.", "국제 에너지 가격 변동이 탄소배출권 시장에 부정적 영향을 줄 가능성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652109.pdf", "json_path": "../reports_json/산업/652109.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652109"}, {"report_idx": "652108", "category": "산업", "published_at": "2026-09-03", "title": "AI의 허리 : 서버 사업 이해하기", "author": "박제민", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "서버 및 클라우드 서비스", "market_topic": "AI 및 GPU 데이터센터 성장", "investment_opinion": null, "target_price": null, "summary": "본 산업 리포트는 AI 발전에 따른 서버 사업의 핵심인 CSP(Cloud Service Provider) 역할과 시장 동향을 분석한다. CSP는 대규모 자본을 투입해 서버 인프라를 구축하고 임대하는 사업자로, AI 시대 GPU 데이터센터 수요 급증에 따라 시장이 빠르게 확장되고 있다. 2025년까지 AI 데이터센터 용량이 크게 증가하며, 주요 빅테크 기업들이 선제 투자를 진행 중이다. 또한 AI 시대 클라우드 서비스 모델이 기존 3단계에서 5~6단계로 확대되고, 과금 체계도 GPU 및 AI 특화 방식으로 변화하는 점이 특징적이다. 전체적으로 서버 및 데이터센터 산업은 AI 산업 발전과 함께 성장 중이나, 구체적인 재무 수치나 주가 전망은 제공되지 않았다.", "key_points": ["CSP는 서버를 구매하여 운영한 뒤 시간 단위로 임대하는 자본집약형 사업자로, AI 밸류체인의 핵심 역할을 수행한다.", "2023년 이후 GPU 기반 CSP 시대가 도래하며, GPU 데이터센터 수요가 급증하고 있다.", "2025년 전세계 AI 데이터센터 용량이 약 50GW에 달하며 2028년까지 200GW 이상으로 급증할 전망이다.", "주요 CSP 기업들은 Google, AWS 등 빅테크가 중심이며, 중국은 자체 AI 칩 생산 확대 중이다.", "기존 클라우드 서비스는 IaaS, PaaS, SaaS 3단계였으나 AI 시대에 베어메탈, MaaS 등 5~6단계로 세분화되며 과금 방식도 GPU-시간과 토큰 사용량 기준으로 변화 중이다."], "risks": [], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652108.pdf", "json_path": "../reports_json/산업/652108.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652108"}, {"report_idx": "652105", "category": "산업", "published_at": "2026-09-03", "title": "2027년 예산안으로 살펴보는 스몰캡 아이디어", "author": "권명준,서석준", "source": "유안타증권", "company_name": null, "stock_code": null, "industry_name": "반도체 인프라, 로봇(피지컬 AI), 태양광 모듈 & 히트펌프", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "2027년 예산안에서는 반도체 인프라, 로봇(피지컬 AI), 그리고 태양광 및 히트펌프 등 첨단 미래산업에 대한 대규모 투자가 계획되어 있다. 반도체 분야는 수도권과 서남권을 중심으로 Fab 생산 거점 구축이 가속화되며 인프라 기업의 실적 개선이 기대된다. 로봇 분야에서는 AI 로봇 도입을 통한 공공 수요 창출이 예고되어 국내 관련 산업 발전에 긍정적인 영향을 미칠 전망이다. 또한 태양광 모듈과 히트펌프 보급 확대는 에너지 대전환 정책의 일환으로 재생에너지 산업 확대에 기여할 것으로 보인다.", "key_points": ["2027년 국가재정운용계획에 따라 반도체 인프라 투자 크게 확대, 2027년 예산 21.3조원으로 전년 대비 97.2% 증가", "수도권(용인, 평택)과 서남권 반도체 생산기지 구축 및 Fab 조기 가동 위한 인프라 투자 강화", "반도체 인프라 기업의 실적 개선 예상, 특히 평택과 용인 Fab 동시 구축과 서남권 Fab 확대에 따른 연속적 성장 기대", "로봇 분야에서는 피지컬 AI에 대한 집중 지원 계획, 공공 수요 창출 위해 국산 AI 로봇 2000여대 도입 예정", "국내 로봇 관련 산업에 대한 관심 증대 및 휴머노이드 로봇 완제품 및 부품 시장 확장 기반 마련", "태양광 및 히트펌프 관련 예산 증액, 재생에너지 보급 확대에 따른 태양광 설비 사업 확대 기대", "에너지 대전환 예산이 6.6조원으로 성장, 무탄소 에너지 수요 견인 및 히트펌프 보급 대폭 확대 계획 포함"], "risks": [], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652105.pdf", "json_path": "../reports_json/산업/652105.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652105"}, {"report_idx": "652102", "category": "산업", "published_at": "2026-09-03", "title": "천연가스, 겨울보다 가을에 주목", "author": "홍성기", "source": "LS증권", "company_name": null, "stock_code": null, "industry_name": "천연가스", "market_topic": "가격 급등 및 공급 이슈", "investment_opinion": null, "target_price": null, "summary": "최근 미국-이란 갈등으로 천연가스 가격이 큰 폭으로 상승하며 공급 차질 우려가 커지고 있음. 미국과 유럽의 천연가스 재고 상황은 상반되며, 특히 유럽은 극심한 재고 부족과 높은 가격으로 인해 겨울 앞서 가을철 재고 비축 및 수급 동향에 주목할 필요가 있음. 미국 내 LNG 수출은 설비 보수 및 신규 터미널 지연 영향으로 부진하며, 이는 국제 가격과 미국 내 가격 간 괴리를 심화시키는 요인임. 한편, 유럽의 신재생 발전 확대와 이란 사태 조기 종료 기대감이 LNG 구매 심리 위축에 영향을 미치고 있음. 향후 시장은 지정학적 리스크, 재고 수준, LNG 수출 설비 가동률에 따라 가격 변동성과 수급 불확실성이 지속될 것으로 전망됨.", "key_points": ["천연가스 가격(TTF, JKM)은 7월 미국-이란 갈등 재개에 따라 급등, 원유 상승폭 대비 훨씬 높음", "미국 천연가스(HH) 가격도 8월 중순 이후 상승세 전환, 겨울철 앞두고 유럽과 아시아 재고 비축 경쟁 심화 전망", "미국 천연가스 재고는 여전히 5년 평균 대비 높은 반면 유럽 재고는 이란 사태 및 기존 소진 영향으로 매우 낮은 수준(저장 용량대비 약 65%)", "유럽은 신재생 에너지 확대 및 이란 사태 조기 종료 기대감으로 높은 가격에도 LNG 구매 소극적", "미국 LNG 수출은 2분기 정기 보수 및 신규 터미널 지연으로 예상보다 부진, 일부 터미널 가동률 낮음", "미국 천연가스 생산은 Permian 지역 중심으로 증가 중이지만 LNG 수출 부진이 가격 간 괴리 확대 요인"], "risks": ["이란-미국 갈등 장기화에 따른 가격 변동성 확대", "유럽 재고 부족으로 인한 공급 차질 위험 내재", "미국 LNG 인프라 보수 및 가동률 이슈로 공급 제한 가능성"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652102.pdf", "json_path": "../reports_json/산업/652102.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652102"}, {"report_idx": "652098", "category": "산업", "published_at": "2026-09-03", "title": "8월, 판매 실적 엇갈림 속 미국 M/S 12.9%", "author": "김성래", "source": "한화투자증권", "company_name": null, "stock_code": null, "industry_name": "자동차", "market_topic": "8월 미국 시장 점유율 확대 및 친환경차 판매 증대", "investment_opinion": null, "target_price": null, "summary": "8월 자동차 산업에서는 현대차와 기아의 판매 실적이 엇갈렸다. 현대차는 파업 영향으로 도매 판매가 크게 감소했으나, 미국 내 시장 점유율을 12.9%로 확대하며 주요 경쟁사 대비 선전했다. 기아는 해외 시장에서의 강세와 친환경차 판매의 큰 폭 증가가 돋보였다. 친환경차 분야에서는 기아가 BEV와 HEV 판매 확대를 주도했으나 현대차는 HEV 판매 감소로 수익성에 부담이 예상된다. 9월부터는 신차 출시와 생산 재개로 매출 및 수익성 회복이 기대되나, 원화 강세 등 환율 변동이 앞으로의 주요 변수로 대두되고 있다.", "key_points": ["8월 현대차 판매는 파업 영향으로 도매 기준 28.8만대로 전년 대비 14.2% 감소하였으나 미국 내 판매는 13.7% 증가하며 시장 점유율 12.9%를 기록, GM과 도요타에 이어 3위 유지.", "기아는 8월 도매 판매 26.7만대로 5.4% 증가, 특히 미국, 유럽, 인도 시장에서 강세를 보이며 친환경차 판매량이 40.7% 급증.", "현대차 친환경차 판매는 8월 7.1% 감소, 특히 수익성이 높은 HEV 판매가 감소하여 3분기 수익성에 부정적 영향 예상.", "기아는 HEV, BEV 판매가 큰 폭 증가하며 친환경차 비중이 전체 판매의 34.6%로 확대.", "9월부터 현대차와 기아 모두 신차 생산 및 판매 회복 기대되나, 원화 강세에 따른 환율 영향이 4분기 실적 변동 요인으로 작용할 전망."], "risks": ["현대차 파업으로 인한 생산 차질 및 판매 감소 위험 지속.", "원화 강세에 따라 수익성 악화 가능성 존재.", "글로벌 경기 둔화 및 특정 지역 판매 부진에 따른 시장 수요 변동성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652098.pdf", "json_path": "../reports_json/산업/652098.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652098"}, {"report_idx": "652092", "category": "산업", "published_at": "2026-09-03", "title": "안녕하세요 데일리에요", "author": "양승윤", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "로봇, 방산, 조선", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "로봇, 방산, 조선 산업 모두 국내외에서 신기술 개발 및 사업 확장이 활발하게 진행 중이나, 일부 해외 사업 협상 난항과 정책 변화, 국제 경쟁 심화 등의 리스크가 존재함. 각 산업은 자체 기술 개발과 해외 진출을 통한 성장 기회를 모색하며, 방산과 조선 분야에서는 전략적 협력과 해외 평가 결과가 앞으로의 사업에 중요한 변수로 작용할 전망이다.", "key_points": ["로봇 산업 내 현대차는 자체 양팔 로봇 및 다양한 목적형 로봇 개발에 집중하며 투트랙 전략으로 제품화 준비 중.", "국내 주요 로봇 기업들이 신기술 적용 제품(5지핸드, 휴머노이드용 액추에이터 등)을 잇따라 출시하며 기술 경쟁력 확대.", "티엑스알로보틱스는 UAE 산업허브 진출을 모색하는 등 해외 시장 진출에 적극적임.", "방산 산업에서는 폴란드 K2 사업의 기술 이전 협상에 난항을 겪고 있으며, 이로 인해 현지 생산 일정 지연 가능성이 있음.", "미국과 스웨덴 등 해외 방산 시장에서는 신형 훈련기 도입 지연 및 신형 호위함 무장 추가 검토 등 변화가 발생."         } else {
          market.push(item);
        }
      }

      const groupedCompanies = Array.from(groups.values())
        .map((group) => ({
          ...group,
          reports: group.reports.sort((a, b) => {
            const scoreDiff = (b.alpha_score || -1) - (a.alpha_score || -1);
            if (scoreDiff !== 0) return scoreDiff;
            const sourceA = a.source || "";
            const sourceB = b.source || "";
            return sourceA.localeCompare(sourceB, "ko");
          }),
        }))
        .sort((a, b) => {
          const scoreDiff = (b.best_alpha_score || -1) - (a.best_alpha_score || -1);
          if (scoreDiff !== 0) return scoreDiff;
          const countDiff = b.reports.length - a.reports.length;
          if (countDiff !== 0) return countDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });

      return { groupedCompanies, industry, market };
    }

    function renderModes() {
      const root = document.getElementById("modes");
      root.innerHTML = "";
      for (const mode of modes) {
        const button = document.createElement("button");
        button.textContent = mode.label;
        if (mode.key === currentMode) button.classList.add("active");
        button.onclick = () => {
          currentMode = mode.key;
          render();
        };
        root.appendChild(button);
      }
    }

    function renderDateOptions() {
      const root = document.getElementById("date-select");
      root.innerHTML = availableDates
        .map((date) => `<option value="${safe(date)}"${date === currentDate ? " selected" : ""}>${safe(date)}</option>`)
        .join("");
      root.onchange = async (event) => {
        await switchDate(event.target.value);
      };
    }

    function renderFilters() {
      const root = document.getElementById("filters");
      root.innerHTML = "";
      for (const category of categories) {
        const button = document.createElement("button");
        button.textContent = category;
        if (category === current) button.classList.add("active");
        button.onclick = () => {
          current = category;
          render();
        };
        root.appendChild(button);
      }
    }

    function renderStats(items) {
      const root = document.getElementById("stats");
      root.innerHTML = "";
      document.getElementById("subline").textContent = "";
      document.getElementById("subline").style.display = "none";
    }

    function formatQuoteAsOf(value) {
      const text = safe(value);
      const matched = text.match(/(\d{4}\.\d{2}\.\d{2})/);
      if (matched) return `${matched[1].slice(2)} 장마감 기준`;
      return text
        .replace(/^현재가\s*/, "")
        .replace(/\s*기준(?:\(KRX 장마감\)|\(장마감\)|\(KRX장마감\)|\(KRX 마감\))?/g, "")
        .trim();
    }

    function priceDirectionClass(group) {
      const explicit = safe(group.live_price_direction).toLowerCase();
      if (explicit === "up" || explicit === "rise") return "up";
      if (explicit === "down" || explicit === "fall") return "down";

      const changeAmount = parsePriceValue(group.live_price_change);
      const changeRate = parsePriceValue(group.live_price_rate);
      if (Number.isFinite(changeAmount) && changeAmount < 0) return "down";
      if (Number.isFinite(changeRate) && changeRate < 0) return "down";
      if (Number.isFinite(changeAmount) && changeAmount > 0) return "up";
      if (Number.isFinite(changeRate) && changeRate > 0) return "up";

      const text = `${safe(group.live_price_change)} ${safe(group.live_price_rate)}`;
      if (text.includes("-")) return "down";
      return "";
    }

    function renderSparkline(history) {
      const values = (history || [])
        .map((item) => parsePriceValue(item.close))
        .filter((value) => Number.isFinite(value));
      if (values.length < 2) return "";

      const width = 220;
      const height = 40;
      const padding = 2;
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const range = Math.max(maxValue - minValue, 1);
      const points = values.map((value, index) => {
        const x = padding + ((width - padding * 2) * index) / (values.length - 1);
        const y = height - padding - ((value - minValue) / range) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const lastPoint = points[points.length - 1].split(",");
      const trendUp = values[values.length - 1] >= values[0];
      const stroke = trendUp ? "#0d7a5f" : "#ca6702";
      return `
        <div class="price-chart" aria-label="최근 3개월 주가 추이">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-hidden="true">
            <polyline fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${points.join(" ")}"></polyline>
            <circle cx="${lastPoint[0]}" cy="${lastPoint[1]}" r="2.8" fill="${stroke}"></circle>
          </svg>
        </div>
        <div class="price-caption">[3개월 주가 추이]</div>
      `;
    }

    function renderPriceBox(group) {
      if (!group.live_price) {
        return `
          <div class="price-box">
            <div class="price-label">현재가</div>
            <div class="price-main">조회 실패</div>
          </div>
        `;
      }

      const change = [safe(group.live_price_change), safe(group.live_price_rate)].filter(Boolean).join(" / ");
      const directionClass = priceDirectionClass(group);
      const high52w = safe(group.live_price_high_52w);
      return `
        <div class="price-box">
          <div class="price-label">${formatQuoteAsOf(group.live_price_as_of)}</div>
          <div class="price-main">${safe(group.live_price)}원</div>
          <div class="price-change ${directionClass}">${change}</div>
          ${high52w ? `<div class="price-extra">52주 최고가 ${high52w}원</div>` : ""}
          ${renderSparkline(group.price_history)}
        </div>
      `;
    }

    function renderAlphaBox(item) {
      if (item.alpha_score === null || item.alpha_score === undefined) return "";
      return `
        <div class="score-box">
          <div class="score-grade">Alpha ${safe(item.alpha_grade || "-")}</div>
          <div class="score-main">${safe(item.alpha_score)}</div>
          <div class="score-sub">${safe(item.score_reason || "")}</div>
        </div>
      `;
    }

    function stockWebUrl(stockCode) {
      if (!stockCode) return "";
      return `https://finance.naver.com/item/main.naver?code=${encodeURIComponent(stockCode)}`;
    }

    async function copyStockCode(stockCode) {
      if (!stockCode) return;
      try {
        await navigator.clipboard.writeText(String(stockCode));
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = String(stockCode);
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      alert(`종목코드 복사: ${stockCode}`);
    }

    async function fetchReportsForDate(date) {
      if (!date) return [];
      if (reportCache.has(date)) return reportCache.get(date) || [];
      try {
        const response = await fetch(`./archive/${date}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const nextReports = payload.reports || [];
        reportCache.set(date, nextReports);
        return nextReports;
      } catch (error) {
        return null;
      }
    }

    async function ensureHistoryLoaded() {
      if (historyLoaded) return true;
      for (const date of availableDates) {
        const loaded = await fetchReportsForDate(date);
        if (loaded === null) return false;
      }
      historyLoaded = true;
      return true;
    }

    function allCachedReports() {
      return Array.from(reportCache.values()).flat();
    }

    function stockCatalog() {
      const grouped = new Map();
      for (const item of allCachedReports()) {
        if (item.category !== "기업" || !item.stock_code) continue;
        const key = item.stock_code;
        if (!grouped.has(key)) {
          grouped.set(key, {
            stock_code: item.stock_code,
            company_name: item.company_name || item.title || item.stock_code,
            report_count: 0,
            dates: new Set(),
            latest_date: item.published_at || "",
          });
        }
        const stock = grouped.get(key);
        stock.report_count += 1;
        if (item.company_name) stock.company_name = item.company_name;
        if (item.published_at) stock.dates.add(item.published_at);
        if ((item.published_at || "") > stock.latest_date) stock.latest_date = item.published_at || "";
      }
      return Array.from(grouped.values());
    }

    function renderSearchResults(htmlText) {
      document.getElementById("search-results").innerHTML = htmlText;
    }

    function renderHistoryEmpty(message) {
      const root = document.getElementById("history-section");
      root.innerHTML = `<div class="history-empty">${safe(message)}</div>`;
    }

    function matchingStocks(query) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return [];
      return stockCatalog()
        .map((item) => {
          const name = String(item.company_name || "").toLowerCase();
          const code = String(item.stock_code || "").toLowerCase();
          let score = -1;
          if (code === keyword) score = 100;
          else if (name === keyword) score = 95;
          else if (code.startsWith(keyword)) score = 80;
          else if (name.startsWith(keyword)) score = 70;
          else if (code.includes(keyword)) score = 60;
          else if (name.includes(keyword)) score = 50;
          return { ...item, score };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => {
          const scoreDiff = b.score - a.score;
          if (scoreDiff !== 0) return scoreDiff;
          const dateDiff = (b.latest_date || "").localeCompare(a.latest_date || "");
          if (dateDiff !== 0) return dateDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });
    }

    function renderHistoryReportCard(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" 쨌 ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <h3 class="history-report-title">${safe(item.title)}</h3>
            <div class="report-brief">${meta}</div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStock(stockCode) {
      renderHistoryForStockCompact(stockCode);
    }

    function renderHistoryReportCardCompact(item) {
      const meta = [
        safe(item.source),
        safe(item.author),
        [safe(item.investment_opinion), safe(item.target_price)].filter(Boolean).join(" "),
        upsideLabel(item),
      ].filter(Boolean).join(" / ");
      return `
        <article class="history-report-card">
          <div class="history-report-main">
            <div class="history-title-row">
              <h3 class="history-report-title">${safe(item.title)}</h3>
              ${item.published_at ? `<span class="badge">${safe(item.published_at)}</span>` : ""}
            </div>
            <div class="report-brief">${meta}</div>
            <p class="summary">${safe(item.summary)}</p>
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문</a>
            </div>
          </div>
          <div class="history-report-badges">
            ${item.alpha_score !== null && item.alpha_score !== undefined ? `<span class="badge">${safe(item.alpha_grade || "-")} ${safe(item.alpha_score)}</span>` : ""}
            <span class="badge">#${safe(item.report_idx)}</span>
          </div>
        </article>
      `;
    }

    function renderHistoryForStockCompact(stockCode) {
      const entries = allCachedReports()
        .filter((item) => item.stock_code === stockCode)
        .sort((a, b) => {
          const dateDiff = (b.published_at || "").localeCompare(a.published_at || "");
          if (dateDiff !== 0) return dateDiff;
          return String(b.report_idx || "").localeCompare(String(a.report_idx || ""));
        });
      const root = document.getElementById("history-section");
      if (!entries.length) {
        renderHistoryEmpty("?대떦 醫낅ぉ????λ맂 ?대젰???놁뒿?덈떎.");
        return;
      }

      const companyName = entries.find((item) => item.company_name)?.company_name || stockCode;
      const uniqueDates = new Set(entries.map((item) => item.published_at).filter(Boolean));
      const bestEntry = entries.find((item) => item.alpha_score !== null && item.alpha_score !== undefined);
      const cards = entries.map((item) => renderHistoryReportCardCompact(item)).join("");

      root.innerHTML = `
        <article class="group-card history-group-card">
          <div class="group-head">
            <div>
              <div class="group-title-row">
                <h2 class="group-title">${safe(companyName)}</h2>
              </div>
            </div>
          </div>
          <div class="group-meta">
            <span class="pill"><button type="button" data-copy-stock="${safe(stockCode)}">종목코드 복사</button></span>
            <span class="pill"><a href="${stockWebUrl(stockCode)}" target="_blank" rel="noreferrer">네이버금융</a></span>
          </div>
          <div class="report-stack">${cards}</div>
        </article>
      `;
    }

    async function runStockSearch() {
      const input = document.getElementById("stock-search");
      const query = String(input.value || "").trim();
      if (!query) {
        renderSearchResults("");
        renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
        return;
      }

      renderSearchResults('<span class="badge">아카이브 확인 중...</span>');
      const loaded = await ensureHistoryLoaded();
      if (!loaded) {
        renderSearchResults("");
        renderHistoryEmpty("아카이브를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      const matches = matchingStocks(query).slice(0, 12);
      if (!matches.length) {
        renderSearchResults("");
        renderHistoryEmpty(`"${query}"와 일치하는 종목 이력이 없습니다.`);
        return;
      }

      renderSearchResults(
        matches
          .map(
            (item) => `
              <button type="button" data-stock-history="${safe(item.stock_code)}">
                ${safe(item.company_name)} (${safe(item.stock_code)}) · ${item.report_count}건
              </button>
            `
          )
          .join("")
      );
      renderHistoryForStockCompact(matches[0].stock_code);
    }

    function renderFactorSections(item) {
      if (item.category !== "기업") return "";
      const sections = [];
      if (item.revision_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Revision Signal</div><p class="factor-text">${safe(item.revision_signal)}</p></div>`);
      }
      if (item.structural_growth_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Structural Growth</div><p class="factor-text">${safe(item.structural_growth_signal)}</p></div>`);
      }
      if (item.valuation_risk_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Valuation / Risk</div><p class="factor-text">${safe(item.valuation_risk_signal)}</p></div>`);
      }
      const positiveText = (item.positive_factors || []).map((value) => `+ ${safe(value)}`).join("<br>");
      const negativeText = (item.negative_factors || []).map((value) => `- ${safe(value)}`).join("<br>");
      if (positiveText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Positive Factors</div><p class="factor-text">${positiveText}</p></div>`);
      }
      if (negativeText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Negative Factors</div><p class="factor-text">${negativeText}</p></div>`);
      }
      if (item.market_reaction_placeholder) {
        sections.push(`<div class="factor-box"><div class="factor-title">Market Reaction</div><p class="factor-text">D+1 / D+5 / D+20 추후 연결 예정</p></div>`);
      }
      return sections.length ? `<div class="factor-grid">${sections.join("")}</div>` : "";
    }

    function renderGrouped(items) {
      const root = document.getElementById("list");
      const { groupedCompanies, industry, market } = groupedData(items);

      const groupCards = groupedCompanies.map((group) => {
        const reportsHtml = group.reports.map((report) => {
          const pointItems = (report.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
          return `
            <details class="report-detail">
              <summary>
                <div>
                  <div>${safe(report.title)}</div>
                  <div class="report-brief">${[
                    safe(report.source),
                    safe(report.author),
                    [safe(report.investment_opinion), safe(report.target_price)].filter(Boolean).join(" "),
                    upsideLabel(report),
                  ].filter(Boolean).join(" · ")}</div>
                </div>
                <div>
                  ${report.alpha_score !== null && report.alpha_score !== undefined ? `<div class="badge">${safe(report.alpha_grade || "-")} ${safe(report.alpha_score)}</div>` : ""}
                  <div class="badge">#${safe(report.report_idx)}</div>
                </div>
              </summary>
              <div class="report-body">
                <p class="summary">${safe(report.summary)}</p>
                ${pointItems ? `<ul class="points">${pointItems}</ul>` : ""}
                ${renderFactorSections(report)}
                <div class="links">
                  <a href="${safe(report.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
                </div>
              </div>
            </details>
          `;
        }).join("");

        return `
          <article class="group-card">
            <div class="group-head">
              <div>
                <div class="group-title-row">
                  <h2 class="group-title">${safe(group.company_name)}</h2>
                  ${renderPriceBox(group)}
                </div>
              </div>
            </div>
            <div class="group-meta">
              ${group.stock_code ? `<span class="pill"><button type="button" data-copy-stock="${safe(group.stock_code)}">종목코드 복사</button></span>` : ""}
              ${group.stock_code ? `<span class="pill"><a href="${stockWebUrl(group.stock_code)}" target="_blank" rel="noreferrer">네이버금융</a></span>` : ""}
            </div>
            <div class="report-stack">${reportsHtml}</div>
          </article>
        `;
      }).join("");

      const renderStandaloneSection = (title, entries) => entries.length
        ? `
          <div class="section-title">${title}</div>
          ${entries.map((item) => `
            <article class="card">
              <div class="row">
                <span class="badge">${safe(item.category)}</span>
                <span class="badge">${safe(item.published_at)}</span>
                <span class="badge">#${safe(item.report_idx)}</span>
              </div>
              <h2 class="title">${safe(item.title)}</h2>
              <div class="meta">작성자 ${safe(item.author)} · 출처 ${safe(item.source)}${item.market_topic ? ` · 주제 ${safe(item.market_topic)}` : ""}${item.industry_name ? ` · 산업 ${safe(item.industry_name)}` : ""}</div>
              <p class="summary">${safe(item.summary)}</p>
              ${renderFactorSections(item)}
              <div class="links">
                <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
              </div>
            </article>
          `).join("")}
        `
        : "";

      root.innerHTML = groupCards
        + renderStandaloneSection("산업 리포트", industry)
        + renderStandaloneSection("시장 리포트", market);
    }

    function renderList(items) {
      const root = document.getElementById("list");
      root.innerHTML = items.map((item) => {
        const meta = [
          item.author ? `작성자 ${item.author}` : "",
          item.source ? `출처 ${item.source}` : "",
          item.company_name ? `회사 ${item.company_name}` : "",
          item.stock_code ? `코드 ${item.stock_code}` : "",
          item.industry_name ? `산업 ${item.industry_name}` : "",
          item.market_topic ? `주제 ${item.market_topic}` : "",
          item.investment_opinion ? `의견 ${item.investment_opinion}` : "",
          item.target_price ? `목표가 ${item.target_price}` : "",
          upsideLabel(item),
          item.alpha_score !== null && item.alpha_score !== undefined ? `Alpha ${item.alpha_grade || "-"} ${item.alpha_score}` : "",
          item.live_price ? `현재가 ${item.live_price}원` : "",
        ].filter(Boolean).join(" · ");
        const points = (item.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
        return `
          <article class="card">
            <div class="row">
              <span class="badge">${safe(item.category)}</span>
              <span class="badge">${safe(item.published_at)}</span>
              <span class="badge">#${safe(item.report_idx)}</span>
            </div>
            <h2 class="title">${safe(item.title)}</h2>
            <div class="meta">${meta}</div>
            ${renderAlphaBox(item)}
            <p class="summary">${safe(item.summary)}</p>
            ${points ? `<ul class="points">${points}</ul>` : ""}
            ${renderFactorSections(item)}
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function render() {
      renderModes();
      renderDateOptions();
      renderFilters();
      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
