r": "이효진,김수민", "source": "메리츠증권", "company_name": null, "stock_code": null, "industry_name": "인터넷 및 게임 산업", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "국내 인터넷 및 게임 산업은 기업별로 성장 및 수익성 전망이 크게 다르며, 일부는 이익 증가세가 기대되나 일부는 감소 추세다. 글로벌 빅테크 기업들은 매출과 영업이익이 지속 성장하는 가운데, 중국 기업은 이익 감소가 예상되어 지역별 시장 환경 및 정책 이슈가 산업에 영향을 미치고 있다. 투자자들은 산업 내 기업별로 수급과 실적 추세를 면밀히 분석하여 신중하게 대응할 필요가 있다.", "key_points": ["국내 주요 인터넷 및 게임 기업들의 2026~2027년 예상 매출 및 영업이익 증감률이 상이함, 일부 기업은 영업이익이 크게 증가하는 반면 일부는 감소세 예상.", "NAVER와 카카오 등 대형 인터넷 기업은 매출 성장이 예상되나, NAVER는 2026년과 2027년에 영업이익 변동률이 감소세 전망.", "게임사들의 매출과 영업이익 전망이 기업별로 편차가 크며, NC와 NHN 등은 2026~2027년에 영업이익 증가가 기대됨.", "글로벌 빅테크 기업들인 마이크로소프트, 아마존, 메타, 알파벳 등은 전반적으로 매출과 영업이익이 지속 증가하는 추세.", "중국 기업 알리바바, 바이두는 2026~2027년에 영업이익이 감소할 것으로 전망되어 글로벌 시장 내 차별화된 업황과 정책 영향이 예상됨.", "최근 국내 인터넷 및 게임 관련 종목들은 변동성이 커 보이며, 일부 기업은 단기적으로 주가 조정 국면을 경험 중.", "시장에서는 2026~2027년 산업 내 기업별 성장 및 수익성 전망에 따른 투자 전략 분화가 필요하다."], "risks": ["국내 게임 및 인터넷 업계는 일부 기업의 이익 변동성 확대가 투자 리스크로 작용.", "글로벌 경쟁 심화 및 일부 국가의 규제 정책이 산업 성장 모멘텀에 부정적 영향 가능성.", "글로벌 경제 환경 변화에 따른 소비 심리 위축이 산업 수요 둔화 위험 내포.", "신규 기술 도입 및 시장 트렌드 변화에 민감하여 기업별 체질 개선 및 대응 능력 필수."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652297.pdf", "json_path": "../reports_json/산업/652297.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652297"}, {"report_idx": "652296", "category": "산업", "published_at": "2026-09-14", "title": "깨어난 잠룡 : 2027년 상반기 금융주 투자전략", "author": "전배승, 전채원", "source": "LS증권", "company_name":  확률이 크게 상승하며, 금리 동결 가능성을 약화시키는 요인으로 작용하고 있다.", "key_points": ["8월 미국 소비자물가지수(CPI)가 월간 0.4%, 연간 3.4% 상승하며 예상에 부합함", "에너지 가격 반등이 헤드라인 CPI 상승을 견인, 최근 2개월간의 하방 압력 종료", "근원 CPI 월간 상승률이 예상과 전월치를 상회하며 물가 상승 압력 확대", "주거비 상승폭 확대 중 임대료 상승 둔화, 컴퓨터·스마트홈 기기 가격은 2개월 연속 큰 폭 상승", "근원 서비스 물가도 상승폭 확대, 통신·항공료·교육은 상승하나 의료·자동차보험은 하락", "AI 서버용 메모리 공급 제약으로 메모리 가격이 소비자 가격에 반영되는 추세", "유가 및 근원물가 상승으로 연준의 금리 동결 근거 약화, 9월 금리 인상 확률 70%대에서 87%로 상승"], "risks": ["유가 변동에 따른 물가 상승 위험 지속", "근원 물가 상승으로 인한 금리 인상 가능성 증가"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652295.pdf", "json_path": "../reports_json/산업/652295.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652295"}, {"report_idx": "652294", "category": "산업", "published_at": "2026-09-14", "title": "우주, 숫자는 지상에서 시작된다", "author": "김아영,박장욱", "source": "대신증권", "company_name": null, "stock_code": null, "industry_name": "우주산업", "market_topic": "글로벌 LEO 위성망 구축 경쟁 및 Ground Segment 투자 확대", "investment_opinion": null, "target_price": null, "summary": "글로벌 우주산업은 SpaceX를 비롯한 주요 국가들의 대규모 LEO 위성망 구축 경쟁에 힘입어 위성 인프라인 Ground Segment 투자가 구조적으로 확대되고 있다. 위성 수와 서비스 지역 증가에 따라 게이트웨이, 지상국, 안테나, RF 장비 등 지상 통신 인프라에 대한 수요가 빠르게 늘고 있으며, 한국은 5G 통신 인프라 제조 기반을 바탕으로 이 분야에서 경쟁력을 보유하고 있다. 6G·NTN 보급과 위성-지상망 통합이 기업 수혜를 더욱 확대할 전망이다. SpaceX 상장 기대감으로 우주산업 관련주가 조정을 겪고 있으나, 산업 펀더멘털과 국가 차원의 투자는 여전히 유효하다. 따라서 우주산업 내에서는 확장된 투자 기회인 Ground Segment를 중심으로 실제 수주와 매출 증가세가 확인되는 기업과 영역을 주목하는 전략이 요구된다.", "key_points": ["우주산업의 투자 기회가 위성 제작·발사체에서 위성 인프라인 Ground Segment(게이트웨이, 지상국, 안테나, RF장비)로 확장 중", "SpaceX의 발사비용 절감과 Starlink의 상업성 입증이 글로벌 LEO 위성망 경쟁 본격화 촉진", "국가 단위 대규모 LEO 위성망 구축 경쟁이 미국, 중국, 유럽, 한국 등으로 확대되며 위성 수 및 서비스 지역 증가에 따른 지상 인프라 투자 구조적으로 증가 전망", "한국은 통신 인프라 제조 기반 강점을 바탕으로 글로벌 위성망 확대 관련 장비 수요 선점 가능성", "6G 및 NTN 상용화 진행에 따라 위성통신 통합과 기존 통신 장비 수혜 예상", "Ground Segment 영역은 실제 수주와 매출이 빠르게 증가하며 우주산업 장기 성장성을 '숫자'로 확인할 수 있는 첫 영역", "SpaceX 상장 기대감으로 주가 과열 현상 후 조정 국면이나 산업 내 펀더멘털과 대규모 CAPEX 확대 방향성은 유지됨"], "risks": ["SpaceX 상장 이후 락업 해제 및 AI CAPEX·Starship R&D 등 단기 변수 존재", "주가 조정 국면으로 단기 투자 심리 변동성 위험", "글로벌 LEO 위성망 구축 경쟁의 높은 진입 장벽 및 국가 전략 경쟁 심화"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652294.pdf", "json_path": "../reports_json/산업/652294.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652294"}, {"report_idx": "652292", "category": "산업", "published_at": "2026-09-14", "title": "텍사스, 데이터센터와 재생에너지 급증", "author": "한병화", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "-", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "텍사스 주는 미국 내 데이터센터 누적 설치량이 2025년 말 기준 1위가 될 전망이며, 가스, 풍력, 태양광 등 전력 생산이 급속히 증가하는 가운데 태양광 발전 비중과 성장률이 특히 두드러진다. 이러한 전력 인프라 확충과 풍부한 재생에너지 자원 확보는 텍사스를 미국 데이터센터 산업의 핵심 거점으로 만들고 있다. 그러나 미국 중간선거 결과에 따라 데이터센터 건설을 둘러싼 지역 주민들 사이의 반발과 님비 현상이 심화될 수 있으며, 데이터센터 운영 기업들은 환경오염, 물 사용 문제, 전기요금 인상 등에 대한 명확한 해법을 제공하는 등 주민 설득 작업이 중요해지고 있다. 오라클의 스타게이트 프로젝트 사례처럼 재생에너지 투자를 통한 지속가능성 확보가 데이터센터 산업 성장의 새로운 표준으로 자리잡고 있음을 시사한다.", "key_points": ["텍사스가 2025년 말까지 미국 내 데이터센터 누적 설치량 1위 예상, 파이프라인 용량도 85.4GW로 2위 버지니아 대비 월등히 높음", "텍사스는 가스, 풍력, 태양광 발전량 급증 중이며, 2027년에는 풍력과 태양광 발전량이 가스 발전량을 추월할 전망", "태양광 발전은 2020~2025년 연평균 46% 성장으로 가장 빠른 증가율 기록", "텍사스가 미국 내 대규모 데이터센터(AIDC) 핵심 거점으로 자리잡은 이유는 전력 확보 용이성에 기인", "미국 중간선거 결과에 따라 AIDC에 대한 님비(NIMBY) 현상 심화 가능성, 사업자들은 주민 설득과 환경 문제 해결책 제시 필요", "오라클 스타게이트 프로젝트는 주민 반발로 인해 가스 발전을 연료전지와 재생에너지 투자로 대체, AIDC 산업은 지속가능성 확보 단계 진입"], "risks": ["미국 중간선거에 따른 AIDC 님비(NIMBY) 현상 심화 가능성", "지역 주민 반발로 인한 데이터센터 가동 및 건설 지연 리스크", "재생에너지 전환과 환경규제 강화에 따른 비용 부담 증가 가능성"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652292.pdf", "json_path": "../reports_json/산업/652292.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652292"}, {"report_idx": "652289", "category": "산업", "published_at": "2026-09-14", "title": "IFRS 18, 더 선명해질 이자부담", "author": "류태환,조유진", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "건설/부동산", "market_topic": "IFRS 18 도입과 시장금리 상승에 따른 건설업종 이자부담 및 영업실적 영향", "investment_opinion": null, "target_price": null, "summary": "2027년부터 의무 적용되는 IFRS 18은 손익계산서 수익과 비용을 영업, 투자, 재무 범주로 통일하여 재무비용 부담 비교를 명확하게 한다. 최근 건설업종은 차입금과 이자비용이 크게 증가한 가운데 시장금리도 가파르게 상승하여 재무비용 부담이 커지고 있어 당분간 순이익 정상화에 제약으로 작용할 전망이다. 이에 우량한 재무구조를 갖춘 일부 건설사의 상대적 투자 매력은 증가하고 있다. 아파트 매매가격은 수도권 중심으로 소폭 상승세이며, 주요 건설 프로젝트들도 차질 없이 진행 중이다. 다만, 높은 금리와 비용 부담이 실적 개선 속도를 늦출 리스크가 상존한다.", "key_points": ["IFRS 18은 2027년부터 시행되며, 손익계산서상 수익과 비용을 영업, 투자, 재무 범주로 일관되게 분류하여 손익구조 비교를 용이하게 함.", "최근 건설업계는 공사비 상승, 미분양 해소 지연, PF자금 소요 증가로 차입금과 이자비용 부담 확대.", "시장금리(AA-등급 3년 회사채 기준)는 작년 대비 약 180bp 상승하여 재무비용 부담 증가 유발.", "IFRS 18 도입으로 기업별 재무비용 부담 차이가 더욱 부각될 전망.", "영업이익은 개선되고 있으나 급등한 재무비용이 순이익 회복을 제약하고 있음.", "시장금리 상승은 재무구조 개선 지연 요인으로 작용.", "우량 재무구조를 가진 삼성E&A, DL이앤씨 등 상대적 투자 매력 상승.", "최근 아파트 매매가격지수는 수도권 중심으로 소폭 상승세 유지, 강원 동해·삼척, 수원 권선 등지 상승폭 두드러짐.", "대우건설 가덕도 신공항 기본설계 제출, GS 동해 AI 데이터센터 전력공급 심의 통과, DL이앤씨 송산2산단 AI 데이터센터 11월 착공 예정 등의 산업 내 주요 프로젝트 진행 중."], "risks": ["시장 금리 상승에 따른 차입금 이자비용 부담 증가로 순이익 회복 지연 가능성.", "건설업계 차입 구조와 만기 차이에 따른 개별 기업 간 재무비용 편차 확대.", "공사비 상승 및 미분양 문제 지속 시 실적 정상화 지연 우려."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/652289.pdf", "json_path": "../reports_json/산업/652289.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=652289"}, {"report_idx": "652288", "category": "산업", "published_at": "2026-09-14", "title": "중국,세금 우대도 리튱에서 소듐으로", "author": "황성현", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "-", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "중국 정부는 2026년부터 내수용 리튬이온 배터리에 대한 소비세 부과와 수출 부가가치세 환급 축소 등 세제 지원을 단계적으로 줄인다. 반면 소듐이온, 전고체 등 차세대 배터리 기술에는 면세 혜택을 유지하여 기술 전환을 촉진하는 방향으로 정책을 전환 중이다. 이에 따라 리튬이온 배터리 산업 내 수익성 격차가 커질 전망이며, 중소형 업체 부담이 상대적으로 크게 작용할 수 있다. 한국 에너지 산업에서는 핵연료 공급망 다변화, 대규모 송배전망 투자, 원자력 기술개발 협력 등이 활발하다. 전체적으로 중국 배터리 정책은 기존 리튬이온 배터리 지원을 축소하고 차세대 기술 육성에 집중하는 산업 구조 변화를 시사한다.", "key_points": ["중국 정부는 2026년부터 내수용 리튬이온 배터리에 소비세를 도입하며 2027년 4%로 인상할 계획임.", "소듐 이온, 전고체 배터리, 연료전지 등 차세대 배터리 기술은 2028년 말까지 면세 혜택을 유지함.", "배터리 수출에 대한 부가가치세 환급률이 2026년 9%에서 6%로 줄고, 202       return current === "전체"
        ? reports
        : reports.filter((item) => item.category === current);
    }

    function countByCategory(items) {
      const counts = {};
      for (const item of items) counts[item.category] = (counts[item.category] || 0) + 1;
      return counts;
    }

    function groupedData(items) {
      const groups = new Map();
      const industry = [];
      const market = [];

      for (const item of items) {
        if (item.category === "기업" && item.stock_code) {
          const key = item.stock_code;
          if (!groups.has(key)) {
            groups.set(key, {
              stock_code: item.stock_code,
              company_name: item.company_name || item.title,
              live_price: item.live_price,
              live_price_change: item.live_price_change,
              live_price_rate: item.live_price_rate,
              live_price_as_of: item.live_price_as_of,
              live_price_high_52w: item.live_price_high_52w,
              price_history: item.price_history || [],
              best_alpha_score: item.alpha_score,
              best_alpha_grade: item.alpha_grade,
              reports: [],
            });
          }
          const group = groups.get(key);
          if ((!group.price_history || !group.price_history.length) && item.price_history?.length) {
            group.price_history = item.price_history;
          }
          if ((item.alpha_score || -1) > (group.best_alpha_score || -1)) {
            group.best_alpha_score = item.alpha_score;
            group.best_alpha_grade = item.alpha_grade;
          }
          group.reports.push(item);
        } else if (item.category === "산업") {
          industry.push(item);
        } else {
          market.push(item);
        }
      }

      const groupedCompanies = Array.from(groups.values())
        .map((group) => ({
          ...group,
          reports: group.reports.sort((a, b) => {
            const scoreDiff = (b.alpha_score || -1) - (a.alpha_score || -1);
            if (scoreDiff !== 0) return scoreDiff;
            const sourceA = a.source || "";
            const sourceB = b.source || "";
            return sourceA.localeCompare(sourceB, "ko");
          }),
        }))
        .sort((a, b) => {
          const scoreDiff = (b.best_alpha_score || -1) - (a.best_alpha_score || -1);
          if (scoreDiff !== 0) return scoreDiff;
          const countDiff = b.reports.length - a.reports.length;
          if (countDiff !== 0) return countDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });

      return { groupedCompanies, industry, market };
    }

    function formatQuoteAsOf(value) {
      const text = safe(value);
      const matched = text.match(/(\d{4}\.\d{2}\.\d{2})/);
      if (matched) return `${matched[1].slice(2)} 장마감 기준`;
      return text
        .replace(/^현재가\s*/, "")
        .replace(/\s*기준(?:\(KRX 장마감\)|\(장마감\)|\(KRX장마감\)|\(KRX 마감\))?/g, "")
        .trim();
    }

    function priceDirectionClass(group) {
      const explicit = safe(group.live_price_direction).toLowerCase();
      if (explicit === "up" || explicit === "rise") return "up";
      if (explicit === "down" || explicit === "fall") return "down";

      const changeAmount = parsePriceValue(group.live_price_change);
      const changeRate = parsePriceValue(group.live_price_rate);
      if (Number.isFinite(changeAmount) && changeAmount < 0) return "down";
      if (Number.isFinite(changeRate) && changeRate < 0) return "down";
      if (Number.isFinite(changeAmount) && changeAmount > 0) return "up";
      if (Number.isFinite(changeRate) && changeRate > 0) return "up";

      const text = `${safe(group.live_price_change)} ${safe(group.live_price_rate)}`;
      if (text.includes("-")) return "down";
      return "";
    }

    function renderSparkline(history) {
      const values = (history || [])
        .map((item) => parsePriceValue(item.close))
        .filter((value) => Number.isFinite(value));
      if (values.length < 2) return "";

      const width = 220;
      const height = 40;
      const padding = 2;
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const range = Math.max(maxValue - minValue, 1);
      const points = values.map((value, index) => {
        const x = padding + ((width - padding * 2) * index) / (values.length - 1);
        const y = height - padding - ((value - minValue) / range) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const lastPoint = points[points.length - 1].split(",");
      const trendUp = values[values.length - 1] >= values[0];
      const stroke = trendUp ? "#0d7a5f" : "#ca6702";
      return `
        <div class="price-chart" aria-label="최근 3개월 주가 추이">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-hidden="true">
            <polyline fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${points.join(" ")}"></polyline>
            <circle cx="${lastPoint[0]}" cy="${lastPoint[1]}" r="2.8" fill="${stroke}"></circle>
          </svg>
        </div>
        <div class="price-caption">[3개월 주가 추이]</div>
      `;
    }

    function renderPriceBox(group) {
      if (!group.live_price) {
        return `
          <div class="price-box">
            <div class="price-label">현재가</div>
            <div class="price-main">조회 실패</div>
          </div>
        `;
      }

      const change = [safe(group.live_price_change), safe(group.live_price_rate)].filter(Boolean).join(" / ");
      const directionClass = priceDirectionClass(group);
      const high52w = safe(group.live_price_high_52w);
      return `
        <div class="price-box">
          <div class="price-label">${formatQuoteAsOf(group.live_price_as_of)}</div>
          <div class="price-main">${safe(group.live_price)}원</div>
          <div class="price-change ${directionClass}">${change}</div>
          ${high52w ? `<div class="price-extra">52주 최고가 ${high52w}원</div>` : ""}
          ${renderSparkline(group.price_history)}

    function renderAlphaBox(item) {
      if (item.alpha_score === null || item.alpha_score === undefined) return "";
      return `
        <div class="score-box">
          <div class="score-grade">Alpha ${safe(item.alpha_grade || "-")}</div>
          <div class="score-main">${safe(item.alpha_score)}</div>

        </div>

    function stockWebUrl(stockCode) {
      if (!stockCode) return "";
      return `https://finance.naver.com/item/main.naver?code=${encodeURIComponent(stockCode)}`;
    }

    async function copyStockCode(stockCode) {
      if (!stockCode) return;
      try {
        await navigator.clipboard.writeText(String(stockCode));
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = String(stockCode);
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      alert(`종목코드 복사: ${stockCode}`);
    }

    async function fetchReportsForDate(date) {
      if (!date) return [];
      if (reportCache.has(date)) return reportCache.get(date) || [];
      try {
        const response = await fetch(`./archive/${date}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const nextReports = payload.reports || [];
        reportCache.set(date, nextReports);
        return nextReports;
      } catch (error) {
        return null;
      }
    }

    async function ensureHistoryLoaded() {
      if (historyLoaded) return true;
      for (const date of availableDates) {
        const loaded = await fetchReportsForDate(date);
        if (loaded === null) return false;
      }
      historyLoaded = true;
      return true;
    }

    function allCachedReports() {
      return Array.from(reportCache.values()).flat();
    }

    function stockCatalog() {
      const grouped = new Map();
      for (const item of allCachedReports()) {
        if (item.category !== "기업" || !item.stock_code) continue;
        const key = item.stock_code;
        if (!grouped.has(key)) {
          grouped.set(key, {
            stock_code: item.stock_code,
            company_name: item.company_name || item.title || item.stock_code,
            report_count: 0,
            dates: new Set(),
            latest_date: item.published_at || "",
          });
        }
        const stock = grouped.get(key);
        stock.report_count += 1;
        if (item.company_name) stock.company_name = item.company_name;
        if (item.published_at) stock.dates.add(item.published_at);
        if ((item.published_at || "") > stock.latest_date) stock.latest_date = item.published_at || "";
      }
      return Array.from(grouped.values());
    }

    function renderSearchResults(htmlText) {
      document.getElementById("search-results").innerHTML = htmlText;
    }

    function renderHistoryEmpty(message) {
      const root = document.getElementById("history-section");
      root.innerHTML = `<div class="history-empty">${safe(message)}</div>`;
    }

    function matchingStocks(query) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return [];
      return stockCatalog()
        .map((item) => {
          const name = String(item.company_name || "").toLowerCase();
          const code = String(item.stock_code || "").toLowerCase();
          let score = -1;
          if (code === keyword) score = 100;
          else if (name === keyword) score = 95;
          else if (code.startsWith(keyword)) score = 80;
          else if (name.startsWith(keyword)) score = 70;
          else if (code.includes(keyword)) score = 60;
          else if (name.includes(keyword)) score = 50;
          return { ...item, score };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => {
          const scoreDiff = b.score - a.score;
          if (scoreDiff !== 0) return scoreDiff;
          const dateDiff = (b.latest_date || "").localeCompare(a.latest_date || "");
          if (dateDiff !== 0) return dateDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });
    }

          return String(b.report_idx || "").localeCompare(String(a.report_idx || ""));

    async function runStockSearch() {
      const input = document.getElementById("stock-search");
      const query = String(input.value || "").trim();
      if (!query) {
        renderSearchResults("");
        renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
        return;
      }

      renderSearchResults('<span class="badge">아카이브 확인 중...</span>');
      const loaded = await ensureHistoryLoaded();
      if (!loaded) {
        renderSearchResults("");
        renderHistoryEmpty("아카이브를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      const matches = matchingStocks(query).slice(0, 12);
      if (!matches.length) {
        renderSearchResults("");
        renderHistoryEmpty(`"${query}"와 일치하는 종목 이력이 없습니다.`);
        return;
      }

      renderSearchResults(
        matches
          .map(
            (item) => `
              <button type="button" data-stock-history="${safe(item.stock_code)}">
                ${safe(item.company_name)} (${safe(item.stock_code)}) · ${item.report_count}건
              </button>
            `
          )
          .join("")
      );
      renderHistoryForStockCompact(matches[0].stock_code);
    }

        sections.push(`<div class="factor-box"><div class="factor-title">Revision Signal</div><p class="factor-text">${safe(item.revision_signal)}</p></div>`);
      }
      if (item.structural_growth_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Structural Growth</div><p class="factor-text">${safe(item.structural_growth_signal)}</p></div>`);
      }
      if (item.valuation_risk_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Valuation / Risk</div><p class="factor-text">${safe(item.valuation_risk_signal)}</p></div>`);
      }
      const positiveText = (item.positive_factors || []).map((value) => `+ ${safe(value)}`).join("<br>");
      const negativeText = (item.negative_factors || []).map((value) => `- ${safe(value)}`).join("<br>");

        sections.push(`<div class="factor-box"><div class="factor-title">Positive Factors</div><p class="factor-text">${positiveText}</p></div>`);

      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
</html>
