arket_topic": "글로벌 탄소배출권 가격 동향, 에너지 원자재 가격 변동, 탄소배출권 ETF/ETN 현황, 탄소시장 정책 및 구조적 변화", "investment_opinion": null, "target_price": null, "summary": "글로벌 탄소배출권 시장은 유럽 및 미국 중심으로 가격 변동성이 존재하며, 아시아와 중국 시장은 혼재된 흐름을 나타내고 있다. 에너지 원자재 가격은 원유 가격 하락과 천연가스 및 전력가격 상승이 공존하는 국면으로, 시장 내 복합적인 요인 작용 중이다. 한국을 포함한 9개국이 2027년 글로벌 탄소시장 구축을 목표로 협력 중이나, 한국의 온실가스 감축 정책 신뢰도 문제 및 공급 과잉 우려에 따른 국제 유가 혼조가 단기 리스크로 작용한다. 전반적으로 탄소배출권과 에너지 가격, 정책 체인 이슈가 연계된 복합 산업 환경이 지속되고 있다.", "key_points": ["글로벌 주요 배출권(EUA, UKA, RGGI 등) 가격은 최근 1개월 내 유럽과 미국 중심으로 변동성이 존재하며, 아시아 및 중국 현물시장은 혼조세를 보임.", "에너지 원자재(원유, 천연가스, 석탄 등) 가격은 최근 3개월간 원유 가격 하락과 천연가스, 유럽 전력가격 상승세가 상반되는 움직임을 나타냄.", "국내외 탄소배출권 관련 ETF/ETN은 전반적으로 소폭 변동하며 총자산 규모는 안정적 수준 유지.", "한국을 포함한 글로벌 9개국이 2027년까지 글로벌 탄소시장 구축 및 발행기구 설립을 본격 추진 중이며, 한국은 해외 온실가스 감축 의존 및 NDC 워싱 문제 지적됨.", "국제 유가는 공급 과잉 전망에 따른 혼조 마감으로 시장 불확실성 존재."], "risks": ["탄소시장 가격 변동성 및 지역별 정책 차이로 인한 시장 불확실성 존재.", "한국의 해외 감축 의존과 NDC 워싱 이슈가 정책 신뢰도에 부정적 영향 가능성.", "글로벌 에너지 공급 상황 변화에 따른 원자재 가격 급변 위험."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654269.pdf", "json_path": "../reports_json/산업/654269.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654269"}, {"report_idx": "654258", "category": "산업", "published_at": "2026-11-16", "title": "소부장, 캐파의 시간", "author": "백길현, 임석민", "source": "유안타증권", "company_name": null, "stock_code": null, "industry_name": "-", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "2027년 반도체 소부장 산업은 수요 대비 생산능력(캐파) 확대가 실적의 핵심 변수이며, 주요 기업들은 증설과  발생함.", "GPU 세대 교체로 토큰 처리량은 최대 50배 증가했으나, 태스크당 요구 토큰량 증가로 인프라가 여전히 병목 현상임.", "2026년 중반부터 중국 대형 언어 모델(LLM) 부상과 에이전트 도입으로 모델 간 락인(lock-in) 현상이 약화되면서 토큰 시장이 인플레이션에서 디플레이션으로 전환될 전망임.", "앤트로픽은 10월 26일 공개 S-1 제출 후 나스닥 상장을 추진 중이며, 희망 공모가는 주당 70~78달러, 완전 희석 기준 시가총액은 약 1.26~1.4조 달러임.", "2026년, AI 관련 빅4 회사의 채권 발행이 105억 달러에서 2600억 달러로 급증하였으나, 데이터센터 CapEx 회수 기간이 단축되어 부채 위기는 낮음.", "미국 중간선거 후 민주당 승리로 DC 건설 규제가 강화되어 Meta, 코어위브 등 해외 확장 검토 중이며, 국내는 AIDC 요금 인하와 GPUaaS 수요 증가로 NHN, 삼성SDS, 네이버 등이 수혜를 볼 것으로 예상됨."], "risks": ["컴퓨팅 비용 상승과 토큰 가격 인하에 따른 수익성 악화 위험", "장기적으로 자본 비용 상승과 수익성 기준 강화로 현금 흐름이 없는 플랫폼의 생존 위협", "미국 데이터센터 관련 규제 강화에 따른 확장 비용 및 송전 비용 부담 증가"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654224.pdf", "json_path": "../reports_json/산업/654224.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654224"}, {"report_idx": "654223", "category": "산업", "published_at": "2026-11-16", "title": "inernet/game coverage at at glance", "author": "이효진,김수민", "source": "메리츠증권", "company_name": null, "stock_code": null, "industry_name": "인터넷 및 게임 산업", "market_topic": "국내외 주요 인터넷 및 게임 기업의 실적과 주가 동향, 업황 변화", "investment_opinion": null, "target_price": null, "summary": "본 보고서는 국내외 인터넷 및 게임 산업의 주요 기업들의 실적 전망과 주가 변화를 중심으로 시장 현황을 분석하였다. 국내 기업은 영업이익 변동률이 기업별로 크게 다르며, 일부는 성장세를 유지하나 전반적으로 주가와 시가총액은 하락 추세를 보이고 있다. 글로벌 주요 기업들도 혼재된 실적을 보이며, 특히 중국 기업들의 하락폭이 크다. 시장 내 경쟁과 규제 환경, 신작 출시 일정 등이 주요 변수로 작용하고 있으며, 경기 변동과 지정학적 리스크가 산업 성장에 부정적 요인으로 작용할 가능성이 크다. 투자 판단에 있어서는 이러한 업황 및 리스크 요인들을 면밀히 고려할 필요가 있다.", "key_points": ["국내 주요 인터넷 및 게임 기업들의 2026년과 2027년 영업이익 변동률은 기업별로 상이하게 나타나며, 일부 기업은 큰 폭의 증가를 예상하지만 다수는 하락세를 보임.", "국내 게임사 및 인터넷 기업의 시가총액은 최근 1년간 상당한 변동을 겪었으며, 연초 대비 전반적으로 감소하는 추세를 보임.", "글로벌 IT 및 게임 기업들 역시 매출과 영업이익에서 증가세와 감소세가 혼재되어 있으며, 알리바바와 바이두 등 일부 중국 기업은 큰 폭의 실적 둔화를 예상하고 있음.", "미국, 중국, 일본 등 글로벌 주요 기업들의 매출 및 영업이익 전망치는 대체로 증가 추세이나, 일부 기업은 부진한 성과가 전망됨.", "시장 내 신작 출시, 사업 다각화 및 신기술 도입 등이 기업별 실적 및 주가 변동에 영향을 미치고 있음."], "risks": ["국내외 경기 변동 및 소비심리 악화에 따른 매출 및 수익성 저하 위험.", "중국 규제 강화 및 미중 무역 갈등 등의 지정학적 리스크.", "경쟁 심화에 따른 시장 점유율 감소 가능성.", "신작 게임 및 서비스 출시 지연에 따른 성장 모멘텀 상실 위험."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654223.pdf", "json_path": "../reports_json/산업/654223.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654223"}, {"report_idx": "654219", "category": "산업", "published_at": "2026-11-16", "title": "K-AMPC가 현실화되면? 세액공제 규모 1.5조원 추정", "author": "김귀연,박서영", "source": "대신증권", "company_name": null, "stock_code": null, "industry_name": "자동차/부품", "market_topic": "K-AMPC 세액공제, 전기차 포함법 개정 논의 및 시장 영향", "investment_opinion": null, "target_price": null, "summary": "자동차 업종은 2026년 시장 조정과 매크로 리스크로 주가 하락세이나, 국내생산세액공제(K-AMPC)에 전기차 포함이 법안으로 현실화될 경우 약 1.5조원 규모의 세액공제 혜택으로 현대차·기아 지배순익 대비 5~15%의 긍정적 영향을 받을 전망이다. 현재 관련 법안 3건이 소관위에 상정되어 연내 통과 가능성이 있으며, 2027년 1월 시행이 예상된다. 투자자들은 K-AMPC 세법 개정, 휴머노이드 서밋, CES 2027 등의 모멘텀에 주목할 필요가 있다. 다만 법안 처리 불확실성과 매크로 환경 리스크는 여전히 존재한다.", "key_points": ["2026년 이후 자동차 업종은 시장 조정과 기관·외국인 매도세 지속으로 주가 하락 중.", "국내생산세액공제(K-AMPC)에 전기차 포함시 세액공제 규모 약 1.5조원 추정, 현대차·기아 지배순익 대비 5~15% 수준의 긍정 영향 예상.", "K-AMPC 입법 개정안 5건 중 3건 소관위 상정, 2026년 말 법안 통과 후 2027년 시행 가능성.", "자동차 업종 단기 주가 반등을 견인할 수 있는 주요 모멘텀으로 1) K-AMPC 세법 개정, 2) 12월 휴머노이드 서밋, 3) 2027년 1월 CES 행사.", "자동차 업종 밸류에이션은 12MF PER 6.0배, PBR 0.5배로 낮은 수준 유지 중."], "risks": ["법안 통과 시점 및 최종 내용 변동에 따른 불확실성.", "매크로 변수(금리, 지정학적 리스크) 및 판매·수익성 둔화 지속 가능성.", "기관 및 외국인의 매도세가 장기화될 경우 업종 주가 약세 지속 우려."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/654219.pdf", "json_path": "../reports_json/산업/654219.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=654219"}, {"report_idx": "654213", "category": "산업", "published_at": "2026-11-16", "title": "데이터센터 모멘텀 확대의 조건", "author": "류태환,조유진", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "데이터센터", "market_topic": "글로벌 AI 컴퓨팅 수요와 국내 데이터센터 개발 모멘텀 확대 가능성", "investment_opinion": null, "target_price": null, "summary": "국내 데이터센터 산업은 글로벌 AI 컴퓨팅 수요에 의한 모멘텀 확대 가능성을 갖고 있으나, 현재는 최종 수요처의 불확실성과 글로벌 기업의 실제 국내 대규모 임차계약 미확인으로 성장 모멘텀은 제한적임. 미국 내 규제 강화 움직임이 해외 투자 확대를 촉진할 수 있으나, 국내에서는 글로벌 AI 기업의 계약 사례가 확인되어야 시장 신뢰도와 건설사 수주 기대감이 높아질 전망이다. 데이터센터는 수백MW에서 GW급으로 대형화하며 비수도권 확장 및 공정 단축이 진행 중이며, 이는 건설사 외형 성장에 일부 기여할 것으로 예상된다. 다만, 최종 수요처 검증이 이루어지지 않을 경우 성장 기대감은 약화될 수 있다.", "key_points": ["국내 데이터센터 개발이 증가하고 있으나, 최종 수요처의 불확실성으로 모멘텀이 약함", "미국 중간선거 이후 데이터센터 개발 규제 강화가 예상되어 글로벌 AI 기업들의 해외 투자 확대 기대", "국내 클라우드 사업자만으론 대규모 데이터센터 개발 기대 충족 어려움", "글로벌 하이퍼스케일러(AWS, Microsoft, Google 등)의 국내 진출은 고객 대상 클라우드 서비스 중심으로 AI 컴퓨팅 수요와 직결되지 않음", "대규모 AI 컴퓨팅 수요를 국내에서 임차계약으로 확       if (!Number.isFinite(livePrice) || !Number.isFinite(targetPrice) || livePrice <= 0) {

      const diff = targetPrice - livePrice;
      return {

    function renderSparkline(history) {
      const values = (history || [])
        .map((item) => parsePriceValue(item.close))
        .filter((value) => Number.isFinite(value));
      if (values.length < 2) return "";

      const width = 220;
      const height = 40;
      const padding = 2;
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const range = Math.max(maxValue - minValue, 1);
      const points = values.map((value, index) => {
        const x = padding + ((width - padding * 2) * index) / (values.length - 1);
        const y = height - padding - ((value - minValue) / range) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const lastPoint = points[points.length - 1].split(",");
      const trendUp = values[values.length - 1] >= values[0];
      const stroke = trendUp ? "#0d7a5f" : "#ca6702";
      return `

      `;
    }

    function renderHistoryForStockCompact(stockCode) {
      const entries = allCachedReports()
        .filter((item) => item.stock_code === stockCode)
        .sort((a, b) => {
          const dateDiff = (b.published_at || "").localeCompare(a.published_at || "");
          if (dateDiff !== 0) return dateDiff;
          return String(b.report_idx || "").localeCompare(String(a.report_idx || ""));
        });
      const root = document.getElementById("history-section");
      if (!entries.length) {
        renderHistoryEmpty("?대떦 醫낅ぉ????λ맂 ?대젰???놁뒿?덈떎.");
        return;
      }

      const companyName = entries.find((item) => item.company_name)?.company_name || stockCode;
      const uniqueDates = new Set(entries.map((item) => item.published_at).filter(Boolean));
      const bestEntry = entries.find((item) => item.alpha_score !== null && item.alpha_score !== undefined);
      const cards = entries.map((item) => renderHistoryReportCardCompact(item)).join("");

      root.innerHTML = `
        <article class="group-card history-group-card">
          <div class="group-head">
            <div>
              <div class="group-title-row">
                <h2 class="group-title">${safe(companyName)}</h2>
              </div>
            </div>
          </div>
          <div class="group-meta">
            <span class="pill"><button type="button" data-copy-stock="${safe(stockCode)}">종목코드 복사</button></span>
            <span class="pill"><a href="${stockWebUrl(stockCode)}" target="_blank" rel="noreferrer">네이버금융</a></span>
          </div>
          <div class="report-stack">${cards}</div>
        </article>
      `;
    }

    async function runStockSearch() {
      const input = document.getElementById("stock-search");
      const query = String(input.value || "").trim();
      if (!query) {
        renderSearchResults("");
        renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
        return;
      }

      renderSearchResults('<span class="badge">아카이브 확인 중...</span>');
      const loaded = await ensureHistoryLoaded();
      if (!loaded) {
        renderSearchResults("");
        renderHistoryEmpty("아카이브를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      const matches = matchingStocks(query).slice(0, 12);
      if (!matches.length) {
        renderSearchResults("");
        renderHistoryEmpty(`"${query}"와 일치하는 종목 이력이 없습니다.`);
        return;
      }

      renderSearchResults(
        matches
          .map(
            (item) => `
              <button type="button" data-stock-history="${safe(item.stock_code)}">
                ${safe(item.company_name)} (${safe(item.stock_code)}) · ${item.report_count}건
              </button>
            `
          )
          .join("")
      );
      renderHistoryForStockCompact(matches[0].stock_code);
    }

    function renderFactorSections(item) {
      if (item.category !== "기업") return "";
      const sections = [];
      if (item.revision_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Revision Signal</div><p class="factor-text">${safe(item.revision_signal)}</p></div>`);
      }
      if (item.structural_growth_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Structural Growth</div><p class="factor-text">${safe(item.structural_growth_signal)}</p></div>`);
      }
      if (item.valuation_risk_signal) {
        sections.push(`<div class="factor-box"><div class="factor-title">Valuation / Risk</div><p class="factor-text">${safe(item.valuation_risk_signal)}</p></div>`);
      }
      const positiveText = (item.positive_factors || []).map((value) => `+ ${safe(value)}`).join("<br>");
      const negativeText = (item.negative_factors || []).map((value) => `- ${safe(value)}`).join("<br>");
      if (positiveText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Positive Factors</div><p class="factor-text">${positiveText}</p></div>`);
      }
      if (negativeText) {
        sections.push(`<div class="factor-box"><div class="factor-title">Negative Factors</div><p class="factor-text">${negativeText}</p></div>`);
      }
      if (item.market_reaction_placeholder) {
        sections.push(`<div class="factor-box"><div class="factor-title">Market Reaction</div><p class="factor-text">D+1 / D+5 / D+20 추후 연결 예정</p></div>`);
      }
      return sections.length ? `<div class="factor-grid">${sections.join("")}</div>` : "";
    }

    function renderGrouped(items) {
      const root = document.getElementById("list");
      const { groupedCompanies, industry, market } = groupedData(items);

      const groupCards = groupedCompanies.map((group) => {
        const reportsHtml = group.reports.map((report) => {
          const pointItems = (report.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
          return `
            <details class="report-detail">
              <summary>
                <div>
                  <div>${safe(report.title)}</div>
                  <div class="report-brief">${[
                    safe(report.source),
                    safe(report.author),
                    [safe(report.investment_opinion), safe(report.target_price)].filter(Boolean).join(" "),
                    upsideLabel(report),
                  ].filter(Boolean).join(" · ")}</div>
                </div>
                <div>
                  ${report.alpha_score !== null && report.alpha_score !== undefined ? `<div class="badge">${safe(report.alpha_grade || "-")} ${safe(report.alpha_score)}</div>` : ""}
                  <div class="badge">#${safe(report.report_idx)}</div>
                </div>
              </summary>
              <div class="report-body">
                <p class="summary">${safe(report.summary)}</p>
                ${pointItems ? `<ul class="points">${pointItems}</ul>` : ""}
                ${renderFactorSections(report)}
                <div class="links">
                  <a href="${safe(report.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
                </div>
              </div>
            </details>
          `;
        }).join("");

        return `
          <article class="group-card">
            <div class="group-head">
              <div>
                <div class="group-title-row">
                  <h2 class="group-title">${safe(group.company_name)}</h2>
                  ${renderPriceBox(group)}
                </div>
              </div>
            </div>
            <div class="group-meta">
              ${group.stock_code ? `<span class="pill"><button type="button" data-copy-stock="${safe(group.stock_code)}">종목코드 복사</button></span>` : ""}
              ${group.stock_code ? `<span class="pill"><a href="${stockWebUrl(group.stock_code)}" target="_blank" rel="noreferrer">네이버금융</a></span>` : ""}
            </div>
            <div class="report-stack">${reportsHtml}</div>
          </article>
        `;
      }).join("");

      const renderStandaloneSection = (title, entries) => entries.length
        ? `
          <div class="section-title">${title}</div>
          ${entries.map((item) => `
            <article class="card">
              <div class="row">
                <span class="badge">${safe(item.category)}</span>
                <span class="badge">${safe(item.published_at)}</span>
                <span class="badge">#${safe(item.report_idx)}</span>
              </div>
              <h2 class="title">${safe(item.title)}</h2>
              <div class="meta">작성자 ${safe(item.author)} · 출처 ${safe(item.source)}${item.market_topic ? ` · 주제 ${safe(item.market_topic)}` : ""}${item.industry_name ? ` · 산업 ${safe(item.industry_name)}` : ""}</div>
              <p class="summary">${safe(item.summary)}</p>
              ${renderFactorSections(item)}
              <div class="links">
                <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
              </div>
            </article>
          `).join("")}
        `
        : "";

      root.innerHTML = groupCards
        + renderStandaloneSection("산업 리포트", industry)
        + renderStandaloneSection("시장 리포트", market);
    }

    function renderList(items) {
      const root = document.getElementById("list");
      root.innerHTML = items.map((item) => {
        const meta = [
          item.author ? `작성자 ${item.author}` : "",
          item.source ? `출처 ${item.source}` : "",
          item.company_name ? `회사 ${item.company_name}` : "",
          item.stock_code ? `코드 ${item.stock_code}` : "",
          item.industry_name ? `산업 ${item.industry_name}` : "",
          item.market_topic ? `주제 ${item.market_topic}` : "",
          item.investment_opinion ? `의견 ${item.investment_opinion}` : "",
          item.target_price ? `목표가 ${item.target_price}` : "",
          upsideLabel(item),
          item.alpha_score !== null && item.alpha_score !== undefined ? `Alpha ${item.alpha_grade || "-"} ${item.alpha_score}` : "",
          item.live_price ? `현재가 ${item.live_price}원` : "",
        ].filter(Boolean).join(" · ");
        const points = (item.key_points || []).slice(0, 4).map((point) => `<li>${safe(point)}</li>`).join("");
        return `
          <article class="card">
            <div class="row">
              <span class="badge">${safe(item.category)}</span>
              <span class="badge">${safe(item.published_at)}</span>
              <span class="badge">#${safe(item.report_idx)}</span>
            </div>
            <h2 class="title">${safe(item.title)}</h2>
            <div class="meta">${meta}</div>
            ${renderAlphaBox(item)}
            <p class="summary">${safe(item.summary)}</p>
            ${points ? `<ul class="points">${points}</ul>` : ""}
            ${renderFactorSections(item)}
            <div class="links">
              <a href="${safe(item.pdf_url)}" target="_blank" rel="noreferrer">원문 링크</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function render() {
      renderModes();
      renderDateOptions();
      renderFilters();
      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
</html>
