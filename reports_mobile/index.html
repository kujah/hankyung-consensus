pdf?report_idx=653036"}, {"report_idx": "653035", "category": "산업", "published_at": "2026-10-16", "title": "[은행] 9월 여수신 동향 – 조달 포트폴리오 악화 지속", "author": "장영임", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "은행", "market_topic": "9월 은행 여수신 동향 및 조달 포트폴리오 변화", "investment_opinion": null, "target_price": null, "summary": "2026년 9월 은행 대출은 대기업 대출을 중심으로 전년 대비 4.4% 증가했으며, 가계 대출은 주택담보대출 중심으로 소폭 상승했다. 수신 측면에서는 요구불예금과 수시입출식 예금이 증가했으나 저원가성 예금 비중은 3개월 연속 하락해 조달 포트폴리오가 악화되는 상황이다. 이러한 조달 구조의 악화는 은행의 NIM 하락으로 이어질 가능성이 높아 향후 조달 포트폴리오 개선이 중요한 과제로 남아있다. 기업 대출은 대기업 중심으로 강한 성장세를 보이나, 가계 일반대출은 금리 상승과 주식시장 위축 영향으로 감소세를 나타내고 있다.", "key_points": ["9월 은행 대출은 2,640조원으로 전년 대비 4.4% 증가, 대기업 대출이 성장 주도", "중소기업 대출과 SOHO 대출은 완만한 증가세, 가계대출은 주택담보대출 중심으로 소폭 증가", "9월 은행 수신은 2,622조원으로 전년 대비 4.3% 증가, 요구불예금과 수시입출식 예금 증가하였으나 정기예금도 증가 중", "저원가성 예금 비중 36.9%로 3개월 연속 감소해 조달 포트폴리오가 악화되는 추세", "조달 포트폴리오 악화는 은행 NIM 하락으로 이어질 가능성이 높아 향후 개선이 필요함"], "risks": ["조달 포트폴리오 악화에 따른 은행 NIM 하락 위험", "수요 둔화와 금리 상승 영향으로 가계 일반대출 감소세 지속 가능성", "계절성이 반영된 수시입출식 예금 변동성"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/653035.pdf", "json_path": "../reports_json/산업/653035.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653035"}, {"report_idx": "653034", "category": "산업", "published_at": "2026-10-16", "title": "Global Carbon Daily", "author": "최관순", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "-", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "본 산업 리포트는 글로벌 탄소배출권 및 에너지 시장의 최근 동향과 주요 이슈를 다루고 있다. 유럽과 영국을 중심으로 한 배출권 가격은 최근 상승세를 이어가고 있으며, 한국 내 온실가스 저감 인증실적 가격도 크게 상승하였다. 한편, 국제 원유와 석탄, 천연가스 등 에너지 가격은 지정학적 긴장과 공급 우려 속에 혼조세를 보이고 있다. 해외 온실가스 감축량 부풀리기 문제와 정책적 불확실성 등은 수급과 가격 변동성에 영향을 미칠 것으로 전망된다. 지역별로 정책과 시장 상황이 상이해 글로벌 탄소배출권 시장은 국지적 차별화와 체인 이슈가 존재하며, 이는 투자 및 시장 운영에 있어 주요 리스크 요소가 될 수 있다.", "key_points": ["글로벌 탄소배출권 가격은 유럽(EUA), 영국(UKA), 미국(RGGI, CCA), 한국(KAU, KOC, i-KOC), 중국(CEA) 등 지역별로 차별화된 움직임을 보임.", "최근 3개월간 유럽과 영국 배출권 가격이 각각 8.5%, 8.2% 상승하는 등 상승세를 나타내고 있으나 단기(1일~1주) 내 조정 움직임도 관찰됨.", "한국 내 온실가스 저감 인증실적(KOC, i-KOC) 가격은 최근 3개월간 크게 상승하는 등 수급 면에서 강한 모멘텀 지속.", "글로벌 에너지 가격은 원유(WTI, 브렌트), 천연가스, 석탄 등 주요 원자재 가격이 혼조세를 보이며 천연가스와 석탄은 일부 지역에서 강한 상승 추세를 나타냄.", "특히 석탄 가격이 호르무즈 해협 봉쇄 우려로 인해 40% 이상 급등하며 연료 가격 변동성이 확대되고 있음.", "탄소배출권 관련 ETF 및 ETN은 일부 하락세이나 총자산 규모는 큰 변동 없으며, 투자자 관심은 여전히 유지되고 있음.", "배출권 및 에너지 시장과 관련한 정책적 불확실성 및 환경 규제 강화 이슈가 지속적으로 부각되고 있음.", "해외 온실가스 감축량 부풀리기 문제 등 규제 및 투명성 문제에 대한 우려도 수급 및 가격 변동성에 영향.", "유럽, 미국, 중국, 한국 등 주요 시장 간 가격 차별화와 정책 차이로 글로벌 탄소배출권 시장은 국지적 가격 형성 및 체인 이슈가 존재.", "에너지 가격과 배출권 가격 간 상관관계가 있으나, 지역 및 정책별 다양한 변수에 의한 변동성 확대 전망."], "risks": ["정책 변화에 따른 배출권 가격 변동성 확대 가능성.", "글로벌 에너지 시장 불확실성 및 지정학적 리스크(예: 호르무즈 해협 봉쇄)로 인한 에너지 가격 급등락 가능성.", "온실가스 감축량 부풀리기 등 규제 투명성 문제로 시장 신뢰 저하 위험.", "지역별 배출권 가격 차별화에 따른 시장 혼란 가능성."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/653034.pdf", "json_path": "../reports_json/산업/653034.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653034"}, {"report_idx": "653033", "category": "산업", "published_at": "2026-10-16", "title": "[매수] 극단적 다운턴을 선반영하고 있는 주가. 업황은 여전히 강세", "author": "한동희", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "반도체", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "현재 한국 메모리 시장은 주가가 극단적인 다운턴을 선반영한 상황이나, 메모리 업황 펀더멘털은 지속적인 강세를 보이고 있다. 2027년 HBM4 등 고부가가치 제품의 가격 인상과 메모리 공급 부족 심화, 장기공급계약(LTA) 확대에 힘입어 실적 가시성이 높아지고 있으며 생산능력 잠김 현상이 사이클 진폭을 줄이고 가격 하단을 견고히 하고 있다. AI 시대를 맞아 메모리 수요는 지속 확대될 전망이며, 거시경제 불확실성에도 불구하고 메모리 업종은 실적 및 현금흐름 개선과 주주환원 강화로 긍정적 업황이 유지될 것으로 예상된다.", "key_points": ["현재 한국 메모리 공급업체들의 주가는 극단적인 다운턴을 선반영하고 있어 2010년 이후 최저 수준의 P/E를 나타냄", "메모리 업황은 거시경제 우려에도 불구하고 펀더멘털이 여전히 강세 국면임", "2027년 HBM4 가격 인상 및 메모리 공급 부족 심화로 실적 전망치가 지속 상향 조정 중", "DDR5 고용량 모듈의 현물 프리미엄이 크게 확대되어 AI 시대 메모리 수요를 반영함", "LTA (장기공급계약)의 본격화로 메모리 실적 가시성이 확대되고 가격 변동성이 감소함", "LTA는 생산능력 약정을 통해 사이클 진폭을 줄여 가격 하단을 견고히 함", "마이크론 등 주요 업체들이 장기계약에 차세대 신제품 가격 프리미엄을 반영중임", "메모리 업황 내에서는 가격 상승 폭 둔화가 자연스러우며, 구조적 현금창출력과 주주환원 강화가 예상됨", "AI 관련 메모리 수요 증가와 2027년 HBM4 가격 상승이 본격 반영되면서 서버 외 세그먼트에서도 가격 인상 기대됨", "업황 강세 지속되고 있으며, 10~11월 주요 메모리 및 빅테크 실적 발표를 통해 메모리 밸류에이션 매력 확인 가능할 전망"], "risks": [], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/653033.pdf", "json_path": "../reports_json/산업/653033.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653033"}, {"report_idx": "653019", "category": "산업", "published_at": "2026-10-16", "title": "투자손익 부진에도 보험손익은 점진적 개선", "author": "설용진", "source": "iM증권", "company_name": null, "stock_code": null, "industry_name": "손해보험", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "손해보험 산업은 2026년 3분기 신계약 물량 축소와 강화된 계리 가정으로 신계약 수익성이 제한적이나, 보험금 예실차 개선 및 자동차보험 손익 개선 등 보험손익은 점진적 개선 추세를 보이고 있다. 반면 투자손익은 증시 조정과 금리 상승 영향으로 단기적인 부진이 불가피하며, 해약환급금준비금 제도 개편은 보수적 접근이 요구되어 주주환원 측면 매력은 제한적이다. 시장금리 상승으로 방어주로서의 보험업종 가치가 부각되고, 본질적인 보험손익 개선 기대감은 2027년에도 이어질 것으로 전망된다. 주요 추천주는 DB손해보험이며, 삼성화재가 차선호주로 제시되었다.", "key_points": ["2026년 3분기 손해보험 4사 합산 당기순이익은 1.06조원으로 전년 대비 2% 감소 전망", "신계약 물량 축소 기조 지속, 신계약 환산배수는 강화된 계리적 가정으로 전분기 대비 축소 예상", "보험금 예실차 개선, 특히 도수치료 등 관리급여 항목 전환으로 손해율 완화 예상", "자동차보험 손익 개선 전망, 일반보험은 대형사고 재보험 방어 중이나 중형사고 영향과 IBNR 적립 발생 예상", "투자손익은 금리 상승과 증시 조정 영향으로 단기 부진 불가피, 보험금융비용 증가 예정", "해약환급금준비금 제도 개편은 보수적으로 접근, 법인세 부담 확대 우려로 주주환원 매력 제한적", "시장금리 상승으로 보험업종 방어주 역할 부각, 단기적 투자손익 부진과 실손 보험 손익 부담은 존재하나 보험손익 점진적 개선 기대 유지", "DB손해보험을 Top pick으로 추천하며 삼성화재는 차선호주로 평가"], "risks": ["투자손익 단기 부진 지속 가능성", "해약환급금준비금 제도 개편 영향 불확실성", "대형 및 중형 보험사고 발생 위험", "주주환원 제한 가능성"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/653019.pdf", "json_path": "../reports_json/산업/653019.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653019"}, {"report_idx": "653004", "category": "산업", "published_at": "2026-10-16", "title": "[IBKS Spot Comment] 천연고무 강세는 수요 전환보다 가격 협상에서 먼저 나타난다", "author": "이동욱", "source": "IBK투자증권", "company_name": null, "stock_code": null, "industry_name": "화학/고무산업", "market_topic": null, "investment_opinion": null, "target_price"     function filteredReports() {
      return current === "전체"
        ? reports
        : reports.filter((item) => item.category === current);
    }

    function countByCategory(items) {
      const counts = {};
      for (const item of items) counts[item.category] = (counts[item.category] || 0) + 1;
      return counts;
    }

    function groupedData(items) {
      const groups = new Map();
      const industry = [];
      const market = [];

      for (const item of items) {
        if (item.category === "기업" && item.stock_code) {
          const key = item.stock_code;
          if (!groups.has(key)) {
            groups.set(key, {
              stock_code: item.stock_code,
              company_name: item.company_name || item.title,
              live_price: item.live_price,
              live_price_change: item.live_price_change,
              live_price_rate: item.live_price_rate,
              live_price_as_of: item.live_price_as_of,
              live_price_high_52w: item.live_price_high_52w,
              price_history: item.price_history || [],
              best_alpha_score: item.alpha_score,
              best_alpha_grade: item.alpha_grade,
              reports: [],
            });
          }
          const group = groups.get(key);
          if ((!group.price_history || !group.price_history.length) && item.price_history?.length) {
            group.price_history = item.price_history;
          }
          if ((item.alpha_score || -1) > (group.best_alpha_score || -1)) {
            group.best_alpha_score = item.alpha_score;
            group.best_alpha_grade = item.alpha_grade;
          }
          group.reports.push(item);
        } else if (item.category === "산업") {
          industry.push(item);
        } else {
          market.push(item);
        }
      }

      const groupedCompanies = Array.from(groups.values())
        .map((group) => ({
          ...group,
          reports: group.reports.sort((a, b) => {
            const scoreDiff = (b.alpha_score || -1) - (a.alpha_score || -1);
            if (scoreDiff !== 0) return scoreDiff;
            const sourceA = a.source || "";
            const sourceB = b.source || "";
            return sourceA.localeCompare(sourceB, "ko");
          }),
        }))
        .sort((a, b) => {
          const scoreDiff = (b.best_alpha_score || -1) - (a.best_alpha_score || -1);
          if (scoreDiff !== 0) return scoreDiff;
          const countDiff = b.reports.length - a.reports.length;
          if (countDiff !== 0) return countDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });

      return { groupedCompanies, industry, market };
    }

    function formatQuoteAsOf(value) {
      const text = safe(value);
      const matched = text.match(/(\d{4}\.\d{2}\.\d{2})/);
      if (matched) return `${matched[1].slice(2)} 장마감 기준`;
      return text
        .replace(/^현재가\s*/, "")
        .replace(/\s*기준(?:\(KRX 장마감\)|\(장마감\)|\(KRX장마감\)|\(KRX 마감\))?/g, "")
        .trim();
    }

    function priceDirectionClass(group) {
      const explicit = safe(group.live_price_direction).toLowerCase();
      if (explicit === "up" || explicit === "rise") return "up";
      if (explicit === "down" || explicit === "fall") return "down";

      const changeAmount = parsePriceValue(group.live_price_change);
      const changeRate = parsePriceValue(group.live_price_rate);
      if (Number.isFinite(changeAmount) && changeAmount < 0) return "down";
      if (Number.isFinite(changeRate) && changeRate < 0) return "down";
      if (Number.isFinite(changeAmount) && changeAmount > 0) return "up";
      if (Number.isFinite(changeRate) && changeRate > 0) return "up";

      const text = `${safe(group.live_price_change)} ${safe(group.live_price_rate)}`;
      if (text.includes("-")) return "down";
      return "";
    }

    function renderSparkline(history) {
      const values = (history || [])
        .map((item) => parsePriceValue(item.close))
        .filter((value) => Number.isFinite(value));
      if (values.length < 2) return "";

      const width = 220;
      const height = 40;
      const padding = 2;
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const range = Math.max(maxValue - minValue, 1);
      const points = values.map((value, index) => {
        const x = padding + ((width - padding * 2) * index) / (values.length - 1);
        const y = height - padding - ((value - minValue) / range) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const lastPoint = points[points.length - 1].split(",");
      const trendUp = values[values.length - 1] >= values[0];
      const stroke = trendUp ? "#0d7a5f" : "#ca6702";
      return `
        <div class="price-chart" aria-label="최근 3개월 주가 추이">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-hidden="true">
            <polyline fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${points.join(" ")}"></polyline>
            <circle cx="${lastPoint[0]}" cy="${lastPoint[1]}" r="2.8" fill="${stroke}"></circle>
          </svg>
        </div>
        <div class="price-caption">[3개월 주가 추이]</div>
      `;
    }

    function renderPriceBox(group) {
      if (!group.live_price) {
        return `

            <div class="price-main">조회 실패</div>
          </div>
        `;
      }

      const change = [safe(group.live_price_change), safe(group.live_price_rate)].filter(Boolean).join(" / ");
      const directionClass = priceDirectionClass(group);
      const high52w = safe(group.live_price_high_52w);
      return `
        <div class="price-box">
          <div class="price-label">${formatQuoteAsOf(group.live_price_as_of)}</div>
          <div class="price-main">${safe(group.live_price)}원</div>

    function stockWebUrl(stockCode) {
      if (!stockCode) return "";
      return `https://finance.naver.com/item/main.naver?code=${encodeURIComponent(stockCode)}`;
    }

    async function copyStockCode(stockCode) {
      if (!stockCode) return;
      try {
        await navigator.clipboard.writeText(String(stockCode));
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = String(stockCode);
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      alert(`종목코드 복사: ${stockCode}`);
    }

    async function fetchReportsForDate(date) {
      if (!date) return [];
      if (reportCache.has(date)) return reportCache.get(date) || [];
      try {
        const response = await fetch(`./archive/${date}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const nextReports = payload.reports || [];
        reportCache.set(date, nextReports);
        return nextReports;
      } catch (error) {
        return null;
      }
    }

    async function ensureHistoryLoaded() {
      if (historyLoaded) return true;
      for (const date of availableDates) {
        const loaded = await fetchReportsForDate(date);
        if (loaded === null) return false;
      }
      historyLoaded = true;
      return true;
    }

    function allCachedReports() {
      return Array.from(reportCache.values()).flat();
    }

    function stockCatalog() {
      const grouped = new Map();
      for (const item of allCachedReports()) {
        if (item.category !== "기업" || !item.stock_code) continue;
        const key = item.stock_code;
        if (!grouped.has(key)) {
          grouped.set(key, {
            stock_code: item.stock_code,
            company_name: item.company_name || item.title || item.stock_code,
            report_count: 0,
            dates: new Set(),
            latest_date: item.published_at || "",
          });
        }
        const stock = grouped.get(key);
        stock.report_count += 1;
        if (item.company_name) stock.company_name = item.company_name;
        if (item.published_at) stock.dates.add(item.published_at);
        if ((item.published_at || "") > stock.latest_date) stock.latest_date = item.published_at || "";
      }
      return Array.from(grouped.values());
    }

    function renderSearchResults(htmlText) {
      document.getElementById("search-results").innerHTML = htmlText;
    }

    function renderHistoryEmpty(message) {
      const root = document.getElementById("history-section");
      root.innerHTML = `<div class="history-empty">${safe(message)}</div>`;
    }

    function matchingStocks(query) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return [];
      return stockCatalog()
        .map((item) => {
          const name = String(item.company_name || "").toLowerCase();
          const code = String(item.stock_code || "").toLowerCase();
          let score = -1;
          if (code === keyword) score = 100;
          else if (name === keyword) score = 95;
          else if (code.startsWith(keyword)) score = 80;
          else if (name.startsWith(keyword)) score = 70;
          else if (code.includes(keyword)) score = 60;
          else if (name.includes(keyword)) score = 50;
          return { ...item, score };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => {
          const scoreDiff = b.score - a.score;
          if (scoreDiff !== 0) return scoreDiff;
          const dateDiff = (b.latest_date || "").localeCompare(a.latest_date || "");
          if (dateDiff !== 0) return dateDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });
    }

    async function runStockSearch() {
      const input = document.getElementById("stock-search");
      const query = String(input.value || "").trim();
      if (!query) {
        renderSearchResults("");
        renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");

          .join("")

      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
</html>
