yung.com/analysis/downpdf?report_idx=653321"}, {"report_idx": "653320", "category": "산업", "published_at": "2026-10-27", "title": "Global Carbon Daily", "author": "최관순", "source": "SK증권", "company_name": null, "stock_code": null, "industry_name": "-", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "글로벌 탄소배출권 시장은 지역별로 다소 상이한 가격 움직임을 나타내고 있으나 대체로 안정적이거나 소폭 상승 중이다. 국제 에너지 가격은 최근 상승세를 이어가면서 탄소배출권 가격과 연동되는 모습을 보이나 단기적으로는 조정 국면에 있다. 유럽의 탄소규제 강화는 한국 철강 등 탄소집약적 산업에 부담 요인으로 작용하고 있으며, 국내에서는 2035년 탄소감축 목표 달성과 관련해 에너지 전환 속도와 비용 문제가 정책적 쟁점으로 부상하고 있다. 이러한 체인 이슈와 정책 환경 변화가 산업 전반의 수급과 밸류체인에 영향을 미치고 있다.", "key_points": ["글로벌 탄소배출권 가격은 유럽(88.2유로/톤), 영국(65.6파운드/톤), 미국 RGGI(39.8달러/톤), 캘리포니아 배출권(33달러/톤), 국내 배출권(KAU 29,950원/톤, KOC 30,000원/톤 등)에서 소폭 상승 또는 보합세를 나타냄.", "국제 에너지 가격은 원유(WTI, 브렌트), 천연가스, 유럽 전력, LNG 가격이 최근 3개월간 전반적으로 상승하는 흐름을 보였으나 최근 1~2일간은 약세를 기록함.", "탄소배출권 관련 ETF/ETN들은 대체로 소폭 상승세로 나타나며, 총자산 규모 변동은 미미함.", "정책 이슈로는 유럽의 탄소규제 장벽 강화로 인해 한국 철강 수출에 연간 약 1조원 수준의 타격 우려가 존재함.", "국내 국정감사에서는 2035년 탄소감축 목표와 전력망 부담 문제가 논란이 되었으며, 에너지 전환 속도와 비용 이슈가 중요하게 다뤄짐.", "탄소배출권 시장에서는 국내외 가격 추이 및 선물 시장 가격 동향이 지속적으로 관찰되고 있음."], "risks": ["유럽 탄소규제 강화로 인한 한국 산업의 수출 경쟁력 저하 및 관련 산업 타격 가능성.", "에너지 전환 과정에서 전력망 부담과 비용 증가에 따른 정책 및 산업적 불확실성.", "글로벌 에너지 가격 변동성에 따른 탄소배출권 가격 변동 영향."], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/653320.pdf", "json_path": "../reports_json/산업/653320.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653320"}, {"report_idx": "653315", "category": "산업", "published_at": "2026-10-27", "title": "[인터넷/게임] IBKS Daily", "author": "이승훈, 박상준", "source": "IBK투자증권", "company_name": null, "stock_code": null, "industry_name": "인터넷/게임", "market_topic": "국내외 인터넷 및 게임 산업 동향", "investment_opinion": null, "target_price": null, "summary": "국내 인터넷 및 게임 산업은 남미 지역 특히 브라질에 대한 진출 확대가 뚜렷한 성장 모멘텀으로 작용 중이다. 중남미는 인구 구성상 젊은 층이 많아 장기적 성장 잠재력이 높게 평가된다. 한편 금융 산업에서는 원화 스테이블코인의 제도화가 가시권에 들어왔으나 발행 주체와 구조를 둘러싼 논의가 계속되고 있다. 은행 컨소시엄 중심의 발행안이 유력하나 아직 확정되지 않았으며, 한국은행은 도입에는 찬성하나 금융시장 안정성 확보를 우선시하는 입장이다. 이러한 환경 변화가 인터넷과 게임, 핀테크 등 연계 산업에 영향을 미칠 전망이다.", "key_points": ["크래프톤이 남미 시장을 차세대 성장 시장으로 선정하고 내년 1월 브라질 현지법인 설립 추진 중", "중남미 인구 6억 명 이상의 젊은 시장으로 성장 잠재력 높음, 올해 브라질게임쇼에 한국공동관 마련 등 국내 게임사의 남미 진출 움직임 활발", "원화 스테이블코인 제도화 논의가 막바지 단계로 발행 주체 허용 범위가 핵심 쟁점", "은행이 지분 과반을 확보한 컨소시엄 중심 발행 허용 방안 논의 중이나 구체적 구조 미확정", "한국은행은 민간 원화 스테이블코인 도입에 기본 찬성하나 지급수단 확산에 따른 금융시장 및 통화정책 영향 우려로 은행 주도 컨소시엄 방식 강조"], "risks": [], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/653315.pdf", "json_path": "../reports_json/산업/653315.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653315"}, {"report_idx": "653309", "category": "산업", "published_at": "2026-10-27", "title": "PCB Tracker #2 전방위적 공급부족", "author": "고의영, 박정하", "source": "iM증권", "company_name": null, "stock_code": null, "industry_name": "PCB (인쇄회로기판) 산업", "market_topic": "전방위적인 공급 부족과 가격 상승, 지역별 수요 및 재고 변화에 따른 산업 내 구조적 변화", "investment_opinion": null, "target_price": null, "summary": "PCB 산업은 2026년 말 기준 전방위적인 공급 부족 상태를 유지하고 있으며, 한국, 대만, 일본 등 주요 생산국의 생산 및 판매 지표가 고르게 개선되고 있다. 그러나 대만의 전자광학 PMI 지표는 신규 주문과 수주잔고가 하락했으나 납기 및 가격은 여전히 고점에 머무르고 있다. 공급 능력이 수요 증가를 따라가지 못해 가격 결정력이 공급자에 유리하게 이동하고 있으며, 공급 부족은 IC기판을 넘어 메모리 기판과 소재 분야로 확대 중이다. 대만에서는 IC기판 재고가 판매보다 급증하면서 고사양 제품의 선제적 빌드업이 진행되고 있고, 일본은 가격 상승이 주된 성장을 이끈다. 한국 시장도 수출 면에서 ASP가 크게 상승하며 수익성이 개선되는 모습이다. 소재 측면에서는 ABF, BT, CCL 등의 가격이 2027년까지 분기별로 큰 폭으로 인상될 전망이며, 이로 인해 공급 위험과 함께 단기적인 수급 불균형이 지속될 가능성이 높다. AI 서버 수요 증가가 MLCC 수급 격차를 키우고 있으나 일반 스마트폰과 노트북용 수요는 부진하다. 이러한 산업 환경을 감안할 때 PCB 산업은 공급망 제약과 가격 상승이라는 구조적 변화를 겪으며, 관련 기업들은 2027년 실적 전망 상향 여지가 크다. 투자 관점에서는 해당 산업 전반의 체인 이슈 및 공급 상황 모니터링이 중요하다.", "key_points": ["PCB 업황 모멘텀 유지, 한국·대만·일본 생산·판매·수출 지표 개선 지속", "대만 전자광학 PMI 하락세지만 납기와 가격은 고점 유지, 공급부족 심화", "Nvidia 등 고객사의 캐파 증가 계획 있으나 증설 완료 시점은 2028년으로 2027년 공급 부족 예상", "공급 부족이 IC기판뿐 아니라 메모리 기판과 소재로 확산, 이에 따른 대규모 투자 진행 중", "대만 IC기판 재고액 증가가 판매액 증가율보다 커져 고사양 제품 선제적 빌드업 현상 관찰", "일본은 고가 고다층 PCB 생산과 단가 상승이 성장을 견인, AI 서버 공급망과 비AI 서버 공급망 차별화 존재", "한국은 수출 ASP 상승으로 수익성 개선, 지역별 차별화된 수급 현상 나타남 (수원 등 네트워킹 IC 기판 수요 증가)", "원자재인 ABF, BT, CCL 등 기판 소재 가격 인상과 공급 부족 지속, 리드 타임 장기화로 2027년까지 높은 가격 인상 전망", "AI 서버 수요로 MLCC 수급 격차 확대, 저용량 MLCC는 가격 하락 추세"], "risks": ["2027년까지 주요 기판 및 소재 공급 부족 지속에 따른 생산 차질", "신규 설비 증설 지연 시 공급 부족 심화 가능성", "가격 인상에 따른 산업 전반 수요 둔화 위험", "지역별 공급망 불균형으로 인한 시장 변동성 상승"], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/653309.pdf", "json_path": "../reports_json/산업/653309.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653309"}, {"report_idx": "653303", "categor ummary": "로봇, 방산, 조선 산업 전반에서 공급망 구축과 기술 협력이 활발히 이뤄지고 있으며, 국내 주요 기업들과 글로벌 파트너들의 사업 확장이 진행 중이다. 로봇 산업은 휴머노이드 및 AMR 기술 상용화 초기 단계이나 관련 기업들이 투자를 확대하고 있다. 방산 분야는 다양한 국가들과 협력 및 장비 공급으로 성장세를 유지하며, 조선 산업은 중국의 대규모 생산 능력 확장에 대응하기 위한 경쟁 및 CAPA 증설이 동반되고 있다. 전반적으로 산업 체인 내 협업과 수급 개선이 주요 이슈이며, 정책 및 다국적 협력도 산업 확장에 긍정적 영향으로 작용하고 있다.", "key_points": ["로봇 산업에서는 현대차가 보스턴다이내믹스 휴머노이드 Atlas 양산 공급망을 확정, 현대모비스, 삼성SDI, LG에너지솔루션 등 주요 부품사들이 참여함.", "AMR(자율이동로봇) 관련 티로보틱스가 미국 전쟁부 조건부 승인 획득, 삼성은 열 손가락 휴머노이드 개발 중.", "해외 로봇 업체 유니트리, 일본 야스카와전기가 휴머노이드 상용화 초기 단계 및 출시 계획을 발표.", "방산업계는 한화에어로스페이스가 리투아니아 방산업체들과 협력 강화, UAE 연합훈련 및 다국적 협력 체계 활성화.", "KAI는 12월부터 전투기에서 무인기 직접 통제 예정, 필리핀, 말레이시아 등 아시아 국가에 전투기 및 장비 공급 확대.", "조선 산업은 중국 업체들의 초대형 컨테이너선 수주 및 생산 능력 확장 가속화, 한국 조선사들도 수주잔고 소화와 CAPA 증설 중.", "한화오션과 조선 하청 단체교섭 난항, HD현대마린엔진이 2280만 달러 선박 엔진 수주.", "중국 조선산업은 수년 내 가장 빠른 확장속도를 보이며 다수의 휴면 조선소가 재가동되고 있음."], "risks": [], "alpha_score": null, "alpha_grade": null, "score_reason": null, "positive_factors": [], "negative_factors": [], "revision_signal": null, "structural_growth_signal": null, "valuation_risk_signal": null, "market_reaction_placeholder": {"status": "pending", "d1_return_pct": null, "d5_return_pct": null, "d20_return_pct": null}, "live_price": null, "live_price_change": null, "live_price_rate": null, "live_price_direction": null, "live_price_as_of": null, "live_price_high_52w": null, "price_history": [], "pdf_path": "../reports_pdf/산업/653293.pdf", "json_path": "../reports_json/산업/653293.json", "pdf_url": "https://consensus.hankyung.com/analysis/downpdf?report_idx=653293"}, {"report_idx": "653292", "category": "산업", "published_at": "2026-10-27", "title": "프랑스 시위 확산, 항공 수요는 여전히 견조", "author": "양승윤,임범수", "source": "유진투자증권", "company_name": null, "stock_code": null, "industry_name": "항공운송", "market_topic": null, "investment_opinion": null, "target_price": null, "summary": "프랑스 시위가 장기화 국면에 들어섰으나, 인천-파리 및 유럽 노선 항공 수요는 여전히 견조한 편이다. 국적 주요 항공사들은 파리 노선에서 여객 수요가 일부 증가하고 있으나, 고유가와 감편 영향으로 트리니티항공은 큰 폭 감소세를 보이고 있다. 시위로 인해     function groupedData(items) {
      const groups = new Map();
      const industry = [];
      const market = [];

      for (const item of items) {
        if (item.category === "기업" && item.stock_code) {
          const key = item.stock_code;
          if (!groups.has(key)) {
            groups.set(key, {
              stock_code: item.stock_code,
              company_name: item.company_name || item.title,
              live_price: item.live_price,
              live_price_change: item.live_price_change,
              live_price_rate: item.live_price_rate,
              live_price_as_of: item.live_price_as_of,
              live_price_high_52w: item.live_price_high_52w,
              price_history: item.price_history || [],
              best_alpha_score: item.alpha_score,
              best_alpha_grade: item.alpha_grade,
              reports: [],
            });
          }
          const group = groups.get(key);
          if ((!group.price_history || !group.price_history.length) && item.price_history?.length) {
            group.price_history = item.price_history;
          }
          if ((item.alpha_score || -1) > (group.best_alpha_score || -1)) {
            group.best_alpha_score = item.alpha_score;
            group.best_alpha_grade = item.alpha_grade;
          }
          group.reports.push(item);
        } else if (item.category === "산업") {
          industry.push(item);
        } else {
          market.push(item);
        }
      }

      const groupedCompanies = Array.from(groups.values())
        .map((group) => ({
          ...group,
          reports: group.reports.sort((a, b) => {
            const scoreDiff = (b.alpha_score || -1) - (a.alpha_score || -1);
            if (scoreDiff !== 0) return scoreDiff;
            const sourceA = a.source || "";
            const sourceB = b.source || "";
            return sourceA.localeCompare(sourceB, "ko");
          }),
        }))
        .sort((a, b) => {
          const scoreDiff = (b.best_alpha_score || -1) - (a.best_alpha_score || -1);
          if (scoreDiff !== 0) return scoreDiff;
          const countDiff = b.reports.length - a.reports.length;
          if (countDiff !== 0) return countDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });

      return { groupedCompanies, industry, market };
    }

    function formatQuoteAsOf(value) {
      const text = safe(value);
      const matched = text.match(/(\d{4}\.\d{2}\.\d{2})/);
      if (matched) return `${matched[1].slice(2)} 장마감 기준`;
      return text
        .replace(/^현재가\s*/, "")
        .replace(/\s*기준(?:\(KRX 장마감\)|\(장마감\)|\(KRX장마감\)|\(KRX 마감\))?/g, "")
        .trim();
    }

    function priceDirectionClass(group) {
      const explicit = safe(group.live_price_direction).toLowerCase();
      if (explicit === "up" || explicit === "rise") return "up";
      if (explicit === "down" || explicit === "fall") return "down";

      const changeAmount = parsePriceValue(group.live_price_change);
      const changeRate = parsePriceValue(group.live_price_rate);
      if (Number.isFinite(changeAmount) && changeAmount < 0) return "down";
      if (Number.isFinite(changeRate) && changeRate < 0) return "down";
      if (Number.isFinite(changeAmount) && changeAmount > 0) return "up";
      if (Number.isFinite(changeRate) && changeRate > 0) return "up";

      const text = `${safe(group.live_price_change)} ${safe(group.live_price_rate)}`;
      if (text.includes("-")) return "down";
      return "";
    }

    function renderSparkline(history) {
      const values = (history || [])
        .map((item) => parsePriceValue(item.close))
        .filter((value) => Number.isFinite(value));
      if (values.length < 2) return "";

      const width = 220;
      const height = 40;
      const padding = 2;
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const range = Math.max(maxValue - minValue, 1);
      const points = values.map((value, index) => {
        const x = padding + ((width - padding * 2) * index) / (values.length - 1);
        const y = height - padding - ((value - minValue) / range) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const lastPoint = points[points.length - 1].split(",");
      const trendUp = values[values.length - 1] >= values[0];
      const stroke = trendUp ? "#0d7a5f" : "#ca6702";
      return `
        <div class="price-chart" aria-label="최근 3개월 주가 추이">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-hidden="true">
            <polyline fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${points.join(" ")}"></polyline>
            <circle cx="${lastPoint[0]}" cy="${lastPoint[1]}" r="2.8" fill="${stroke}"></circle>
          </svg>
        </div>
        <div class="price-caption">[3개월 주가 추이]</div>
      `;
    }

      const change = [safe(group.live_price_change), safe(group.live_price_rate)].filter(Boolean).join(" / ");

    async function copyStockCode(stockCode) {
      if (!stockCode) return;
      try {
        await navigator.clipboard.writeText(String(stockCode));
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = String(stockCode);
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      alert(`종목코드 복사: ${stockCode}`);
    }

    async function fetchReportsForDate(date) {
      if (!date) return [];
      if (reportCache.has(date)) return reportCache.get(date) || [];
      try {
        const response = await fetch(`./archive/${date}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const nextReports = payload.reports || [];
        reportCache.set(date, nextReports);
        return nextReports;
      } catch (error) {
        return null;
      }
    }

    async function ensureHistoryLoaded() {
      if (historyLoaded) return true;
      for (const date of availableDates) {
        const loaded = await fetchReportsForDate(date);
        if (loaded === null) return false;
      }
      historyLoaded = true;
      return true;
    }

    function allCachedReports() {
      return Array.from(reportCache.values()).flat();
    }

    function stockCatalog() {
      const grouped = new Map();
      for (const item of allCachedReports()) {
        if (item.category !== "기업" || !item.stock_code) continue;
        const key = item.stock_code;
        if (!grouped.has(key)) {
          grouped.set(key, {
            stock_code: item.stock_code,
            company_name: item.company_name || item.title || item.stock_code,
            report_count: 0,
            dates: new Set(),
            latest_date: item.published_at || "",
          });
        }
        const stock = grouped.get(key);
        stock.report_count += 1;
        if (item.company_name) stock.company_name = item.company_name;
        if (item.published_at) stock.dates.add(item.published_at);
        if ((item.published_at || "") > stock.latest_date) stock.latest_date = item.published_at || "";
      }
      return Array.from(grouped.values());
    }

    function matchingStocks(query) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return [];
      return stockCatalog()
        .map((item) => {
          const name = String(item.company_name || "").toLowerCase();
          const code = String(item.stock_code || "").toLowerCase();
          let score = -1;
          if (code === keyword) score = 100;
          else if (name === keyword) score = 95;
          else if (code.startsWith(keyword)) score = 80;
          else if (name.startsWith(keyword)) score = 70;
          else if (code.includes(keyword)) score = 60;
          else if (name.includes(keyword)) score = 50;
          return { ...item, score };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => {
          const scoreDiff = b.score - a.score;
          if (scoreDiff !== 0) return scoreDiff;
          const dateDiff = (b.latest_date || "").localeCompare(a.latest_date || "");
          if (dateDiff !== 0) return dateDiff;
          return (a.company_name || "").localeCompare(b.company_name || "", "ko");
        });
    }

    }

    function render() {
      renderModes();
      renderDateOptions();
      renderFilters();
      const items = filteredReports();
      renderStats(items);
      if (currentMode === "grouped") {
        renderGrouped(items);
      } else {
        renderList(items);
      }
    }

    async function switchDate(nextDate) {
      if (!nextDate || nextDate === currentDate) return;
      const nextReports = await fetchReportsForDate(nextDate);
      if (nextReports === null) {
        alert(`브리프를 불러오지 못했습니다: ${nextDate}`);
        renderDateOptions();
        return;
      }
      currentDate = nextDate;
      reports = nextReports;
      render();
    }

    document.addEventListener("click", async (event) => {
      const trigger = event.target.closest("[data-copy-stock]");
      if (!trigger) return;
      event.preventDefault();
      await copyStockCode(trigger.getAttribute("data-copy-stock"));
    });

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-stock-history]");
      if (!trigger) return;
      event.preventDefault();
      renderHistoryForStockCompact(trigger.getAttribute("data-stock-history"));
    });

    document.getElementById("search-button").addEventListener("click", () => {
      runStockSearch();
    });

    document.getElementById("stock-search").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runStockSearch();
    });

    render();
    renderHistoryEmpty("종목명 또는 6자리 종목코드로 검색하면 저장된 분석 이력을 볼 수 있습니다.");
  </script>
</body>
</html>
